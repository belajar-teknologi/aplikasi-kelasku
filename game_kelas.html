<script>
/* =========================================================
   KONFIGURASI & STATE GLOBAL
   ========================================================= */
const STORAGE = {
  USER: "edusmart_user",
  APP_CONFIG: "edusmart_app_config",
  JSONBIN_KEY: "edusmart_jsonbin_api_key",
  JSONBIN_TYPE: "edusmart_jsonbin_key_type",
  DB_LOCAL: "edusmart_db"
};

let studentsData = [];        // [{ id, nama, kelas, foto }]
let appConfig = null;         // { binId, namaSekolah, kelas }
let fullDb = null;            // data dari JSONBin
let supabaseClient = null;    // Supabase client

/* ⭐ Player aktif (guru atau siswa) */
let currentPlayer = null;     // { id, nama, kelas, foto, role }

/* =========================================================
   HELPER DASAR
   ========================================================= */
function safeParse(s) { try { return JSON.parse(s); } catch(e) { return null; } }
const getLS = (k, d="") => localStorage.getItem(k) || d;
const setLS = (k, v) => localStorage.setItem(k, v);

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function showToast(message, type = 'info') {
  const toast = document.getElementById('toast-message');
  const toastText = document.getElementById('toast-text');
  const toastIcon = document.getElementById('toast-icon');
  toastText.textContent = message;
  if (type === 'success') toastIcon.className = 'fa-solid fa-circle-check text-green-400 text-xl';
  else if (type === 'error') toastIcon.className = 'fa-solid fa-circle-xmark text-red-400 text-xl';
  else if (type === 'warning') toastIcon.className = 'fa-solid fa-triangle-exclamation text-amber-400 text-xl';
  else toastIcon.className = 'fa-solid fa-circle-info text-yellow-400 text-xl';
  toast.classList.remove('hidden');
  clearTimeout(window.__toastTimeout);
  window.__toastTimeout = setTimeout(() => toast.classList.add('hidden'), 3000);
}

/* =========================================================
   SUPABASE CONFIG DARI JSONBIN (db.cfg)
   ========================================================= */
function initSupabaseFromDb(db) {
  const sbUrl = db?.cfg?.sbUrl || "";
  const sbKey = db?.cfg?.sbKey || "";
  if (sbUrl && sbKey && window.supabase) {
    try {
      supabaseClient = window.supabase.createClient(sbUrl, sbKey);
      console.log("[GameKelas] Supabase siap (dari db.cfg)");
      return true;
    } catch (e) {
      console.error("[GameKelas] Supabase init error:", e);
      supabaseClient = null;
    }
  }
  supabaseClient = null;
  return false;
}

/* =========================================================
   FETCH JSONBIN
   ========================================================= */
async function fetchJsonBinData(binId, opts = {}) {
  const apiKey = (opts.apiKey !== undefined ? opts.apiKey : getLS(STORAGE.JSONBIN_KEY)).trim();
  const keyType = (opts.keyType || getLS(STORAGE.JSONBIN_TYPE, "master")).toLowerCase();

  const headers = {};
  if (apiKey) {
    headers[keyType === "access" ? "X-Access-Key" : "X-Master-Key"] = apiKey;
  }

  const url = `https://api.jsonbin.io/v3/b/${encodeURIComponent(binId)}/latest?meta=false&t=${Date.now()}`;
  const res = await fetch(url, { cache: "no-store", headers });

  if (!res.ok) {
    if (res.status === 401 || res.status === 403) throw new Error("Akses JSONBin ditolak. Bin Private? Cek API key.");
    if (res.status === 404) throw new Error("Bin ID tidak ditemukan.");
    throw new Error(`Gagal ambil data JSONBin (HTTP ${res.status}).`);
  }
  const data = await res.json();
  return data.record || data;
}

/* =========================================================
   NORMALISASI DATA SISWA
   ========================================================= */
function normalizeStudents(db) {
  const rawSw = db.sw || db.siswa || db.students || [];
  if (!Array.isArray(rawSw)) return [];
  return rawSw.map((s, idx) => {
    if (Array.isArray(s)) {
      // Format EduSmart LMS: [id, noAbsen, nis, nama, kelas, jk, username, password, ttl, tgl, alamat, fotoUrl]
      return {
        id: s[0] || `S${idx + 1}`,
        noAbsen: s[1] || idx + 1,
        nis: s[2] || "",
        nama: s[3] || `Siswa ${idx + 1}`,
        kelas: s[4] || "",
        jk: s[5] || "",
        foto: s[11] || `https://placehold.co/200x200/6366f1/ffffff?text=${encodeURIComponent((s[3] || "S").charAt(0))}`
      };
    }
    return {
      id: s.id || `S${idx + 1}`,
      noAbsen: s.noAbsen || idx + 1,
      nis: s.nis || "",
      nama: s.nama || s.name || `Siswa ${idx + 1}`,
      kelas: s.kelas || "",
      jk: s.jk || "",
      foto: s.foto || s.fotoUrl || s.photo || `https://placehold.co/200x200/6366f1/ffffff?text=${encodeURIComponent((s.nama || "S").charAt(0))}`
    };
  }).filter(s => s.nama && !s.nama.toLowerCase().includes("tanpa nama"));
}

/* =========================================================
   ⭐ PLAYER HELPER — Deteksi Guru / Siswa
   ========================================================= */

/**
 * Ambil info player aktif (guru atau siswa)
 * @returns {Object|null} - { id, nama, kelas, foto, role } atau null
 */
function getPlayerAktif() {
  const user = safeParse(getLS(STORAGE.USER));
  if (!user) return null;
  
  // === KASUS 1: GURU ===
  if (user.role === "guru") {
    return {
      id: "guru_" + String(user.username || user.name || "unknown")
            .toLowerCase()
            .replace(/[^a-z0-9]/g, "_")
            .slice(0, 40),
      nama: user.name || "Guru",
      kelas: user.kelas || "",
      foto: fullDb?.a?.fg || user.foto || "",
      role: "guru"
    };
  }
  
  // === KASUS 2: SISWA ===
  if (user.role === "siswa") {
    // Cari di db.sw berdasarkan siswaId
    const sw = (fullDb?.sw || []).find(s => String(s[0]) === String(user.siswaId));
    return {
      id: String(user.siswaId || ""),
      nama: user.name || (sw ? sw[3] : "Siswa"),
      kelas: user.kelas || (sw ? sw[4] : ""),
      foto: sw ? (sw[11] || "") : "",
      role: "siswa"
    };
  }
  
  return null;
}

/**
 * Cek apakah player sudah punya foto profil
 */
function cekPunyaFoto(player) {
  if (!player) return false;
  const foto = String(player.foto || "").trim();
  if (!foto || foto === "null" || foto === "undefined") return false;
  return foto.startsWith("http") || foto.startsWith("data:");
}

/**
 * Ambil daftar "pemain siap" (yang sudah punya foto)
 * - Guru punya foto → ikut masuk (badge GURU)
 * - Siswa tanpa foto → tidak ikut
 */
function getPemainSiap() {
  const player = getPlayerAktif();
  const hasil = [];
  
  // 1. Guru DULU (kalau punya foto)
  if (player && player.role === "guru" && cekPunyaFoto(player)) {
    hasil.push({ ...player, isGuru: true });
  }
  
  // 2. Siswa yang punya foto
  studentsData.forEach(s => {
    const foto = String(s.foto || "").trim();
    if (foto && (foto.startsWith("http") || foto.startsWith("data:"))) {
      hasil.push({ ...s, isGuru: false });
    }
  });
  
  return hasil;
}

/**
 * Cek apakah player aktif siap main (sudah upload foto)
 */
function playerSiapMain() {
  return cekPunyaFoto(getPlayerAktif());
}

/* =========================================================
   AUTO-LOGIN DARI LOCALSTORAGE
   ========================================================= */
async function tryAutoLogin() {
  // 1. Cek user (guru ATAU siswa)
  const user = safeParse(getLS(STORAGE.USER));
  if (!user || (user.role !== "siswa" && user.role !== "guru")) {
    return { ok: false, alasan: "belum_login" };
  }

  // 2. Cek config (binId)
  const cfg = safeParse(getLS(STORAGE.APP_CONFIG));
  if (!cfg?.binId) return { ok: false, alasan: "belum_setup", user };

  // 3. Fetch JSONBin
  try {
    const db = await fetchJsonBinData(cfg.binId);
    const students = normalizeStudents(db);

    // ⭐ Siswa butuh minimal 4. Guru tidak perlu (biar bisa main sendiri)
    if (user.role === "siswa" && students.length < 4) {
      throw new Error(`Data siswa kurang dari 4 (ada ${students.length}). Minimal 4 siswa untuk main game.`);
    }

    // 4. Setup state
    appConfig = { kode: "AUTO", binId: cfg.binId, namaSekolah: db?.a?.ns || user.sekolah || "Sekolah", kelas: user.kelas || "" };
    fullDb = db;
    studentsData = students;

    // 5. Setup currentPlayer (guru atau siswa)
    currentPlayer = getPlayerAktif();

    // 6. Setup Supabase dari db.cfg
    const sbReady = initSupabaseFromDb(db);

    // 7. Simpan db ke localStorage
    setLS(STORAGE.DB_LOCAL, JSON.stringify(db));

    return { ok: true, user, sbReady, player: currentPlayer };
  } catch (err) {
    // Fallback ke cache
    const cached = safeParse(getLS(STORAGE.DB_LOCAL));
    if (cached) {
      const students = normalizeStudents(cached);
      if (user.role === "siswa" && students.length < 4) {
        return { ok: false, alasan: "gagal_fetch", user, error: `Data siswa kurang dari 4 (cache: ${students.length})` };
      }
      fullDb = cached;
      studentsData = students;
      appConfig = { kode: "CACHE", binId: cfg.binId, namaSekolah: cached?.a?.ns || user.sekolah || "Sekolah", kelas: user.kelas || "" };
      currentPlayer = getPlayerAktif();
      initSupabaseFromDb(cached);
      return { ok: true, user, fromCache: true, player: currentPlayer };
    }
    return { ok: false, alasan: "gagal_fetch", user, error: err.message };
  }
}

/* =========================================================
   SCREEN ROUTER
   ========================================================= */
function showScreen(screenId) {
  if (screenId === "menu-screen") renderMenuScreen();
  else if (screenId === "setup-screen") renderSetupScreen();
  else if (screenId === "belum-login-screen") renderBelumLoginScreen();

  // Cleanup timer game
  if (typeof tebakTimerInterval !== 'undefined' && tebakTimerInterval) clearInterval(tebakTimerInterval);
  if (typeof tepukInterval !== 'undefined' && tepukInterval) clearInterval(tepukInterval);
  if (typeof tepukTimerInterval !== 'undefined' && tepukTimerInterval) clearInterval(tepukTimerInterval);
}

/* =========================================================
   SCREEN: SETUP (belum ada binId)
   ========================================================= */
function renderSetupScreen(pesan, userInfo = null) {
  const c = document.getElementById("main-view-container");
  const u = userInfo;
  const isGuru = u?.role === "guru";
  
  c.innerHTML = `
    <div class="max-w-md mx-auto bg-white/95 backdrop-blur-md rounded-3xl p-6 md:p-8 shadow-2xl border-4 border-white fade-in">
      <div class="text-center mb-5">
        <div class="w-16 h-16 bg-gradient-to-br from-purple-500 to-pink-500 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl shadow-lg">
          <i class="fa-solid fa-gear"></i>
        </div>
        <h2 class="text-2xl font-black text-gray-800">Setup Game</h2>
        <p class="text-xs text-gray-500 font-sans mt-1">${esc(pesan || "Hubungkan ke data siswa")}</p>
      </div>

      ${u ? `
        <div class="mb-4 p-3 ${isGuru ? 'bg-indigo-50 border-indigo-200' : 'bg-emerald-50 border-emerald-200'} border rounded-xl text-xs">
          <div class="font-bold ${isGuru ? 'text-indigo-900' : 'text-emerald-900'}">✓ Login terdeteksi ${isGuru ? '(Guru)' : '(Siswa)'}</div>
          <div class="${isGuru ? 'text-indigo-700' : 'text-emerald-700'} mt-0.5">${esc(u.name || (isGuru ? "Guru" : "Siswa"))} · Kelas ${esc(u.kelas || "-")}</div>
        </div>
      ` : `
        <div class="mb-4 p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800">
          <i class="fa-solid fa-triangle-exclamation"></i> Anda belum login. <a href="./index.html" class="underline font-bold">Login dulu di Dashboard</a>.
        </div>
      `}

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-gray-700 mb-1.5 text-sm">Bin ID JSONBin</label>
          <input type="text" id="setup-bin-id" placeholder="6a1da06ffd5d160533f497c"
                 class="w-full px-3 py-2.5 rounded-xl border-2 border-purple-200 focus:border-purple-500 focus:outline-none font-mono text-xs">
          <p class="text-[10px] text-slate-500 mt-1">Dapat dari guru (Pengaturan di Dashboard)</p>
        </div>

        <div>
          <label class="block font-bold text-gray-700 mb-1.5 text-sm">
            API Key JSONBin <span class="text-[10px] font-normal text-slate-400">(opsional)</span>
          </label>
          <input type="text" id="setup-api-key" placeholder="Kosongkan kalau Bin Public"
                 class="w-full px-3 py-2.5 rounded-xl border-2 border-purple-200 focus:border-purple-500 focus:outline-none font-mono text-xs">
          <p class="text-[10px] text-slate-500 mt-1">Bin Private → isi API key. Bin Public → kosongkan.</p>
        </div>

        <button onclick="handleSetupSubmit()" id="setup-submit-btn"
                class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 text-white font-bold py-3 rounded-xl shadow-md transition text-sm">
          <i class="fa-solid fa-link mr-1"></i> Hubungkan
        </button>

        <div id="setup-status" class="hidden text-center p-3 rounded-xl text-xs font-semibold"></div>

        <div class="pt-3 border-t border-gray-100 flex justify-between items-center">
          <a href="./index.html" class="text-[11px] text-slate-500 hover:text-purple-600 underline">
            <i class="fa-solid fa-arrow-left"></i> Kembali ke Dashboard
          </a>
          <button onclick="useDemoMode()" class="text-[11px] text-slate-500 hover:text-purple-600 underline">
            <i class="fa-solid fa-flask"></i> Mode Demo
          </button>
        </div>
      </div>
    </div>`;
}

async function handleSetupSubmit() {
  const binId = (document.getElementById("setup-bin-id").value || "").trim();
  const apiKey = (document.getElementById("setup-api-key").value || "").trim();
  const btn = document.getElementById("setup-submit-btn");
  const statusEl = document.getElementById("setup-status");

  if (!binId) { showToast("Bin ID wajib diisi.", "error"); return; }

  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menghubungkan...';
  statusEl.classList.remove("hidden");
  statusEl.className = "text-center p-3 rounded-xl text-xs font-semibold bg-blue-50 text-blue-700";
  statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengambil data siswa...';

  try {
    // Fetch JSONBin
    const db = await fetchJsonBinData(binId, { apiKey, keyType: "master" });
    const students = normalizeStudents(db);
    const user = safeParse(getLS(STORAGE.USER)) || {};
    
    // ⭐ Siswa butuh minimal 4. Guru tidak.
    if (user.role === "siswa" && students.length < 4) {
      throw new Error(`Data siswa kurang dari 4 (ada ${students.length})`);
    }

    // Simpan binId + apiKey
    setLS(STORAGE.APP_CONFIG, JSON.stringify({ binId }));
    if (apiKey) {
      setLS(STORAGE.JSONBIN_KEY, apiKey);
      setLS(STORAGE.JSONBIN_TYPE, "master");
    }

    // Setup state
    fullDb = db;
    studentsData = students;
    appConfig = { kode: "SETUP", binId, namaSekolah: db?.a?.ns || user.sekolah || "Sekolah", kelas: user.kelas || "" };
    
    // ⭐ Setup currentPlayer
    currentPlayer = getPlayerAktif();

    // Supabase dari db.cfg
    const sbReady = initSupabaseFromDb(db);

    setLS(STORAGE.DB_LOCAL, JSON.stringify(db));

    statusEl.className = "text-center p-3 rounded-xl text-xs font-semibold bg-green-50 text-green-700";
    statusEl.innerHTML = `<i class="fa-solid fa-circle-check"></i> Berhasil! ${students.length} siswa dimuat.`;

    showToast("Berhasil terhubung!", "success");
    setTimeout(() => showScreen("menu-screen"), 700);
  } catch (err) {
    statusEl.className = "text-center p-3 rounded-xl text-xs font-semibold bg-red-50 text-red-700";
    statusEl.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> ${esc(err.message)}`;
    showToast("Gagal: " + err.message, "error");
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-link mr-1"></i> Hubungkan';
  }
}

/* ⭐ Render grid pemain siap */
function renderStudentGrid() {
  const grid = document.getElementById("student-grid");
  if (!grid) return;
  
  const pemainSiap = getPemainSiap();
  grid.innerHTML = "";
  
  if (!pemainSiap.length) {
    grid.innerHTML = `
      <div class="col-span-full text-center text-slate-400 text-xs py-4">
        <i class="fa-solid fa-users-slash text-2xl mb-2"></i>
        <p>Belum ada pemain yang punya foto profil.</p>
      </div>`;
    return;
  }
  
  pemainSiap.forEach(p => {
    const avatar = document.createElement("div");
    avatar.className = "flex flex-col items-center text-center relative";
    const borderWarna = p.isGuru ? "border-indigo-500" : "border-purple-300";
    const ringClass = p.isGuru ? "ring-2 ring-indigo-300" : "";
    
    avatar.innerHTML = `
      <div class="relative">
        <img src="${esc(p.foto)}" 
             class="w-9 h-9 rounded-full object-cover border-2 ${borderWarna} shadow-sm ${ringClass}" 
             onerror="this.src='https://placehold.co/100?text=Err'">
        ${p.isGuru ? `<span class="absolute -top-1 -right-1 bg-indigo-600 text-white text-[7px] font-bold px-1 py-0.5 rounded-full shadow">GURU</span>` : ""}
      </div>
      <span class="text-[9px] ${p.isGuru ? 'text-indigo-700 font-bold' : 'text-gray-600'} truncate w-full font-sans mt-0.5">
        ${esc(p.nama)}
      </span>`;
    grid.appendChild(avatar);
  });
}

function toggleStudentList() {
  const grid = document.getElementById("student-grid");
  const btn = document.getElementById("toggle-student-btn");
  if (!grid || !btn) return;
  if (grid.classList.contains("max-h-20")) {
    grid.classList.remove("max-h-20");
    btn.textContent = "Sembunyikan";
  } else {
    grid.classList.add("max-h-20");
    btn.textContent = "Tampilkan Semua";
  }
}

/* =========================================================
   SIMPAN SKOR
   ========================================================= */
async function saveScoreToSupabase({ gameId, skor, jumlahBenar, jumlahSalah, waktuMulai, waktuSelesai, detail }) {
  // ⭐ Pakai currentPlayer (support guru & siswa)
  const player = getPlayerAktif();
  if (!player) {
    showToast("Player tidak terdeteksi. Coba login ulang.", "error");
    return;
  }
  
  const siswaId = String(player.id);
  const kelas = String(player.kelas || appConfig?.kelas || "Unspecified");
  const durasiDetik = Math.max(1, Math.round((waktuSelesai - waktuMulai) / 1000));
  const namaSiswa = player.nama || "Pemain";
  const role = player.role || "siswa";

  const payload = {
    siswa_id: siswaId,
    kelas: kelas,
    game_id: String(gameId),
    skor: parseInt(skor) || 0,
    jumlah_benar: parseInt(jumlahBenar) || 0,
    jumlah_salah: parseInt(jumlahSalah) || 0,
    waktu_mulai: waktuMulai.toISOString(),
    waktu_selesai: waktuSelesai.toISOString(),
    durasi_detik: durasiDetik,
    detail: { ...(detail || {}), role: role }
  };

  // 1. Simpan lokal (selalu)
  const localScores = safeParse(getLS("gamekelas_local_scores")) || [];
  localScores.unshift({
    ...payload,
    nama_siswa: namaSiswa,
    role: role,
    created_at: new Date().toISOString()
  });
  setLS("gamekelas_local_scores", JSON.stringify(localScores.slice(0, 50)));

  // 2. Simpan ke Supabase (kalau aktif)
  if (supabaseClient) {
    try {
      const { error } = await supabaseClient.from("skor_game").insert([payload]);
      if (error) {
        console.error("Supabase insert error:", error);
        showToast("Skor tersimpan lokal (gagal ke server).", "warning");
      } else {
        const badge = role === "guru" ? " (Guru)" : "";
        showToast(`Skor tersimpan ke server${badge}! ☁️`, "success");
      }
    } catch (err) {
      console.error("Exception:", err);
      showToast("Skor tersimpan lokal.", "info");
    }
  } else {
    showToast("Skor tersimpan lokal.", "info");
  }

  // 3. Refresh papan skor
  setTimeout(() => refreshScoreboard(), 500);
}

/* =========================================================
   PAPAN SKOR
   ========================================================= */
async function refreshScoreboard() {
  const section = document.getElementById("scoreboard-section");
  const list = document.getElementById("scoreboard-list");
  if (!section || !list) return;

  section.classList.remove("hidden");

  const player = getPlayerAktif();
  const myId = String(player?.id || "");

  list.innerHTML = `<p class="text-center text-gray-400 py-4 text-xs"><i class="fa-solid fa-spinner fa-spin"></i> Memuat...</p>`;

  try {
    let scores = [];

    if (supabaseClient) {
      try {
        const { data, error } = await supabaseClient
          .from("skor_game")
          .select("*")
          .order("created_at", { ascending: false })
          .limit(10);
        if (!error && data) scores = data;
      } catch (e) { console.warn("Supabase scoreboard gagal:", e); }
    }

    if (!scores.length) {
      const local = safeParse(getLS("gamekelas_local_scores")) || [];
      scores = local.slice(0, 10);
    }

    if (!scores.length) {
      list.innerHTML = `<p class="text-center text-gray-400 py-4 text-xs">Belum ada skor. Main dulu yuk! 🎮</p>`;
      return;
    }

    // ⭐ Info player (support guru & siswa)
    const getPlayerInfo = (item) => {
      const sid = String(item.siswa_id);
      
      if (sid.startsWith("guru_")) {
        const guruName = fullDb?.a?.ng || item.nama_siswa || "Guru";
        return { nama: guruName, role: "guru", isGuru: true };
      }
      
      const s = studentsData.find(x => String(x.id) === sid);
      if (s) return { nama: s.nama, role: "siswa", isGuru: false };
      
      if (item.nama_siswa) return { nama: item.nama_siswa, role: item.role || "siswa", isGuru: item.role === "guru" };
      
      return { nama: `Siswa ${sid}`, role: "siswa", isGuru: false };
    };

    const gameInfo = {
      "tebak_muka": { icon: "fa-eye", color: "bg-yellow-100 text-yellow-700", label: "Tebak Muka" },
      "tepuk_teman": { icon: "fa-hand-pointer", color: "bg-pink-100 text-pink-700", label: "Tepuk Teman" },
      "memory_match": { icon: "fa-clone", color: "bg-emerald-100 text-emerald-700", label: "Memory" },
      "susun_nama": { icon: "fa-arrow-down-a-z", color: "bg-indigo-100 text-indigo-700", label: "Susun Nama" }
    };

    list.innerHTML = scores.map((item, i) => {
      const isMe = String(item.siswa_id) === myId;
      const info = gameInfo[item.game_id] || { icon: "fa-gamepad", color: "bg-slate-100 text-slate-700", label: item.game_id };
      const pInfo = getPlayerInfo(item);
      const waktu = item.created_at
        ? new Date(item.created_at).toLocaleString("id-ID", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "short" })
        : "-";
      
      const guruBadge = pInfo.isGuru 
        ? `<span class="text-[8px] bg-indigo-600 text-white px-1 py-0.5 rounded-full font-bold ml-1">GURU</span>` 
        : "";

      return `
        <div class="score-row flex items-center gap-2 p-2.5 rounded-xl ${isMe ? 'bg-amber-100 border-2 border-amber-300' : 'bg-slate-50 border border-slate-200'}">
          <div class="w-8 h-8 rounded-lg ${info.color} flex items-center justify-center shrink-0">
            <i class="fa-solid ${info.icon} text-xs"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="font-bold text-[11px] truncate ${isMe ? 'text-amber-900' : 'text-slate-800'} flex items-center">
              ${esc(pInfo.nama)}${guruBadge}${isMe ? ' <span class="text-[9px] bg-amber-600 text-white px-1.5 py-0.5 rounded-full ml-1">KAMU</span>' : ''}
            </div>
            <div class="text-[10px] text-slate-500 truncate">
              ${esc(info.label)} · ✓${item.jumlah_benar || 0} ✗${item.jumlah_salah || 0} · ${waktu}
            </div>
          </div>
          <div class="text-right shrink-0">
            <div class="font-black text-base ${isMe ? 'text-amber-700' : 'text-purple-700'}">${item.skor || 0}</div>
            <div class="text-[9px] text-slate-400">${item.durasi_detik || 0}s</div>
          </div>
        </div>`;
    }).join("");

    const subtitle = document.getElementById("scoreboard-subtitle");
    if (subtitle) subtitle.textContent = `10 skor terbaru`;

  } catch (err) {
    console.error(err);
    list.innerHTML = `<p class="text-center text-red-500 py-4 text-xs">Gagal memuat: ${esc(err.message)}</p>`;
  }
}

function nextTebakRound() {

    saveScoreToSupabase({

      waktuMulai: tebakStartTime, waktuSelesai: endTime,

    });
    setTimeout(() => showScreen('menu-screen'), 1500);
    return;
  }
  
  // ⭐ Pakai getPemainSiap()
  const pemainSiap = getPemainSiap();
  if (pemainSiap.length < 4) {
    showToast("Pemain siap kurang dari 4. Game dihentikan.", "error");

    return;

  document.getElementById('tebak-score').textContent = tebakScore;

  currentTargetStudent = pemainSiap[Math.floor(Math.random() * pemainSiap.length)];
  const imgEl = document.getElementById('tebak-img');
  const blurOverlay = document.getElementById('tebak-blur-overlay');
  const timerBar = document.getElementById('tebak-timer-bar');

  imgEl.src = currentTargetStudent.foto;
  currentBlurLevel = 24;
  blurOverlay.style.backdropFilter = `blur(${currentBlurLevel}px)`;
  timerBar.style.width = '100%';

  const options = [currentTargetStudent];
  while (options.length < 4) {
    const r = pemainSiap[Math.floor(Math.random() * pemainSiap.length)];
    if (!options.find(o => o.id === r.id)) options.push(r);
  }
  options.sort(() => Math.random() - 0.5);

  const optContainer = document.getElementById('tebak-options-container');
  optContainer.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');

    btn.textContent = opt.nama;
    btn.onclick = () => handleTebakAnswer(opt.id, btn);
    optContainer.appendChild(btn);
  });

  if (tebakTimerInterval) clearInterval(tebakTimerInterval);
  let timeLeft = 100;
  tebakTimerInterval = setInterval(() => {
    timeLeft -= 2;
    timerBar.style.width = `${timeLeft}%`;
    currentBlurLevel = Math.max(0, currentBlurLevel - 0.5);
    blurOverlay.style.backdropFilter = `blur(${currentBlurLevel}px)`;
    if (timeLeft <= 0) {
      clearInterval(tebakTimerInterval);
      handleTebakAnswer(null);
    }
  }, 100);
}

function handleTebakAnswer(selectedId, btnEl = null) {
  clearInterval(tebakTimerInterval);
  document.getElementById('tebak-blur-overlay').style.backdropFilter = 'blur(0px)';
  const correct = selectedId === currentTargetStudent.id;
  if (correct) {
    tebakScore += Math.ceil(currentBlurLevel + 10);

    tebakWrongCount++;
    if (btnEl) { btnEl.classList.remove('bg-slate-100'); btnEl.classList.add('bg-red-500','text-white','border-red-600'); }
    showToast(`Salah! Itu ${currentTargetStudent.nama}`, "error");
  }
  tebakRound++;
  setTimeout(() => nextTebakRound(), 1500);
}

function startTepukGameLoop() {
  tepukScore = 0; tepukBenar = 0; tepukSalah = 0; tepukTimeLeft = 30;

  document.getElementById('tepuk-score').textContent = tepukScore;

  setNewTepukTarget();

  tepukTimerInterval = setInterval(() => {
    tepukTimeLeft--;
    document.getElementById('tepuk-timer').textContent = tepukTimeLeft;
    if (tepukTimeLeft <= 0) endTepukGame();
  }, 1000);

  tepukInterval = setInterval(() => popUpStudent(), 900);
}

function setNewTepukTarget() {
  const pemainSiap = getPemainSiap();
  if (!pemainSiap.length) return;
  tepukTarget = pemainSiap[Math.floor(Math.random() * pemainSiap.length)];
  document.getElementById('tepuk-target-name').textContent = `Tepuk: ${tepukTarget.nama}!`;
}

function popUpStudent() {
  const pemainSiap = getPemainSiap();
  if (!pemainSiap.length || !tepukTarget) return;
  
  for (let i = 0; i < 9; i++) document.getElementById(`hole-${i}`).classList.add('translate-y-full');
  const holeIdx = Math.floor(Math.random() * 9);
  const randomStudent = (Math.random() > 0.4) ? tepukTarget : pemainSiap[Math.floor(Math.random() * pemainSiap.length)];
  const holeEl = document.getElementById(`hole-${holeIdx}`);
  const imgEl = document.getElementById(`hole-img-${holeIdx}`);
  const nameEl = document.getElementById(`hole-name-${holeIdx}`);
  imgEl.src = randomStudent.foto;
  nameEl.textContent = randomStudent.nama;
  holeEl.dataset.studentId = randomStudent.id;
  holeEl.classList.remove('translate-y-full');
  setTimeout(() => holeEl.classList.add('translate-y-full'), 800);
}

function hitHole(idx) {
  const holeEl = document.getElementById(`hole-${idx}`);
  const clickedId = holeEl.dataset.studentId;
  if (clickedId === tepukTarget.id) {
    tepukScore += 10; tepukBenar++;
    document.getElementById('tepuk-score').textContent = tepukScore;
    holeEl.classList.add('translate-y-full');
    showToast("+10 Tepukan Tepat!", "success");
    setNewTepukTarget();
  } else {
    tepukScore = Math.max(0, tepukScore - 5); tepukSalah++;
    document.getElementById('tepuk-score').textContent = tepukScore;
    showToast("-5 Salah Tepuk!", "error");
  }
}

function endTepukGame() {
  clearInterval(tepukInterval);
  clearInterval(tepukTimerInterval);
  for (let i = 0; i < 9; i++) document.getElementById(`hole-${i}`).classList.add('translate-y-full');
  const endTime = new Date();
  showToast(`Waktu Habis! Skor: ${tepukScore}`, "success");
  document.getElementById('tepuk-start-btn').classList.remove('hidden');
  saveScoreToSupabase({

    waktuMulai: tepukStartTime, waktuSelesai: endTime,
    detail: { target_terakhir: tepukTarget ? tepukTarget.nama : null }
  });
}

   GAME 3: MEMORY MATCH

let memoryCards = [], flippedCards = [], matchedCount = 0, memoryMoves = 0, memoryStartTime = null;

function startMemoryGame() {
  // ⭐ Cek player siap main
  if (!playerSiapMain()) {
    alertUploadFoto();
    return;
  }
  
  const pemainSiap = getPemainSiap();
  if (pemainSiap.length < 6) {
    showToast(`Minimal 6 pemain siap (ada ${pemainSiap.length}). Ajak teman upload foto dulu!`, "error");
    return;
  }
  
  renderMemoryScreen();
  memoryMoves = 0; matchedCount = 0; flippedCards = [];
  memoryStartTime = new Date();
  document.getElementById('memory-moves').textContent = '0';
  document.getElementById('memory-matched-count').textContent = '0/6';

  const shuffled = [...pemainSiap].sort(() => Math.random() - 0.5).slice(0, 6);
  let deck = [];
  shuffled.forEach((s, idx) => {
    deck.push({ id: `p_${idx}`, studentId: s.id, type: 'photo', content: s.foto, nama: s.nama });
    deck.push({ id: `n_${idx}`, studentId: s.id, type: 'name', content: s.nama, nama: s.nama });
  });
  deck.sort(() => Math.random() - 0.5);
  memoryCards = deck;

  const grid = document.getElementById('memory-grid');
  grid.innerHTML = '';
  deck.forEach((card, i) => {
    const cardEl = document.createElement('div');
    cardEl.className = 'w-full aspect-square bg-emerald-500 rounded-2xl flex items-center justify-center cursor-pointer shadow-md hover:scale-105 transition transform text-white font-bold p-2 text-center text-xs relative select-none';
    cardEl.id = `mem-card-${i}`;
    cardEl.innerHTML = `<span class="text-2xl">❓</span>`;
    cardEl.onclick = () => handleMemoryCardClick(i);
    grid.appendChild(cardEl);
  });
}

function renderMemoryScreen() {
  const c = document.getElementById("main-view-container");
  c.innerHTML = `
    <div class="w-full max-w-2xl mx-auto bg-white rounded-3xl p-6 md:p-8 shadow-2xl border-4 border-emerald-200">
      <div class="flex justify-between items-center mb-4">
        <button onclick="showScreen('menu-screen')" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-xs font-bold">
          <i class="fa-solid fa-arrow-left"></i> Menu
        </button>
        <div class="flex gap-3">
          <div class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-xs font-bold">Pasangan: <span id="memory-matched-count">0/6</span></div>
          <div class="bg-purple-100 text-purple-800 px-3 py-1 rounded-full text-xs font-bold">Langkah: <span id="memory-moves">0</span></div>
        </div>
      </div>
      <div class="text-center mb-4 font-sans text-xs text-gray-500">Cocokkan kartu foto siswa dengan kartu namanya!</div>
      <div class="grid grid-cols-3 sm:grid-cols-4 gap-3 max-w-md mx-auto" id="memory-grid"></div>
    </div>`;
}

function handleMemoryCardClick(index) {
  if (flippedCards.length >= 2) return;
  const cardEl = document.getElementById(`mem-card-${index}`);
  const card = memoryCards[index];
  if (cardEl.classList.contains('matched')) return;
  if (flippedCards.some(f => f.index === index)) return;

  cardEl.classList.remove('bg-emerald-500');
  cardEl.classList.add('bg-white','text-emerald-900','border-2','border-emerald-400');
  if (card.type === 'photo') cardEl.innerHTML = `<img src="${card.content}" class="w-full h-full object-cover rounded-xl">`;
  else cardEl.innerHTML = `<span class="font-extrabold text-xs text-purple-700">${card.content}</span>`;

  flippedCards.push({ index, card });
  if (flippedCards.length === 2) {
    memoryMoves++;
    document.getElementById('memory-moves').textContent = memoryMoves;
    checkMemoryMatch();
  }
}

function checkMemoryMatch() {
  const [c1, c2] = flippedCards;
  if (c1.card.studentId === c2.card.studentId && c1.card.type !== c2.card.type) {
    matchedCount++;
    document.getElementById('memory-matched-count').textContent = `${matchedCount}/6`;
    document.getElementById(`mem-card-${c1.index}`).classList.add('matched','opacity-60');
    document.getElementById(`mem-card-${c2.index}`).classList.add('matched','opacity-60');
    showToast("Cocok! 🎉", "success");
    flippedCards = [];
    if (matchedCount === 6) {
      const endTime = new Date();
      const finalScore = Math.max(10, 100 - (memoryMoves - 6) * 10);
      showToast(`Hebat! Selesai dalam ${memoryMoves} langkah!`, "success");
      saveScoreToSupabase({
        gameId: 'memory_match', skor: finalScore,
        jumlahBenar: 6, jumlahSalah: memoryMoves - 6,
        waktuMulai: memoryStartTime, waktuSelesai: endTime,
        detail: { total_moves: memoryMoves }
      });
      setTimeout(() => showScreen('menu-screen'), 2000);
    }
  } else {
    setTimeout(() => {
      [c1, c2].forEach(c => {
        const el = document.getElementById(`mem-card-${c.index}`);
        el.className = 'w-full aspect-square bg-emerald-500 rounded-2xl flex items-center justify-center cursor-pointer shadow-md hover:scale-105 transition transform text-white font-bold p-2 text-center text-xs relative select-none';
        el.innerHTML = `<span class="text-2xl">❓</span>`;
      });
      flippedCards = [];
    }, 1000);
  }
}

  for (let i = 0; i < cleanName.length; i++) {
    const slot = document.createElement('div');
    slot.className = 'w-10 h-10 rounded-xl border-2 border-indigo-300 bg-indigo-50 flex items-center justify-center font-black text-indigo-800 text-lg shadow-inner';
    slot.textContent = selectedLetters[i] ? selectedLetters[i].letter : '';
    answerBox.appendChild(slot);
  }

  scrambledLetters.forEach((char, idx) => {
    const isUsed = selectedLetters.some(item => item.idx === idx);
    const btn = document.createElement('button');
    btn.className = `w-10 h-10 rounded-xl font-black text-lg shadow-md transition transform ${isUsed ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 text-white hover:scale-105'}`;
    btn.textContent = char;
    btn.disabled = isUsed;
    btn.onclick = () => { selectedLetters.push({ letter: char, idx }); renderSusunUI(); };
    poolBox.appendChild(btn);
  });

  if (selectedLetters.length === cleanName.length) {
    const userWord = selectedLetters.map(i => i.letter).join('');
    if (userWord === cleanName) {
      susunScore += 20; susunBenar++;
      showToast("Tepat! 🎉", "success");
    } else {
      susunSalah++;
      showToast(`Salah! Yang benar: ${susunTargetStudent.nama}`, "error");
    }
    susunRound++;
    setTimeout(() => nextSusunRound(), 1500);
  }
}

function resetCurrentSusunRound() {
  selectedLetters = [];
  renderSusunUI();
}

/* =========================================================
   P8: BOOT LOG & SAFETY CHECK
   ========================================================= */
function bootLogAndSafetyCheck() {
  const VERSION = "v2.0-guru-support";
  console.log(`%c🎮 Game Kelas ${VERSION}`, "background:#6366f1;color:#fff;padding:4px 8px;border-radius:4px;font-weight:bold;");
  
  const requiredFns = [
    "getPlayerAktif", "cekPunyaFoto", "getPemainSiap", "playerSiapMain",
    "alertUploadFoto", "renderStudentGrid", "refreshScoreboard",
    "openLeaderboardModal", "startTebakGame", "startTepukGame",
    "startMemoryGame", "startSusunGame"
  ];
  
  const missing = requiredFns.filter(fn => typeof window[fn] !== "function");
  if (missing.length) {
    console.error("❌ Fungsi hilang:", missing);
    showToast(`Warning: ${missing.length} fungsi belum terdefinisi`, "warning");
  } else {
    console.log(`✅ Semua ${requiredFns.length} fungsi inti terdefinisi.`);
  }
  
  // Update badge
  const badge = document.getElementById("data-status-badge");
  if (badge) badge.textContent = `Game Kelas ${VERSION}`;
}

/* =========================================================
   INIT
   ========================================================= */
window.addEventListener("load", async () => {
  console.log("🎮 Game Kelas siap. Cek session...");
  
  // P8: Boot log & safety check
  bootLogAndSafetyCheck();

  const hasil = await tryAutoLogin();

  if (hasil.ok) {
    const roleInfo = hasil.user.role === "guru" ? "Guru" : "Siswa";
    showToast(`Halo ${hasil.user.name}! (${roleInfo}) 🎮`, "success");
    showScreen("menu-screen");

    // ⭐ Refresh skor setelah 500ms
    setTimeout(() => {
      refreshScoreboard();
    }, 500);
    return;
  }

  if (hasil.alasan === "belum_setup") {
    renderSetupScreen("Butuh Bin ID JSONBin dari guru", hasil.user);
    return;
  }

  if (hasil.alasan === "gagal_fetch") {
    renderSetupScreen(`Gagal: ${hasil.error}`, hasil.user);
    return;
  }

  // Belum login
  renderBelumLoginScreen();
});
</script>
