const CLOUDINARY_JSON_PRESET = "DATA_CONFIG";

// ⭐ BARU v5: Konstanta migrasi & cache

const FIELD = {
  SISWA: { ID: 0, NOABSEN: 1, NIS: 2, NAMA: 3, KELAS: 4, JK: 5, USER: 6, PASS: 7, TTL: 8, TGL: 9, ALAMAT: 10, FOTO: 11 },
  MAPEL: { ID: 0, KODE: 1, NAMA: 2, KKM: 3, PENGAMPU: 4 },
  NILAI: { ID: 0, SISWA_ID: 1, MAPEL_KODE: 2, SCORES: 3 },
  ABSEN: { ID: 0, TGL: 1, SISWA_ID: 2, STATUS: 3 },
  JURNAL: { ID: 0, TGL: 1, KELAS: 2, MAPEL: 3, TOPIK: 4, CATATAN: 5 },
  PENGUMUMAN: { ID: 0, JUDUL: 1, TGL: 2, ISI: 3, TARGET: 4 },

/* =========================================================
   ⭐ BARU v5: SQL MIGRASI FASE 1 (TERTANAM DI KODE)
   Copy ke Supabase SQL Editor → Run
   ========================================================= */
const SUPABASE_SQL_MIGRASI_FASE1 = `-- ============================================================
-- EDUSMART MIGRASI FASE 1 — MASTER CONFIG (JSONB)
-- Versi: 1.0
-- Aman dijalankan berkali-kali (idempotent).
-- Data JSONBin TIDAK disentuh — ini tabel baru.
-- ============================================================

-- ─── 1. TABEL MASTER CONFIG ───
CREATE TABLE IF NOT EXISTS public.master_config (
    id            TEXT PRIMARY KEY,
    payload       JSONB NOT NULL DEFAULT '{}'::jsonb,
    kode_aplikasi TEXT,
    updated_at    TIMESTAMPTZ DEFAULT NOW(),
    created_at    TIMESTAMPTZ DEFAULT NOW()
);

-- Baris utama untuk database EduSmart
INSERT INTO public.master_config (id, payload, kode_aplikasi)
VALUES ('app_master', '{}'::jsonb, NULL)
ON CONFLICT (id) DO NOTHING;

-- ─── 2. TABEL APP REGISTRY (multi-kode, future-proof) ───
CREATE TABLE IF NOT EXISTS public.app_registry (
    kode_aplikasi  TEXT PRIMARY KEY,
    bin_id         TEXT,
    nama_sekolah   TEXT,
    nama_guru      TEXT,
    payload        JSONB,
    cloudinary_url TEXT,
    created_at     TIMESTAMPTZ DEFAULT NOW(),
    updated_at     TIMESTAMPTZ DEFAULT NOW()
);

-- ─── 3. MATIKAN RLS ───
ALTER TABLE public.master_config DISABLE ROW LEVEL SECURITY;
ALTER TABLE public.app_registry  DISABLE ROW LEVEL SECURITY;

-- ─── 4. GRANT AKSES ANON ───
GRANT ALL ON public.master_config TO anon, authenticated, service_role;
GRANT ALL ON public.app_registry  TO anon, authenticated, service_role;

-- ─── 5. INDEX ───
CREATE INDEX IF NOT EXISTS idx_master_config_kode
    ON public.master_config(kode_aplikasi);
CREATE INDEX IF NOT EXISTS idx_app_registry_sekolah
    ON public.app_registry(nama_sekolah);

-- ─── 6. TRIGGER AUTO-UPDATE updated_at ───
CREATE OR REPLACE FUNCTION public.touch_updated_at()
RETURNS TRIGGER AS $$
BEGIN
    NEW.updated_at = NOW();
    RETURN NEW;
END;
$$ LANGUAGE plpgsql;

DROP TRIGGER IF EXISTS trg_master_config_touch ON public.master_config;
CREATE TRIGGER trg_master_config_touch
    BEFORE UPDATE ON public.master_config
    FOR EACH ROW EXECUTE FUNCTION public.touch_updated_at();

DROP TRIGGER IF EXISTS trg_app_registry_touch ON public.app_registry;
CREATE TRIGGER trg_app_registry_touch
    BEFORE UPDATE ON public.app_registry
    FOR EACH ROW EXECUTE FUNCTION public.touch_updated_at();

-- ─── 7. FUNCTION RPC: GET MASTER CONFIG ───
CREATE OR REPLACE FUNCTION public.get_master_config(p_id TEXT DEFAULT 'app_master')
RETURNS JSONB AS $$
DECLARE result JSONB;
BEGIN
    SELECT payload INTO result FROM public.master_config WHERE id = p_id;
    RETURN COALESCE(result, '{}'::jsonb);
END;
$$ LANGUAGE plpgsql SECURITY DEFINER;

GRANT EXECUTE ON FUNCTION public.get_master_config(TEXT)
    TO anon, authenticated, service_role;

-- ─── 8. FUNCTION RPC: SAVE MASTER CONFIG (UPSERT) ───
CREATE OR REPLACE FUNCTION public.save_master_config(
    p_id TEXT, p_payload JSONB, p_kode_aplikasi TEXT DEFAULT NULL
)
RETURNS BOOLEAN AS $$
BEGIN
    INSERT INTO public.master_config (id, payload, kode_aplikasi, updated_at)
    VALUES (p_id, p_payload, p_kode_aplikasi, NOW())
    ON CONFLICT (id) DO UPDATE
        SET payload       = EXCLUDED.payload,
            kode_aplikasi = COALESCE(EXCLUDED.kode_aplikasi,
                                     public.master_config.kode_aplikasi),
            updated_at    = NOW();
    RETURN TRUE;
END;
$$ LANGUAGE plpgsql SECURITY DEFINER;

GRANT EXECUTE ON FUNCTION public.save_master_config(TEXT, JSONB, TEXT)
    TO anon, authenticated, service_role;

-- ─── 9. RELOAD SCHEMA POSTGREST ───
NOTIFY pgrst, 'reload schema';

-- ─── 10. VERIFIKASI ───

const SUPABASE_SETUP_SQL = `-- ============================================================
-- EDUSMART SETUP v5 - SATU KALI JALAN UNTUK SEMUA
-- Jalankan di Supabase SQL Editor. Cukup sekali saja.
-- ============================================================

CREATE OR REPLACE FUNCTION create_dynamic_table(p_table_name TEXT, p_columns JSONB)
RETURNS VOID AS $$
DECLARE
  col_record RECORD;
  sql_query TEXT;
BEGIN
  IF p_table_name !~ '^[a-z][a-z0-9_]*$' THEN
    RAISE EXCEPTION 'Nama tabel hanya boleh huruf kecil, angka, dan underscore';
  END IF;
  sql_query := format('CREATE TABLE IF NOT EXISTS public.%I (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    created_at TIMESTAMPTZ DEFAULT now()', p_table_name);
  FOR col_record IN SELECT * FROM jsonb_to_recordset(p_columns) AS (name text, type text)
  LOOP
    IF col_record.type NOT IN ('text','integer','numeric','boolean','timestamptz','date','time','jsonb','bigint','real') THEN
      RAISE EXCEPTION 'Tipe kolom % tidak diizinkan', col_record.type;
    END IF;
    IF col_record.name !~ '^[a-z][a-z0-9_]*$' THEN
      RAISE EXCEPTION 'Nama kolom % tidak valid', col_record.name;
    END IF;
    sql_query := sql_query || format(', %I %s', col_record.name, col_record.type);
  END LOOP;
  sql_query := sql_query || ');';
  EXECUTE sql_query;
  EXECUTE format('GRANT ALL ON public.%I TO anon, authenticated, service_role', p_table_name);
END;
$$ LANGUAGE plpgsql SECURITY DEFINER;

GRANT EXECUTE ON FUNCTION create_dynamic_table(TEXT, JSONB) TO anon, authenticated, service_role;

CREATE OR REPLACE FUNCTION get_public_tables()
RETURNS TABLE (table_name text) AS $$
BEGIN
  RETURN QUERY
  SELECT t.table_name::text FROM information_schema.tables t
  WHERE t.table_schema = 'public' AND t.table_type = 'BASE TABLE'
    AND t.table_name NOT IN ('spatial_ref_sys');
END;
$$ LANGUAGE plpgsql SECURITY DEFINER;
GRANT EXECUTE ON FUNCTION get_public_tables() TO anon, authenticated, service_role;

CREATE OR REPLACE FUNCTION exec_sql(query text)
RETURNS void AS $$ BEGIN EXECUTE query; END; $$ LANGUAGE plpgsql SECURITY DEFINER;

-- ================= AUTO-CLEANUP LOG AKTIVITAS =================
-- Hapus otomatis log lama, sisakan 20 log terbaru.

CREATE OR REPLACE FUNCTION public.trim_log_aktivitas()
RETURNS TRIGGER AS $$
BEGIN
  DELETE FROM public.log_aktivitas
  WHERE id IN (
    SELECT id FROM public.log_aktivitas
    ORDER BY created_at DESC
    OFFSET 20
  );
  RETURN NEW;
END;
$$ LANGUAGE plpgsql SECURITY DEFINER;

DROP TRIGGER IF EXISTS trg_trim_log_aktivitas ON public.log_aktivitas;
CREATE TRIGGER trg_trim_log_aktivitas
  AFTER INSERT ON public.log_aktivitas
  FOR EACH STATEMENT
  EXECUTE FUNCTION public.trim_log_aktivitas();

/* =========================================================
   SUPABASE — CLIENT DASAR
   ========================================================= */
function sbHeaders(extra={}) { 
  const sb=getSupabaseConfig(); 
  if (!sb) throw new Error("Supabase belum dikonfigurasi."); 
  return { "apikey": sb.key, "Authorization": `Bearer ${sb.key}`, "Content-Type":"application/json", ...extra }; 
}
async function sbRpc(namaRpc, params={}) {
  const sb=getSupabaseConfig(); 
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  const res=await fetch(`${sb.url}/rest/v1/rpc/${namaRpc}`, { method:"POST", headers: sbHeaders(), body: JSON.stringify(params) });
  const text=await res.text(); 
  let data=null; 
  try { data=text?JSON.parse(text):null; } catch(e) { data=text; }
  if (!res.ok) throw new Error(data?.message||data?.error||`HTTP ${res.status}`); 
  return data;
}
async function sbFetch(table, query="") { 
  const sb=getSupabaseConfig(); 
  if (!sb) throw new Error("Supabase belum dikonfigurasi."); 
  const res=await fetch(`${sb.url}/rest/v1/${table}${query}`, { headers: sbHeaders() }); 
  if (!res.ok) throw new Error(`Fetch ${table} gagal (${res.status}).`); 
  return res.json(); 
}
async function sbInsert(table, rows) { 
  const sb=getSupabaseConfig(); 
  if (!sb) throw new Error("Supabase belum dikonfigurasi."); 
  const res=await fetch(`${sb.url}/rest/v1/${table}`, { 
    method:"POST", 
    headers: sbHeaders({ "Prefer":"return=minimal" }), 
    body: JSON.stringify(Array.isArray(rows)?rows:[rows]) 
  }); 
  if (!res.ok) { const t=await res.text(); throw new Error(`Insert ${table} gagal: ${t}`); } 
  return true; 
}
async function sbUpsert(table, rows) { 
  if (!rows.length) return true; 
  const sb=getSupabaseConfig(); 
  if (!sb) throw new Error("Supabase belum dikonfigurasi."); 
  const res=await fetch(`${sb.url}/rest/v1/${table}`, { 
    method:"POST", 
    headers: sbHeaders({ "Prefer":"resolution=merge-duplicates,return=minimal" }), 
    body: JSON.stringify(rows) 
  }); 
  if (!res.ok) { const t=await res.text(); throw new Error(`Upsert ${table} gagal: ${t}`); } 
  return true; 
}

/* =========================================================
   ⭐ BARU v5: SUPABASE MASTER CONFIG (pengganti JSONBin utama)
   ========================================================= */
async function sbGetMasterConfig(id) {
  id = id || "app_master";
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  
  const res = await fetch(
    `${sb.url}/rest/v1/master_config?id=eq.${encodeURIComponent(id)}&select=payload`,
    { headers: sbHeaders() }
  );
  if (!res.ok) throw new Error(`Fetch master_config gagal (${res.status}).`);
  const rows = await res.json();
  if (!rows.length) return null;
  return rows[0].payload || null;
}

async function sbSaveMasterConfig(id, payload, kodeAplikasi) {
  id = id || "app_master";
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  
  const res = await fetch(`${sb.url}/rest/v1/master_config`, {
    method: "POST",
    headers: sbHeaders({ "Prefer": "resolution=merge-duplicates,return=minimal" }),
    body: JSON.stringify([{
      id: id,
      payload: payload,
      kode_aplikasi: kodeAplikasi || null,
      updated_at: new Date().toISOString()
    }])
  });
  if (!res.ok) {
    const t = await res.text();
    throw new Error(`Save master_config gagal: ${t}`);
  }
  return true;
}

/* =========================================================
   JSONBIN — CLIENT (untuk fallback & backup)
   ========================================================= */
function getJsonBinHeaders(cred, withCT=false) { 
  const h={}; 
  if (withCT) h["Content-Type"]="application/json"; 
  if (cred?.key) h[cred.type==="access"?"X-Access-Key":"X-Master-Key"]=cred.key; 
  return h; 
}
async function createJsonBinDB(database, kode, nama) {
  const cred=getJsonBinCredential(); 
  if (!cred) throw new Error("API Key JSONBin belum ada.");
  const res=await fetch(`${JSONBIN_API_BASE}/b`, { 
    method:"POST", 
    headers: { ...getJsonBinHeaders(cred,true), "X-Bin-Private":"false", "X-Bin-Name":String(nama).slice(0,128) }, 
    body: JSON.stringify(database) 
  });
  const text=await res.text(); 
  let result=null; 
  try { result=JSON.parse(text); } catch(e) {}
  if (!res.ok || !result?.metadata?.id) throw new Error(result?.message||`HTTP ${res.status}`); 
  return result;
}
async function loadJsonBinDB(binId, cred) {
  const c=cred||getJsonBinCredential(); 
  const h={}; 
  if (c) h[c.type==="access"?"X-Access-Key":"X-Master-Key"]=c.key;
  const res=await fetch(`${JSONBIN_API_BASE}/b/${encodeURIComponent(binId)}/latest?meta=false`, { cache:"no-store", headers: h });
  const text=await res.text(); 
  let data=null; 
  try { data=JSON.parse(text); } catch(e) {}
  if (!res.ok) throw new Error(data?.message||`HTTP ${res.status}`);
  return data?.record && typeof data.record==="object" ? data.record : data;
}
async function updateJsonBinDB() {
  const cfg=getAppConfig(); 
  const cred=getJsonBinCredential(); 
  if (!cfg?.binId || !cred) return false;
  try {
    appState.db.mn=appState.menus;
    const res=await fetch(`${JSONBIN_API_BASE}/b/${encodeURIComponent(cfg.binId)}`, { 
      method:"PUT", 
      headers: getJsonBinHeaders(cred,true), 
      body: JSON.stringify(appState.db) 
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`); 
    setLS("edusmart_last_sync", new Date().toISOString()); 
    return true;
  } catch(err) { 
    console.warn("JSONBin sync gagal:", err); 
    return false; 
  }
}

/* =========================================================
   ⭐ BARU v5: LOAD MASTER DB — Supabase PRIMARY, JSONBin FALLBACK
   ========================================================= */
async function loadMasterDB(binId, cred) {
  const source = getPrimarySource();
  const sb = getSupabaseConfig();
  
  // ─── Coba Supabase dulu (PRIMARY) ───
  if (source === "supabase" && sb) {
    try {
      console.log("[MasterDB] Coba Supabase...");
      const payload = await sbGetMasterConfig("app_master");
      if (payload && Object.keys(payload).length > 0) {
        console.log("[MasterDB] ✓ Supabase berhasil");
        setMasterCache(payload);
        return payload;
      }
      console.warn("[MasterDB] Supabase kosong, fallback ke JSONBin...");
    } catch(e) {
      console.warn("[MasterDB] Supabase gagal:", e.message, "→ fallback JSONBin");
    }
  }
  
  // ─── Fallback: JSONBin ───
  if (!binId) throw new Error("Bin ID tidak tersedia untuk fallback.");
  console.log("[MasterDB] Coba JSONBin (fallback)...");
  const data = await loadJsonBinDB(binId, cred);
  if (data && typeof data === "object") {
    setMasterCache(data);
  }
  return data;
}

/* =========================================================
   ⭐ BARU v5: SAVE MASTER DB — Supabase PRIMARY, JSONBin opsional
   ========================================================= */
async function saveMasterDB(payload, options) {
  options = options || {};
  const { alsoJsonBin = false, binId = null, cred = null } = options;
  
  const sb = getSupabaseConfig();
  const cfg = getAppConfig();
  const kodeApp = cfg?.kodeAplikasi || payload?.a?.k || null;
  
  let savedTo = [];
  
  // ─── Simpan ke Supabase (PRIMARY) ───
  if (sb) {
    try {
      await sbSaveMasterConfig("app_master", payload, kodeApp);
      savedTo.push("supabase");
      setMasterCache(payload);
    } catch(e) {
      console.warn("[MasterDB] Save ke Supabase gagal:", e.message);
    }
  }
  
  // ─── Opsional: simpan juga ke JSONBin (backup) ───
  if (alsoJsonBin && (binId || cfg?.binId)) {
    try {
      const c = cred || getJsonBinCredential();
      if (c) {
        const bid = binId || cfg.binId;
        const res = await fetch(`${JSONBIN_API_BASE}/b/${encodeURIComponent(bid)}`, {
          method: "PUT",
          headers: getJsonBinHeaders(c, true),
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          savedTo.push("jsonbin");
        } else {
          console.warn("[MasterDB] Save ke JSONBin gagal: HTTP", res.status);
        }
      }
    } catch(e) {
      console.warn("[MasterDB] Save ke JSONBin error:", e.message);
    }
  }
  
  // ─── Selalu simpan lokal ───
  savedTo.push("local");
  
  return {
    supabase: savedTo.includes("supabase"),
    jsonbin: savedTo.includes("jsonbin"),
    local: true,
    sumber: savedTo.includes("supabase") ? "supabase" 
           : savedTo.includes("jsonbin") ? "jsonbin" 
           : "local"
  };
}

/* =========================================================
   ⭐ BARU v5: MIGRASI 1× — PINDAHKAN DATA JSONBIN → SUPABASE
   ========================================================= */
async function mulaiMigrasiKeSupabase() {
  const cfg = getAppConfig();
  const sb = getSupabaseConfig();
  const cred = getJsonBinCredential();
  
  if (!sb) {
    showToast("Supabase belum di-setup. Isi URL & Key dulu.", "error");
    return;
  }
  if (!cfg?.binId) {
    showToast("Bin ID JSONBin tidak ditemukan.", "error");
    return;
  }
  
  if (!confirm(
    "⚠️ MIGRASI DATA ⚠️\n\n" +
    "Data dari JSONBin akan disalin ke Supabase.\n" +
    "Data JSONBin TIDAK akan dihapus.\n\n" +
    "Lanjutkan?"
  )) return;
  
  showLoading(true, "Membaca JSONBin...");
  
  try {
    // ─── 1. Baca dari JSONBin (murni READ) ───
    console.log("[Migrasi] Baca JSONBin...");
    const jsonbinData = await loadJsonBinDB(cfg.binId, cred);
    
    if (!jsonbinData || typeof jsonbinData !== "object") {
      throw new Error("Data JSONBin kosong atau tidak valid.");
    }
    
    const jumlahField = Object.keys(jsonbinData).length;
    console.log(`[Migrasi] ✓ Terbaca ${jumlahField} field dari JSONBin`);
    
    showLoading(true, `Menyalin ${jumlahField} field ke Supabase...`);
    
    // ─── 2. Siapkan payload untuk Supabase ───
    const payload = { ...jsonbinData };
    
    if (appState.menus && appState.menus.length) {
      payload.mn = appState.menus;
    }
    
    // ─── 3. Simpan ke Supabase master_config ───
    await sbSaveMasterConfig(
      "app_master",
      payload,
      jsonbinData?.a?.k || cfg.kodeAplikasi || null
    );
    
    console.log("[Migrasi] ✓ Payload utama tersimpan ke Supabase");
    
    // ─── 4. Migrasi tabel relasional ───
    const stats = { nilai: 0, absensi: 0, jurnal: 0 };
    
    if ((jsonbinData.nl || []).length) {
      try {
        showLoading(true, `Migrasi nilai (${jsonbinData.nl.length} baris)...`);
        const nilaiRows = jsonbinData.nl.map(arr => {
          const mk = arr[FIELD.NILAI.MAPEL_KODE];
          const nc = getKomponenByMapel(mk);
          const o = nilaiToObj(arr, nc);
          return {
            id: String(o.id),
            siswa_id: String(o.siswaId),
            mapel_kode: o.mapelKode,
            scores: o.scores,
            updated_at: new Date().toISOString()
          };
        });
        await sbUpsert("nilai", nilaiRows);
        stats.nilai = nilaiRows.length;
        console.log(`[Migrasi] ✓ ${stats.nilai} nilai tersimpan`);
      } catch(e) {
        console.warn("[Migrasi] Nilai gagal:", e.message);
      }
    }
    
    if ((jsonbinData.ab || []).length) {
      try {
        showLoading(true, `Migrasi absensi (${jsonbinData.ab.length} baris)...`);
        const absenRows = jsonbinData.ab.map(arr => {
          const o = absenToObj(arr);
          return {
            id: String(o.id),
            tanggal: o.tanggal,
            siswa_id: String(o.siswaId),
            status: o.status,
            updated_at: new Date().toISOString()
          };
        });
        await sbUpsert("absensi", absenRows);
        stats.absensi = absenRows.length;
        console.log(`[Migrasi] ✓ ${stats.absensi} absensi tersimpan`);
      } catch(e) {
        console.warn("[Migrasi] Absensi gagal:", e.message);
      }
    }
    
    if ((jsonbinData.jr || []).length) {
      try {
        showLoading(true, `Migrasi jurnal (${jsonbinData.jr.length} baris)...`);
        const jurnalRows = jsonbinData.jr.map(arr => {
          const o = jurnalToObj(arr);
          return {
            id: String(o.id),
            tanggal: o.tanggal,
            kelas: o.kelas,
            mapel: o.mapel,
            topik: o.topik,
            catatan: o.catatan,
            updated_at: new Date().toISOString()
          };
        });
        await sbUpsert("jurnal", jurnalRows);
        stats.jurnal = jurnalRows.length;
        console.log(`[Migrasi] ✓ ${stats.jurnal} jurnal tersimpan`);
      } catch(e) {
        console.warn("[Migrasi] Jurnal gagal:", e.message);
      }
    }
    
    // ─── 5. Set primary source = supabase ───
    setPrimarySource("supabase");
    setMasterCache(payload);
    setLS(STORAGE.LAST_AUTO_REFRESH, String(Date.now()));
    saveLocal();
    
    showLoading(false);
    showToast("✓ Migrasi selesai!", "success");
    
    // ─── 6. Tampilkan laporan ───
    const mb = document.getElementById("modal-body");
    mb.innerHTML = `
      <div class="text-center space-y-4 p-4">
        <div class="w-20 h-20 mx-auto rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-4xl">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <h3 class="text-xl font-extrabold text-emerald-700">Migrasi Berhasil!</h3>
        <p class="text-xs text-slate-500">Data JSONBin sudah tersalin ke Supabase.</p>

        <div class="grid grid-cols-2 gap-2 text-xs text-left bg-slate-50 rounded-xl p-4">
          <div class="font-semibold text-slate-600">Sumber:</div>
          <div class="font-mono">JSONBin (read-only)</div>
          <div class="font-semibold text-slate-600">Tujuan:</div>
          <div class="font-mono">Supabase master_config</div>
          <div class="font-semibold text-slate-600">Field utama:</div>
          <div class="font-bold text-indigo-600">${jumlahField} field</div>
          <div class="font-semibold text-slate-600">Nilai:</div>
          <div class="font-bold text-indigo-600">${stats.nilai} baris</div>
          <div class="font-semibold text-slate-600">Absensi:</div>
          <div class="font-bold text-indigo-600">${stats.absensi} baris</div>
          <div class="font-semibold text-slate-600">Jurnal:</div>
          <div class="font-bold text-indigo-600">${stats.jurnal} baris</div>
        </div>

        <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-[11px] text-emerald-800">
          <i class="fa-solid fa-shield-halved"></i> 
          Data di JSONBin <b>TIDAK dihapus</b>. Jadi tetap aman sebagai backup.
        </div>

        <button onclick="closeModal();renderMainContent()" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl">
          Selesai & Tutup
        </button>
      </div>
    `;
    
    addActivity("migrasi_ke_supabase", 
      `Migrasi ${jumlahField} field + ${stats.nilai} nilai + ${stats.absensi} absensi + ${stats.jurnal} jurnal dari JSONBin ke Supabase`);
    
  } catch(err) {
    showLoading(false);
    showToast("Migrasi gagal: " + err.message, "error");
    console.error("[Migrasi] Error:", err);
  }
}

/* =========================================================
   ACTIVITY LOG — v5 (HANYA Supabase, tanpa JSONBin write)
   ========================================================= */
function addActivity(tipe, detail, extra={}) {
  const user = appState.currentUser; 
  if (!user) return;
  
  const log = { 
    id: Date.now() + Math.floor(Math.random() * 1000), 
    tipe, user: user.name, role: user.role, detail, 
    waktu: new Date().toISOString(), 
    sent: false, 
    ...extra 
  };
  
  // ⭐ Simpan lokal sebagai cache (max 50)
  appState.db.al = appState.db.al || [];
  appState.db.al.push(logArr(log));
  if (appState.db.al.length > 50) {
    appState.db.al = appState.db.al.slice(-50);
  }
  
  // ⭐ HANYA kirim ke Supabase — TIDAK ADA updateJsonBinDB() di sini
  const userId = user.siswaId || user.username || user.name;
  kirimLogKeSupabase({ ...log, userId })
    .then(function(ok) { if (ok) log.sent = true; })
    .catch(function(){});
  
  // ⭐ Simpan lokal saja, tanpa auto-save JSONBin
  saveLocal();
}

function getMergedActivity() { 
  const arr=appState.db.al||[]; 
  const objs=arr.map(logToObj); 
  objs.sort((a,b)=>new Date(b.waktu)-new Date(a.waktu)); 
  return objs.slice(0,10); 
}

/* =========================================================
   ⭐ REFRESH DATA — Supabase PRIMARY, TTL 48 jam
   ========================================================= */
async function refreshDataDariCloud(force) {
  const cfg = getAppConfig();
  const sb = getSupabaseConfig();
  if (!cfg?.binId && !sb) return false;
  
  // ─── Cek TTL 48 jam ───
  if (!force) {
    const lastRefresh = Number(localStorage.getItem(STORAGE.LAST_AUTO_REFRESH) || 0);
    const elapsed = Date.now() - lastRefresh;
    const TTL = MASTER_CACHE_TTL_MS;
    
    if (elapsed < TTL) {
      const jam = Math.floor(elapsed / 3600000);
      const sisaJam = Math.ceil((TTL - elapsed) / 3600000);
      console.log(`[Refresh] Skip — ${jam} jam lalu (sisa ${sisaJam} jam)`);
      return false;
    }
  }
  
  try {
    console.log(`[Refresh] Fetching dari ${getPrimarySource()}...`);
    const freshDb = await loadMasterDB(cfg.binId);
    if (!freshDb) return false;
    
    // ⭐ Update data yang relevan
    if (freshDb.ab) appState.db.ab = freshDb.ab;
    if (freshDb.nl) appState.db.nl = freshDb.nl;
    if (freshDb.jr) appState.db.jr = freshDb.jr;
    if (freshDb.sw) appState.db.sw = freshDb.sw;
    if (freshDb.mp) appState.db.mp = freshDb.mp;
    if (freshDb.pg) appState.db.pg = freshDb.pg;
    if (freshDb.hk) appState.db.hk = freshDb.hk;
    if (freshDb.ncPerMapel) appState.db.ncPerMapel = freshDb.ncPerMapel;
    if (freshDb.md) appState.db.md = freshDb.md;
    if (freshDb.a) appState.db.a = { ...appState.db.a, ...freshDb.a };
    
    // ⭐ BARU: Sync MENU dari cloud (guru baru tambah menu)
    if (Array.isArray(freshDb.mn) && freshDb.mn.length) {
      // Gabungkan menu default + menu custom dari cloud
      // Jangan timpa kalau menu lokal lebih baru
      const menulokal = appState.menus || [];
      const menuCloud = freshDb.mn || [];
      
      // Ambil custom menu dari cloud
      const customCloud = menuCloud.filter(m => m.isCustom);
      const customLokal = menulokal.filter(m => m.isCustom);
      
      // Kalau cloud punya custom menu yang tidak ada di lokal → tambahkan
      customCloud.forEach(mc => {
        if (!customLokal.find(ml => ml.id === mc.id)) {
          menulokal.push(mc);
          console.log(`[Refresh] + Menu baru dari cloud: ${mc.name}`);
        }
      });
      
      // Kalau lokal punya custom menu yang tidak ada di cloud → hapus
      // (artinya sudah dihapus guru dari device lain)
      const idCloud = customCloud.map(m => m.id);
      appState.menus = menulokal.filter(m => !m.isCustom || idCloud.includes(m.id));
      
      setLS(STORAGE.MENUS, JSON.stringify(appState.menus));
      console.log(`[Refresh] Total menu: ${appState.menus.length}`);
    }
    
    saveLocal();
    setLS(STORAGE.LAST_AUTO_REFRESH, String(Date.now()));
    console.log("[Refresh] ✓ Data berhasil di-refresh");
    return true;
  } catch(e) {
    console.warn("[Refresh] ✗ Gagal:", e.message);
    return false;
  }
}


/* ⭐ Force refresh — untuk tombol manual */
async function forceRefreshData() {
  showLoading(true, "Memperbarui data...");

  if (ok) {

  }
}

/* ⭐ KURIR SIMPAN: Coba Supabase dulu, gagal → JSONBin, gagal → Lokal */
async function saveWithFallback(namaOperasi, supabaseFn, jsonbinFn) {
  const hasil = { supabase: false, jsonbin: false, local: false, sumber: "none" };
  
  try {
    console.log("[Save] " + namaOperasi + ": mencoba Supabase...");
    await supabaseFn();
    hasil.supabase = true;
    hasil.sumber = "supabase";
    console.log("[Save] OK " + namaOperasi + ": Supabase berhasil");
    return hasil;
  } catch(e) {
    console.warn("[Save] Supabase gagal: " + e.message);
  }
  
  try {
    console.log("[Save] " + namaOperasi + ": fallback ke JSONBin...");
    await jsonbinFn();
    hasil.jsonbin = true;
    hasil.sumber = "jsonbin";
    console.log("[Save] OK " + namaOperasi + ": JSONBin berhasil");
    return hasil;
  } catch(e) {
    console.warn("[Save] JSONBin gagal: " + e.message);
  }
  
  saveLocal();
  hasil.local = true;
  hasil.sumber = "local";
  console.log("[Save] Hanya lokal: " + namaOperasi);
  return hasil;
}

/* =========================================================
   CLOUDINARY & UPLOAD
   ========================================================= */
function getConfigUrl(kode) { 
  return CLOUDINARY_RAW_BASE + encodeURIComponent(`edusmart-${kode}.json`); 
}
async function uploadConfigCloudinary(configObj, kode) {
  const endpoint=`https://api.cloudinary.com/v1_1/${CLOUDINARY_JSON_CLOUD}/raw/upload`;
  const fileName=`edusmart-${kode}.json`;
  const blob=new Blob([JSON.stringify(configObj,null,2)], { type:"application/json" });
  const form=new FormData(); 
  form.append("file",blob,fileName); 
  form.append("upload_preset",CLOUDINARY_JSON_PRESET); 
  form.append("public_id",fileName);
  const res=await fetch(endpoint, { method:"POST", body: form });
  const text=await res.text(); 
  let r=null; 
  try { r=JSON.parse(text); } catch(e) {}
  if (!res.ok || !r?.secure_url) throw new Error(r?.error?.message||`HTTP ${res.status}`); 
  return r;
}
async function loadConfigByCode(kode) {
  const code=String(kode||"").trim().toUpperCase(); 
  if (!code) throw new Error("Kode Aplikasi kosong.");
  const url=getConfigUrl(code); 
  const res=await fetch(url+`?t=${Date.now()}`, { cache:"no-store" });
  if (!res.ok) throw new Error(`Kode ${code} tidak ditemukan.`);
  const cfg=await res.json(); 
  const binId=cfg.binId||cfg.database?.binId;
  if (!binId || cfg.kodeAplikasi!==code) throw new Error("Config tidak valid.");
  
  // ⭐ Auto-set Access Key kalau user belum punya kredensial
  if (cfg.database?.accessKey && !getJsonBinCredential()) {
    saveJsonBinCredential(cfg.database.accessKey, "access");
  }
  
  // ⭐ v5.1: JANGAN overwrite primary source user
  // Cuma set kalau belum pernah diset user
  if (cfg.database?.provider && !localStorage.getItem(STORAGE.PRIMARY_SOURCE)) {
    console.log("[Config] Set primary source pertama kali:", cfg.database.provider);
    setPrimarySource(cfg.database.provider);
  } else {
    console.log("[Config] Primary source sudah diset user:",
      localStorage.getItem(STORAGE.PRIMARY_SOURCE), "— skip");
  }
  
  return { ...cfg, binId, guruCredentials: cfg.guruCredentials, cloudinaryUrl: url };
}

async function uploadFile(file, folder="edusmart/profile") {
  if (file.size>5*1024*1024) throw new Error("Ukuran file maksimal 5 MB.");
  const cloudName=String(getLS(STORAGE.CLOUD_NAME)).trim(); 
  const cloudPreset=String(getLS(STORAGE.CLOUD_PRESET)).trim();
  if (cloudName && cloudPreset) {
    try {
      const form=new FormData(); 
      form.append("file",file); 
      form.append("upload_preset",cloudPreset); 
      if (folder) form.append("folder",folder);
      const res=await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, { method:"POST", body:form });
      const r=await res.json(); 
      if (res.ok && r?.secure_url) return { url: r.secure_url, publicId: r.public_id, provider: "cloudinary" };
    } catch(err) { 
      console.warn("Cloudinary gagal:", err); 
    }
  }
  const sb=getSupabaseConfig();
  if (sb) {
    try {
      const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
      const fileName=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
      const res=await fetch(`${sb.url}/storage/v1/object/${SUPABASE_BUCKET}/${fileName}`, { 
        method:"POST", 
        headers: { "apikey": sb.key, "Authorization": `Bearer ${sb.key}`, "Content-Type": file.type, "x-upsert":"true" }, 
        body: file 
      });
      if (res.ok) return { url: `${sb.url}/storage/v1/object/public/${SUPABASE_BUCKET}/${fileName}`, publicId: fileName, provider: "supabase" };
    } catch(err) { 
      console.warn("Supabase gagal:", err); 
    }
  }
  return { url: "", publicId: "", provider: "none" };
}

async function sha256(text) { 
  const buf=new TextEncoder().encode(String(text)); 
  const hash=await crypto.subtle.digest("SHA-256", buf); 
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join(""); 
}

/* =========================================================
   NUMPAD
   ========================================================= */
window.__numpad = { target: null, value: "", cells: [], totalRows: 0, totalCols: 0 };
function getAllNilaiInputs() { 
  return Array.from(document.querySelectorAll('input[data-numpad="nilai"]')); 
}
function computeNumpadGeometry(cells) {
  if (!cells || !cells.length) return { rows: 0, cols: 0 };
  const firstRow=cells[0].parentElement.parentElement; 
  if (!firstRow) return { rows: 0, cols: 0 };
  const tbody=firstRow.parentElement; 
  if (!tbody) return { rows: 0, cols: 0 };
  const rows=tbody.querySelectorAll("tr").length;
  const cols=rows>0?Math.round(cells.length/rows):0; 
  return { rows, cols };
}
function openNumpad(inputEl) {
  if (!inputEl || inputEl.dataset.numpad!=="nilai") return;
  const np=document.getElementById("numpad-float"); 
  if (!np) return;
  const all=getAllNilaiInputs(); 
  const geom=computeNumpadGeometry(all);
  window.__numpad.target=inputEl; 
  window.__numpad.cells=all;
  window.__numpad.totalRows=geom.rows; 
  window.__numpad.totalCols=geom.cols;
  window.__numpad.value=String(inputEl.value||"").replace(/[^0-9]/g,""); 
  if (window.__numpad.value==="") window.__numpad.value="0";
  document.getElementById("np-student-name").textContent=inputEl.dataset.namaSiswa||"—";
  document.getElementById("np-context").textContent=inputEl.dataset.konteks||"≡ GESER ≡";
  updateNumpadDisplay(); 
  np.style.display="block";
  if (window.innerWidth>=768) {
    const r=inputEl.getBoundingClientRect(); 
    const w=np.offsetWidth||280; 
    const h=np.offsetHeight||380;
    let left=r.right+10; 
    let top=r.top;
    if (left+w>window.innerWidth-10) left=Math.max(10, r.left-w-10);
    if (top+h>window.innerHeight-10) top=Math.max(10, window.innerHeight-h-10);
    if (left<10) left=10; 
    if (top<10) top=10;
    np.style.left=left+"px"; 
    np.style.top=top+"px";
  } else { 
    np.style.left=""; 
    np.style.top=""; 
  }
  const sz=getLS(STORAGE.NUMPAD_SIZE,"normal"); 
  if (sz==="large") np.classList.add("np-large"); 
  else np.classList.remove("np-large");
  document.querySelectorAll(".nilai-input-active").forEach(x=>x.classList.remove("nilai-input-active"));
  inputEl.classList.add("nilai-input-active"); 
  updateNumpadDisplay();
}
function updateNumpadDisplay() { 
  const d=document.getElementById("np-display"); 
  if (d) d.textContent=window.__numpad.value||"0"; 
}
function npPress(v) {
  if (v==="100") window.__numpad.value="100";
  else { 
    let cur=window.__numpad.value; 
    if (cur==="100") cur="0"; 
    if (cur==="0") cur=""; 
    cur+=v; 
    let n=parseInt(cur,10); 
    if (isNaN(n)) n=0; 
    if (n>100) n=100; 
    window.__numpad.value=String(n); 
  }
  updateNumpadDisplay();
}
function npBack() { 
  window.__numpad.value=window.__numpad.value.slice(0,-1); 
  updateNumpadDisplay(); 
}
function nextNumpadTarget() {
  const cells=window.__numpad.cells; 
  const t=window.__numpad.target; 
  if (!cells.length||!t) return null;
  const idx=cells.indexOf(t); 
  if (idx<0) return null;
  const rows=window.__numpad.totalRows||1; 
  const cols=window.__numpad.totalCols||1;
  const totalCells=cells.length; 
  const currentRow=idx%rows; 
  const currentCol=Math.floor(idx/rows);
  if (currentRow<rows-1) { 
    const ni=idx+1; 
    if (ni<totalCells) return cells[ni]; 
  }
  if (currentCol<cols-1) { 
    const ni=(currentCol+1)*rows; 
    if (ni<totalCells) return cells[ni]; 
  }
  return null;
}
function npOk() {
  const t=window.__numpad.target; 
  if (!t) { 
    closeNumpad(); 
    return; 
  }
  t.value=window.__numpad.value||"0"; 
  t.dispatchEvent(new Event("change",{bubbles:true}));
  const next=nextNumpadTarget();
  if (next) { 
    setTimeout(()=>{ 
      try { next.scrollIntoView({behavior:"smooth",block:"center"}); } 
      catch(e) { next.scrollIntoView(); } 
      setTimeout(()=>openNumpad(next),120); 
    },60); 
  }
  else { 
    closeNumpad(); 
    showToast("✓ Semua kolom terisi. Jangan lupa klik Simpan.","info"); 
  }
}
function closeNumpad() { 
  const np=document.getElementById("numpad-float"); 
  if (np) np.style.display="none"; 
  window.__numpad.target=null; 
  window.__numpad.cells=[]; 
  document.querySelectorAll(".nilai-input-active").forEach(x=>x.classList.remove("nilai-input-active")); 
}
function npZoom(d) { 
  const np=document.getElementById("numpad-float"); 
  if (!np) return; 
  const isL=np.classList.contains("np-large"); 
  if (d>0 && !isL) { 
    np.classList.add("np-large"); 
    setLS(STORAGE.NUMPAD_SIZE,"large"); 
  } else if (d<0 && isL) { 
    np.classList.remove("np-large"); 
    setLS(STORAGE.NUMPAD_SIZE,"normal"); 
  } 
}
function initNumpadDrag() {
  const el=document.getElementById("numpad-float"); 
  if (!el) return;
  let startX, startY, startL, startT, dragging=false;
  const onDown=(e)=>{ 
    if (e.target.closest("button")) return; 
    if (window.innerWidth<768) return; 
    const p=e.touches?e.touches[0]:e; 
    startX=p.clientX; 
    startY=p.clientY; 
    startL=parseInt(el.style.left,10)||0; 
    startT=parseInt(el.style.top,10)||0; 
    dragging=true; 
    document.addEventListener("mousemove",onMove); 
    document.addEventListener("touchmove",onMove,{passive:false}); 
    document.addEventListener("mouseup",onUp); 
    document.addEventListener("touchend",onUp); 
  };
  const onMove=(e)=>{ 
    if (!dragging) return; 
    const p=e.touches?e.touches[0]:e; 
    const nl=Math.max(0,Math.min(window.innerWidth-el.offsetWidth,startL+p.clientX-startX)); 
    const nt=Math.max(0,Math.min(window.innerHeight-el.offsetHeight,startT+p.clientY-startY)); 
    el.style.left=nl+"px"; 
    el.style.top=nt+"px"; 
    if (e.cancelable) e.preventDefault(); 
  };
  const onUp=()=>{ 
    dragging=false; 
    document.removeEventListener("mousemove",onMove); 
    document.removeEventListener("touchmove",onMove); 
    document.removeEventListener("mouseup",onUp); 
    document.removeEventListener("touchend",onUp); 
  };
  el.addEventListener("mousedown",onDown); 
  el.addEventListener("touchstart",onDown,{passive:true});
}

async function handleLogin(e) {
  e.preventDefault();
  const role=document.getElementById("login-role").value;
  const code=document.getElementById("login-code").value.trim().toUpperCase();
  const username=document.getElementById("login-username").value.trim();
  const password=document.getElementById("login-password").value;
  if (!code) { showToast("Kode Aplikasi wajib.","error"); return; }
  if (!username||!password) { showToast("Username & Password wajib.","error"); return; }
  showLoading(true,"Memverifikasi...");
  try {
    const cfg=await loadConfigByCode(code); 
    // ⭐ BARU: Pakai loadMasterDB (Supabase primary, JSONBin fallback)
    const db=await loadMasterDB(cfg.binId);
    
    if (role==="guru") {
      const gc=db.a?.gc||cfg.guruCredentials; 
      if (!gc) throw new Error("Kredensial guru tidak ditemukan.");
      const gcUser=Array.isArray(gc)?gc[0]:gc.username; 
      const gcPass=Array.isArray(gc)?gc[1]:gc.password; 
      const gcHash=Array.isArray(gc)?gc[2]:gc.passwordHash;
      if (gcUser!==username) throw new Error("Username guru salah.");
      let ok=false; 
      if (gcHash) { 
        const h=await sha256(password); 
        ok=h===gcHash; 
      }
      if (!ok && gcPass) ok=gcPass===password; 
      if (!ok) throw new Error("Password guru salah.");
      appState.db=db; 
      ensureMasterData(); 
      restoreMenusFromDb(db); 
      restoreCredsFromDb(db); 
      saveAppConfig(cfg); 
      setLS(STORAGE.APP_CODE,code);
      appState.currentUser={ username: gcUser, name: db.a?.ng||cfg.namaGuru||"Guru", role:"guru", sekolah: db.a?.ns||cfg.namaSekolah||"", kelas: db.a?.kl||cfg.kelas||"" };
      setLS(STORAGE.USER, JSON.stringify(appState.currentUser)); 
      setLS(STORAGE.DB, JSON.stringify(appState.db));
      appState.activeView="dashboard"; 
      addActivity("login_guru",`${appState.currentUser.name} login`); // ⭐ HANYA Supabase
      showLoading(false); 
      showToast(`Selamat datang, ${appState.currentUser.name}!`,"success"); 
      renderApp(); 
      return;
    }
    
    const sw=(db.sw||[]).find(s=>String(s[FIELD.SISWA.USER]||"").toLowerCase()===username.toLowerCase() && String(s[FIELD.SISWA.PASS])===password);
    if (!sw) throw new Error("Username atau password siswa salah.");
    const siswa=siswaToObj(sw);
    appState.db=db; 
    ensureMasterData(); 
    restoreMenusFromDb(db); 
    restoreCredsFromDb(db); 
    saveAppConfig(cfg); 
    setLS(STORAGE.APP_CODE,code);
    appState.currentUser={ username: siswa.username, name: siswa.nama, role:"siswa", nis: siswa.nis, noAbsen: siswa.noAbsen, kelas: siswa.kelas, siswaId: siswa.id, sekolah: db.a?.ns||cfg.namaSekolah||"", guru: db.a?.ng||cfg.namaGuru||"" };
    setLS(STORAGE.USER, JSON.stringify(appState.currentUser)); 
    setLS(STORAGE.DB, JSON.stringify(appState.db));
    appState.activeView="dashboard_siswa";
    appState.db.ll=appState.db.ll||[];
    appState.db.ll.push(loginArr({ id: Date.now(), siswaId: siswa.id, nama: siswa.nama, nis: siswa.nis, kelas: siswa.kelas, waktu: new Date().toISOString() }));
    // ⭐ Hanya Supabase — tidak ada updateJsonBinDB()
    addActivity("login_siswa",`${siswa.nama} (${siswa.nis}) login`, { siswaId: siswa.id });
    showLoading(false); 
    showToast(`Selamat datang, ${siswa.nama}!`,"success"); 
    renderApp();
  } catch(err) { 
    showLoading(false); 
    showToast("Login gagal: "+err.message,"error"); 
  }
}

async function testCloudinary() {
  const r=document.getElementById("cloud-test-result"); 
  r.classList.remove("hidden"); 
  r.className="text-[10px] p-2 rounded-lg bg-slate-100 text-slate-600"; 
  r.textContent="⏳ Testing...";
  const name=document.getElementById("cloud-name").value.trim(); 
  const preset=document.getElementById("cloud-preset").value.trim();
  if (!name||!preset) { 
    r.className="text-[10px] p-2 rounded-lg bg-red-50 text-red-700"; 
    r.textContent="❌ Lengkapi dulu."; 
    return; 
  }
  try {
    const b64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=";
    const bin=atob(b64); 
    const bytes=new Uint8Array(bin.length); 
    for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const file=new File([new Blob([bytes],{type:"image/png"})],"test.png",{type:"image/png"});
    const form=new FormData(); 
    form.append("file",file); 
    form.append("upload_preset",preset); 
    form.append("folder","edusmart/test");
    const res=await fetch(`https://api.cloudinary.com/v1_1/${name}/image/upload`,{method:"POST",body:form}); 
    const data=await res.json();
    if (res.ok && data?.secure_url) { 
      r.className="text-[10px] p-2 rounded-lg bg-emerald-50 text-emerald-700"; 
      r.textContent="✅ Cloudinary OK!"; 
    }
    else { 
      r.className="text-[10px] p-2 rounded-lg bg-red-50 text-red-700"; 
      r.textContent="❌ "+(data?.error?.message||`HTTP ${res.status}`); 
    }
  } catch(err) { 
    r.className="text-[10px] p-2 rounded-lg bg-red-50 text-red-700"; 
    r.textContent="❌ "+err.message; 
  }
}

function importBackup(e) {
  const f=e.target.files[0]; 
  if (!f) return; 
  const r=new FileReader();
  r.onload=(ev)=>{ 
    try { 
      const p=JSON.parse(ev.target.result); 
      if (p.menus) appState.menus=p.menus; 
      if (p.database) appState.db=p.database; 
      ensureMasterData(); 
      saveLocal(); 
      showToast("Restore berhasil.","success"); 
      renderApp(); 
      closeModal(); 
    } catch(err) { 
      showToast("File tidak valid.","error"); 
    } 
  };
  r.readAsText(f);
}

async function executeBuatDatabase() {
  const school=document.getElementById("db-school").value.trim();
  const guru=document.getElementById("db-guru").value.trim();
  const kelas=document.getElementById("db-kelas").value.trim();
  const tahunAjar=document.getElementById("db-nama").value.trim()||"-";
  const username=document.getElementById("db-username").value.trim();
  const password=document.getElementById("db-password").value;
  const password2=document.getElementById("db-password2").value;
  const geminiKey=document.getElementById("db-gemini").value.trim();
  if (!school||!guru||!kelas) { showToast("Lengkapi data sekolah.","error"); return; }
  if (username.length<4) { showToast("Username min 4 karakter.","error"); return; }
  if (password.length<6) { showToast("Password min 6 karakter.","error"); return; }
  if (password!==password2) { showToast("Konfirmasi tidak cocok.","error"); return; }
  const cleanClass=kelas.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; 
  let token="";
  for (let i=0;i<6;i++) token+=chars[Math.floor(Math.random()*chars.length)];
  const kodeAplikasi=`EDU-${cleanClass}-${token}`;
  const passwordHash=await sha256(password);
  const database=JSON.parse(JSON.stringify(DEFAULT_DB));
  database.a={ k: kodeAplikasi, ns: school, ng: guru, kl: kelas, gc: [username,password,passwordHash], lk: null, ls: null, fg: null, bgLogin: "" };
  database.md.u.ta=tahunAjar;
  database.cfg={ sbUrl:"", sbKey:"", cloudName:"", cloudPreset:"", geminiKey: geminiKey||"" };
  database.mn=[...DEFAULT_MENUS];
  showLoading(true,"Membuat database...");
  try {
    const bin=await createJsonBinDB(database,kodeAplikasi,`EduSmart ${kelas} ${tahunAjar}`);
    const binId=bin.metadata.id;
        // ⭐ v5.1 Patch C1: Auto-detect provider — Supabase prioritas kalau sudah diset
    const hasSupabase = !!getSupabaseConfig();
    const defaultProvider = hasSupabase ? "supabase" : "jsonbin";
    console.log("[BuatDB] Provider default:", defaultProvider, 
      "(Supabase:", hasSupabase ? "siap ✓" : "belum diset ✗", ")");
    
    const configObj={ 
      version:5, 
      kodeAplikasi, 
      namaSekolah: school, 
      namaGuru: guru, 
      kelas, 
      tahunAjar, 
      guruCredentials: { username, passwordHash }, 
      geminiApiKey: geminiKey||"", 
      database: { 
        provider: defaultProvider,
        binId,
        fallback: hasSupabase ? "jsonbin" : "supabase"
      }, 
      createdAt: new Date().toISOString() 
    };
    const cloud=await uploadConfigCloudinary(configObj,kodeAplikasi);
    saveAppConfig({ ...configObj, binId, cloudinaryUrl: cloud.secure_url||getConfigUrl(kodeAplikasi) });
    if (geminiKey) saveGeminiKey(geminiKey);
    appState.db=database; 
    appState.menus=[...DEFAULT_MENUS]; 
    setLS(STORAGE.MENUS, JSON.stringify(appState.menus));
    appState.currentUser={ username, name: guru, role:"guru", sekolah: school, kelas };
    setLS(STORAGE.USER, JSON.stringify(appState.currentUser)); 
    setLS(STORAGE.DB, JSON.stringify(appState.db)); 
    setLS(STORAGE.APP_CODE, kodeAplikasi);
    appState.activeView="dashboard"; 
    showLoading(false); 
    renderApp();
    const mb=document.getElementById("modal-body");
    mb.innerHTML=`<div class="text-center space-y-4 p-2 text-xs">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-3xl"><i class="fa-solid fa-circle-check"></i></div>
      <h3 class="text-xl font-extrabold">Database Berhasil Dibuat</h3>
      <div class="bg-slate-950 text-emerald-400 rounded-2xl p-5 font-mono text-2xl font-bold tracking-widest select-all break-all">${kodeAplikasi}</div>
      <div class="grid grid-cols-2 gap-2 text-left text-[11px] bg-slate-50 border rounded-xl p-3">
        <div><b>Sekolah</b><br>${school}</div><div><b>Kelas</b><br>${kelas}</div>
        <div><b>Tahun Ajar</b><br>${tahunAjar}</div><div><b>Username</b><br><span class="font-mono">${username}</span></div>
        <div class="col-span-2"><b>Bin ID</b><br><span class="font-mono text-[9px] break-all">${binId}</span></div>
      </div>
      <div class="p-2 bg-amber-50 border border-amber-200 rounded-xl text-[10px] text-amber-800">⚠️ Catat Kode + Username + Password Anda!</div>
      <div class="flex justify-center gap-2">
        <button onclick="copyToClipboard('${kodeAplikasi}','Kode disalin.')" class="px-4 py-2.5 bg-indigo-600 text-white rounded-xl font-bold">Salin Kode</button>
        <button onclick="closeModal()" class="px-4 py-2.5 bg-slate-100 rounded-xl font-semibold">Tutup</button>
      </div>
    </div>`;
  } catch(err) { 
    showLoading(false); 
    showToast("Gagal: "+err.message,"error"); 
  }

function importExcelSiswa(e) {
  const f=e.target.files[0]; 
  if (!f) return; 
  const r=new FileReader();
  r.onload=async (ev)=>{
    try {
      const data=new Uint8Array(ev.target.result); 
      const wb=XLSX.read(data,{type:"array"}); 
      const ws=wb.Sheets[wb.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(ws,{defval:""}); 
      if (!json.length) { showToast("File kosong.","error"); return; }
      let n=0;
      json.forEach(item=>{ 
        if (item.Nama) { 
          const nama=String(item.Nama);
          const s={ 
            id: nextId(appState.db.sw), 
            noAbsen: Number(item.NoAbsen)||(appState.db.sw.length+1), 
            nis: String(item.NIS||""), 
            nama, 
            kelas: String(item.Kelas||"5"), 
            jk: String(item.JK||"L"), 
            username: String(item.Username||nama.toLowerCase().replace(/[^a-z0-9]/g,".").slice(0,20)), 
            password: String(item.Password||"siswa123"), 
            tempatLahir: String(item.TempatLahir||"-"), 
            tglLahir: String(item.TglLahir||"-"), 
            alamat: String(item.Alamat||"-"), 
            fotoUrl: null 
          };
          appState.db.sw.push(siswaArr(s)); 
          n++;
        }
      });
      saveLocal(); 
      setSyncBadge(true); 
      addActivity("import_siswa",`Import ${n} siswa`);
      showToast(`Import ${n} data. Menyimpan...`,"info"); 
      await updateJsonBinDB(); 
      setSyncBadge(false); 
      renderMainContent();
    } catch(err) { 
      showToast("File tidak valid.","error"); 
    }
  };
  r.readAsArrayBuffer(f); 
  e.target.value="";
}
function downloadTemplateSiswa() {
  const header=["NoAbsen","NIS","Nama","Kelas","JK","Username","Password","TempatLahir","TglLahir","Alamat"];

  const ws=XLSX.utils.aoa_to_sheet([header,...contoh]); 
  ws["!cols"]=header.map(h=>({ wch: Math.max(String(h).length+2,12) }));
  const wb=XLSX.utils.book_new(); 
  XLSX.utils.book_append_sheet(wb,ws,"Siswa");

}

async function saveAbsen() {
  const tgl = document.getElementById("absen-tgl").value;
  if (!tgl) { showToast("Tanggal wajib.", "error"); return; }
  
  appState.db.ab = appState.db.ab || [];
  const rowsToUpsert = [];
  let n = 0;
  
  // ════ TAHAP 0: Update state lokal dulu ════
  (appState.db.sw || []).forEach(sw => {
    const sid = sw[FIELD.SISWA.ID];
    const st = window.__absensiDraft[sid] || "H";
    const id = `${tgl}_${sid}`;
    
    const ex = appState.db.ab.find(a => String(a[FIELD.ABSEN.ID]) === id);
    if (ex) {
      ex[FIELD.ABSEN.STATUS] = st;
    } else {
      appState.db.ab.push(absenArr({ id, tanggal: tgl, siswaId: sid, status: st }));
      n++;
    }
    
    rowsToUpsert.push({
      id: String(id),
      tanggal: tgl,
      siswa_id: String(sid),
      status: st,
      updated_at: new Date().toISOString()
    });
  });
  
  saveLocal();
  addActivity("input_absensi", `Input absensi ${tgl} (${n} siswa)`);
  showLoading(true, "Menyimpan...");
  
  // ════ TAHAP 1-3: Pakai saveWithFallback ════
  const hasil = await saveWithFallback(
    `Absensi ${tgl}`,
    async () => {
      const sb = getSupabaseConfig();
      if (!sb) throw new Error("Supabase belum dikonfigurasi");
      
      const res = await fetch(`${sb.url}/rest/v1/absensi`, {
        method: "POST",
        headers: {
          "apikey": sb.key,
          "Authorization": `Bearer ${sb.key}`,
          "Content-Type": "application/json",
          "Prefer": "resolution=merge-duplicates,return=minimal"
        },
        body: JSON.stringify(rowsToUpsert)
      });
      
      if (!res.ok) {
        const err = await res.text();
        throw new Error(`HTTP ${res.status}: ${err}`);
      }
    },
    async () => {
      const ok = await updateJsonBinDB();
      if (!ok) throw new Error("JSONBin sync gagal");
    }
  );
  
  showLoading(false);
  
  if (hasil.sumber === "supabase") {
    setSyncBadge(false, "SUPABASE");
    showToast(`✓ Absensi ${n} siswa tersimpan ke Supabase.`, "success");
  } else if (hasil.sumber === "jsonbin") {
    setSyncBadge(false, "JSONBIN");
    showToast(`⚠️ Supabase down, tersimpan ke JSONBin (cadangan).`, "info");
  } else if (hasil.sumber === "local") {
    setSyncBadge(true, "OFFLINE");
    showToast(`❌ Cloud down, tersimpan LOKAL saja. Coba lagi nanti.`, "error");
  } else {
    showToast(`❌ Gagal simpan absensi.`, "error");
  }
  
  renderMainContent();
}

function updateNilai(sid, mk, col, val) {
  const nc=getKomponenByMapel(mk); 
  const idxCol=nc.indexOf(col); 
  if (idxCol<0) return;
  let n=Number(val); 
  if (isNaN(n)) n=0; 
  if (n<0) n=0; 
  if (n>100) n=100;
  let nlArr=(appState.db.nl||[]).find(a=>Number(a[FIELD.NILAI.SISWA_ID])===Number(sid)&&a[FIELD.NILAI.MAPEL_KODE]===mk);
  if (!nlArr) { 
    const newId=nextId(appState.db.nl); 
    const scores=new Array(nc.length).fill(0); 
    scores[idxCol]=n; 
    nlArr=[newId,sid,mk,scores]; 
    appState.db.nl=appState.db.nl||[]; 
    appState.db.nl.push(nlArr); 
  }
  else { 
    if (!Array.isArray(nlArr[FIELD.NILAI.SCORES])) nlArr[FIELD.NILAI.SCORES]=new Array(nc.length).fill(0); 
    while (nlArr[FIELD.NILAI.SCORES].length<nc.length) nlArr[FIELD.NILAI.SCORES].push(0); 
    nlArr[FIELD.NILAI.SCORES][idxCol]=n; 
  }
  saveLocal(); 
  setSyncBadge(true);
}

function downloadTemplateNilai(mapelKode) {
  const nc=getKomponenByMapel(mapelKode);
  const mapel=(appState.db.mp||[]).map(mapelToObj).find(m=>m.kode===mapelKode); 
  if (!mapel) { showToast("Mapel tidak ditemukan.","error"); return; }
  const kelasFilter=window.__penilaianKelas||"ALL";
  const siswaAll=(appState.db.sw||[]).map(siswaToObj);
  const siswaList=kelasFilter==="ALL"?siswaAll:siswaAll.filter(s=>s.kelas===kelasFilter);
  if (!siswaList.length) { showToast("Tidak ada siswa.","error"); return; }
  const header=["NoAbsen","NIS","Nama","Kelas",...nc];
  const rows=siswaList.map(s=>{
    const nlArr=(appState.db.nl||[]).find(n=>Number(n[FIELD.NILAI.SISWA_ID])===Number(s.id)&&n[FIELD.NILAI.MAPEL_KODE]===mapelKode);
    const rec=nlArr?nilaiToObj(nlArr,nc):{ scores:{} };
    const row=[s.noAbsen,s.nis,s.nama,s.kelas]; 
    nc.forEach(cc=>row.push(Number(rec.scores?.[cc]??0))); 
    return row;
  });
  const ws=XLSX.utils.aoa_to_sheet([header,...rows]);
  ws["!cols"]=header.map((h,i)=>{ 
    let maxLen=String(h).length; 
    [header,...rows].forEach(r=>{ 
      const len=String(r[i]??"").length; 
      if (len>maxLen) maxLen=len; 
    }); 
    return { wch: Math.min(Math.max(maxLen+2,8),32) }; 
  });
  const wb=XLSX.utils.book_new(); 
  XLSX.utils.book_append_sheet(wb,ws,"Nilai");
  const kelasLabel=kelasFilter==="ALL"?"SemuaKelas":`Kelas${kelasFilter}`;
  XLSX.writeFile(wb,`Template_Nilai_${mapelKode}_${kelasLabel}.xlsx`);
  showToast(`✓ Template ${mapel.nama} diunduh.`,"success");
}
async function importNilaiExcel(e, mapelKode) {
  const f=e.target.files[0]; 
  if (!f) return;
  const nc=getKomponenByMapel(mapelKode);
  const reader=new FileReader();
  reader.onload=async function(evt) {
    showLoading(true,"Membaca Excel...");
    try {
      const data=new Uint8Array(evt.target.result); 
      const wb=XLSX.read(data,{type:"array"}); 
      const ws=wb.Sheets[wb.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(ws,{defval:""}); 
      if (!json.length) throw new Error("File kosong.");
      const sampleKeys=Object.keys(json[0]||{}); 
      const keyNama=sampleKeys.find(k=>/nama/i.test(k));
      if (!keyNama) throw new Error("Kolom 'Nama' tidak ditemukan.");
      let updated=0, added=0, skipped=0; 
      const notFound=[];
      json.forEach(row=>{
        const nama=String(row[keyNama]??"").trim(); 
        if (!nama) { skipped++; return; }
        const sw=(appState.db.sw||[]).find(s=>String(s[FIELD.SISWA.NAMA]).toLowerCase()===nama.toLowerCase());
        if (!sw) { skipped++; notFound.push(nama); return; }
        const sid=sw[FIELD.SISWA.ID];
        let nlArr=(appState.db.nl||[]).find(a=>Number(a[FIELD.NILAI.SISWA_ID])===Number(sid)&&a[FIELD.NILAI.MAPEL_KODE]===mapelKode);
        if (!nlArr) { 
          nlArr=[nextId(appState.db.nl),sid,mapelKode,new Array(nc.length).fill(0)]; 
          appState.db.nl=appState.db.nl||[]; 
          appState.db.nl.push(nlArr); 
          added++; 
        } else updated++;
        nc.forEach((cc,i)=>{ 
          if (Object.prototype.hasOwnProperty.call(row,cc)) { 
            let n=Number(row[cc]); 
            if (isNaN(n)) n=0; 
            if (n<0) n=0; 
            if (n>100) n=100; 
            nlArr[FIELD.NILAI.SCORES][i]=n; 
          }
        });
      });
      saveLocal(); 
      addActivity("import_nilai",`Import nilai ${mapelKode}: ${updated+added}`);
      const okJB=await updateJsonBinDB(); 
      let okSB=false; 
      const sb=getSupabaseConfig();
      if (sb) {
        try {
          const rows=appState.db.nl.filter(arr=>arr[FIELD.NILAI.MAPEL_KODE]===mapelKode).map(arr=>{ 
            const o=nilaiToObj(arr,nc); 
            return { id:String(o.id), siswa_id:String(o.siswaId), mapel_kode:o.mapelKode, scores:o.scores, updated_at:new Date().toISOString() }; 
          });
          await sbUpsert("nilai",rows); 
          okSB=true;
        } catch(e) {}
      }
      showLoading(false); 
      setSyncBadge(!(okJB||okSB));
      let msg=`✓ Import: ${updated} diperbarui, ${added} baru`; 
      if (skipped) msg+=`, ${skipped} dilewati`;
      showToast(msg,"success");
      if (notFound.length) setTimeout(()=>showToast(`⚠️ Tidak ditemukan: ${notFound.slice(0,3).join(", ")}${notFound.length>3?` +${notFound.length-3}`:""}`,"error"),700);
      renderMainContent();
    } catch(err) { 
      showLoading(false); 
      showToast("Import gagal: "+err.message,"error"); 
    }
    finally { e.target.value=""; }
  };
  reader.readAsArrayBuffer(f);
}

function cetakRaporPDF() {
  const { jsPDF }=window.jspdf; 
  const doc=new jsPDF();
  const siswaAll=(appState.db.sw||[]).map(siswaToObj); 
  const mapelAll=(appState.db.mp||[]).map(mapelToObj);
  const filterKelas=window.__hbKelas||"ALL"; 
  const filterSiswa=window.__hbSiswa||"ALL";
  let filtered=filterKelas==="ALL"?siswaAll:siswaAll.filter(s=>s.kelas===filterKelas);
  if (filterSiswa!=="ALL") filtered=filtered.filter(s=>String(s.id)===String(filterSiswa));
  doc.setFontSize(16); 
  doc.text("LAPORAN HASIL BELAJAR",14,20);
  doc.setFontSize(10); 
  doc.text(`Sekolah: ${appState.db.a?.ns||"-"}`,14,28);
  doc.text(`Kelas: ${filterKelas==="ALL"?"Semua":filterKelas}`,14,34);
  if (filterSiswa!=="ALL"&&filtered.length) doc.text(`Siswa: ${filtered[0]?.nama||"-"}`,14,40);
  const rows=[];
  filtered.forEach(s=>{ 
    mapelAll.forEach(m=>{
      const nc=getKomponenByMapel(m.kode);
      const nlArr=(appState.db.nl||[]).find(n=>Number(n[FIELD.NILAI.SISWA_ID])===Number(s.id)&&n[FIELD.NILAI.MAPEL_KODE]===m.kode);
      const rec=nlArr?nilaiToObj(nlArr,nc):{ scores:{} };
      let total=0; 
      const row=[s.noAbsen,s.nama,s.kelas,m.nama];
      nc.forEach(cc=>{ 
        const v=Number(rec.scores?.[cc]??0); 
        row.push(v); 
        total+=v; 
      });
      row.push((total/nc.length).toFixed(1)); 
      rows.push(row);
    });
  });
  const ncDefault=getKomponenByMapel(mapelAll[0]?.kode||"");
  const startY=(filterSiswa!=="ALL")?46:42;
  doc.autoTable({ 
    startY, 
    head:[["No","Nama","Kelas","Mapel",...ncDefault,"Rata²"]], 
    body: rows, 
    styles:{ fontSize: 8 } 
  });
  doc.save(`Rapor_${Date.now()}.pdf`); 
  showToast("PDF diunduh.","success");
}

function cetakRaporSiswa(sid) {
  if (!sid) { showToast("Pilih siswa dulu.","error"); return; }
  const { jsPDF }=window.jspdf; 
  const doc=new jsPDF();
  const mapelAll=(appState.db.mp||[]).map(mapelToObj);
  const siswa=(appState.db.sw||[]).map(siswaToObj).find(s=>String(s.id)===String(sid));
  if (!siswa) { showToast("Siswa tidak ditemukan.","error"); return; }
  doc.setFontSize(16); 
  doc.text("RAPOR HASIL BELAJAR SISWA",105,20,{ align:"center" });
  doc.setFontSize(10); 
  let y=30;
  doc.text(`Sekolah   : ${appState.db.a?.ns||"-"}`,14,y); y+=6;
  doc.text(`Kelas     : ${siswa.kelas||"-"}`,14,y); y+=6;
  doc.text(`Nama      : ${siswa.nama||"-"}`,14,y); y+=6;
  doc.text(`No. Absen : ${siswa.noAbsen||"-"}`,14,y); y+=6;
  doc.text(`NIS       : ${siswa.nis||"-"}`,14,y); y+=8;
  const body=[];
  mapelAll.forEach(m=>{
    const nc=getKomponenByMapel(m.kode);
    const nlArr=(appState.db.nl||[]).find(n=>Number(n[FIELD.NILAI.SISWA_ID])===Number(sid)&&n[FIELD.NILAI.MAPEL_KODE]===m.kode);
    const rec=nlArr?nilaiToObj(nlArr,nc):{ scores:{} };
    let total=0; 
    const row=[m.nama];
    nc.forEach(cc=>{ 
      const v=Number(rec.scores?.[cc]??0); 
      row.push(v); 
      total+=v; 
    });
    const avg=nc.length?total/nc.length:0; 
    row.push(avg.toFixed(1)); 
    row.push(avg>=(m.kkm||70)?"LULUS":"REMEDIAL"); 
    body.push(row);
  });
  const ncDefault=getKomponenByMapel(mapelAll[0]?.kode||"");
  doc.autoTable({ 
    startY: y+2, 
    head:[["Mata Pelajaran",...ncDefault,"Rata²","Status"]], 
    body, 
    styles:{ fontSize: 8 } 
  });
  doc.save(`Rapor_${siswa.nama.replace(/\s+/g,"_")}_${Date.now()}.pdf`); 
  showToast("✓ Rapor siswa diunduh.","success");
}

async function saveJurnal() {
  if (!window.__jurnalDraft.length) { showToast("Draft kosong.", "error"); return; }
  
  // ════ TAHAP 0 ════
  appState.db.jr = appState.db.jr || [];
  window.__jurnalDraft.forEach(j => {
    j.id = nextId(appState.db.jr);
    appState.db.jr.push(jurnalArr(j));
  });
  
  const total = window.__jurnalDraft.length;
  window.__jurnalDraft = [];
  
  saveLocal();
  addActivity("input_jurnal", `Input ${total} jurnal`);
  showLoading(true, "Menyimpan...");
  
  const rowsToUpsert = appState.db.jr.map(arr => {
    const o = jurnalToObj(arr);
    return {
      id: String(o.id),
      tanggal: o.tanggal,
      kelas: o.kelas,
      mapel: o.mapel,
      topik: o.topik,
      catatan: o.catatan,
      updated_at: new Date().toISOString()
    };
  });
  
  // ════ TAHAP 1-3 ════
  const hasil = await saveWithFallback(
    `Jurnal`,
    async () => {
      const sb = getSupabaseConfig();
      if (!sb) throw new Error("Supabase belum dikonfigurasi");
      
      const res = await fetch(`${sb.url}/rest/v1/jurnal`, {
        method: "POST",
        headers: {
          "apikey": sb.key,
          "Authorization": `Bearer ${sb.key}`,
          "Content-Type": "application/json",
          "Prefer": "resolution=merge-duplicates,return=minimal"
        },
        body: JSON.stringify(rowsToUpsert)
      });
      
      if (!res.ok) {
        const err = await res.text();
        throw new Error(`HTTP ${res.status}: ${err}`);
      }
    },
    async () => {
      const ok = await updateJsonBinDB();
      if (!ok) throw new Error("JSONBin sync gagal");
    }
  );
  
  showLoading(false);
  
  if (hasil.sumber === "supabase") {
    setSyncBadge(false, "SUPABASE");
    showToast(`✓ ${total} jurnal tersimpan ke Supabase.`, "success");
  } else if (hasil.sumber === "jsonbin") {
    setSyncBadge(false, "JSONBIN");
    showToast(`⚠️ Supabase down, ${total} jurnal tersimpan ke JSONBin (cadangan).`, "info");
  } else if (hasil.sumber === "local") {
    setSyncBadge(true, "OFFLINE");
    showToast(`❌ Cloud down, jurnal tersimpan LOKAL saja.`, "error");
  } else {
    showToast(`❌ Gagal simpan jurnal.`, "error");
  }
  
  renderMainContent();
}

async function fetchGeminiWithRetry(prompt, systemPrompt, apiKey) {
  let lastError=null;
  for (const model of GEMINI_MODELS) {
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
    const payload={ 
      contents:[{ parts:[{ text: prompt }] }], 
      systemInstruction: systemPrompt?{ parts:[{ text: systemPrompt }] }:undefined 
    };
    try {
      const res=await fetch(url,{method:"POST",headers:{ "Content-Type":"application/json" },body:JSON.stringify(payload)});
      if (res.ok) return await res.json();
      if (res.status===401) throw new Error("API Key tidak valid.");
      if (res.status===403) throw new Error("API Key diblokir.");
      if (res.status===404) { 
        lastError=new Error(`Model ${model} tidak didukung.`); 
        continue; 
      }
      lastError=new Error(`HTTP ${res.status}`);
    } catch(err) { 
      lastError=err; 
    }
  }
  throw lastError||new Error("Gagal menghubungi Gemini.");
}
async function generateAI() {
  const topic=document.getElementById("ai-topic").value.trim()||"Topik";
  const kelas=document.getElementById("ai-kelas").value.trim()||"5";
  const out=document.getElementById("ai-out"); 
  const loader=document.getElementById("ai-loader"); 
  const btn=document.getElementById("ai-generate-btn");
  const apiKey=getGeminiKey(); 
  out.classList.remove("hidden");
  if (!apiKey) { 
    out.textContent="Isi API Key dulu di Pengaturan."; 
    showToast("API Key kosong.","info"); 
    return; 
  }
  loader.classList.remove("hidden"); 
  if (btn) btn.disabled=true; 
  out.textContent="⏳ Meminta AI...";
  try {
    const result=await fetchGeminiWithRetry(
      `Buat draft pembelajaran:\nTopik: ${topic}\nKelas: ${kelas}\n\nFormat: 1. Tujuan, 2. Materi, 3. Kegiatan, 4. Soal, 5. Rubrik.`,
      "Anda guru ahli Indonesia.",
      apiKey
    );
    const text=result?.candidates?.[0]?.content?.parts?.[0]?.text; 
    if (!text) throw new Error("Respons kosong.");
    out.textContent=text; 
    showToast("✓ Berhasil.","success");
  } catch(err) { 
    out.textContent=`⚠️ ${err.message}`; 
    showToast("Gagal: "+err.message,"error"); 
  }
  finally { 
    loader.classList.add("hidden"); 
    if (btn) btn.disabled=false; 
  }
}

async function simpanDataGuru() {
  const nama=document.getElementById("profil-nama-guru").value.trim();
  const nip=document.getElementById("profil-nip-guru").value.trim();
  if (!nama) { showToast("Nama guru wajib diisi.","error"); return; }
  if (!appState.db.a) appState.db.a={};
  appState.db.a.ng=nama;
  appState.db.a.nig=nip;
  if (appState.currentUser) { 
    appState.currentUser.name=nama; 
    setLS(STORAGE.USER, JSON.stringify(appState.currentUser)); 
  }
  saveLocal(); 
  addActivity("update_profil_guru",`Update data guru: ${nama}`);
  showLoading(true,"Menyimpan...");
  const ok=await updateJsonBinDB(); 
  showLoading(false);
  if (ok) { 
    showToast("✓ Data guru disimpan.","success"); 
    setSyncBadge(false); 
  } else showToast("Tersimpan lokal.","error");
  updateHeaderUI(); 
  renderMainContent();
}

async function uploadBgLogin(e) {
  const f=e.target.files[0]; 
  if (!f) return;
  showLoading(true,"Mengunggah background...");
  try {
    const r=await uploadFile(f,`edusmart/background`);
    if (!r.url) throw new Error("Upload gagal, cek Cloudinary.");
    appState.db.a.bgLogin=r.url;
    saveLocal(); 
    addActivity("update_bg_login","Ganti background login");
    const ok=await updateJsonBinDB();
    showLoading(false);
    if (ok) { 
      showToast("✓ Background login disimpan.","success"); 
      setSyncBadge(false); 
    } else showToast("Tersimpan lokal.","error");
    renderMainContent();
  } catch(err) { 
    showLoading(false); 
    showToast("Gagal: "+err.message,"error"); 
  }
  e.target.value="";
}

async function uploadFotoProfil(tipe, e) {
  const f=e.target.files[0]; 
  if (!f) return; 
  showLoading(true,"Mengunggah...");
  try {
    const r=await uploadFile(f,`edusmart/profile/${tipe}`);
    if (!r.url) throw new Error("Upload gagal.");
    
    if (tipe==="guru") {
      appState.db.a.fg = r.url;
      saveLocal();
      // ⭐ v5: Pakai saveMasterDB (Supabase primary)
      await saveMasterDB({ ...appState.db, mn: appState.menus });
    } else if (tipe==="siswa") {
      // ⭐ v5: Pakai simpanFotoSiswaKeCloud
      await simpanFotoSiswaKeCloud(appState.currentUser.siswaId, r.url);
    }
    
    showLoading(false); 
    updateHeaderUI(); 
    showToast("✓ Foto tersimpan ke cloud.","success"); 
    renderApp();
  } catch(err) { 
    showLoading(false); 
    showToast("Gagal: "+err.message,"error"); 
  }
  e.target.value = "";
}

async function executeTarikJSONBin() {
  const cred=getJsonBinCredential(); 
  if (!cred) { showToast("API Key belum diset.","error"); return; }
  const kode=document.getElementById("tarik-kode").value.trim().toUpperCase(); 
  if (!kode) { showToast("Kode wajib.","error"); return; }
  showLoading(true,"Menarik...");
  try {
    const cfg=await loadConfigByCode(kode); 
    const db=await loadMasterDB(cfg.binId,cred);
    appState.db=db; 
    ensureMasterData(); 
    restoreMenusFromDb(db); 
    restoreCredsFromDb(db); 
    setLS(STORAGE.DB, JSON.stringify(db)); 
    saveAppConfig(cfg);
    showLoading(false); 
    showToast("✓ Data ditarik.","success"); 
    setSyncBadge(false); 
    renderApp();
  } catch(err) { 
    showLoading(false);

async function tarikDariSupabase(tabel) {
  const sb=getSupabaseConfig(); 
  if (!sb) { showToast("Supabase belum diset.","error"); return; }
  showLoading(true,"Menarik...");
  try {
    if (tabel==="nilai") {
      const rows=await sbFetch("nilai","?limit=2000"); 
      const map={};
      (appState.db.nl||[]).forEach(a=>{ map[String(a[FIELD.NILAI.ID])]=a; });
      rows.forEach(r=>{ 
        const mk=r.mapel_kode; 
        const nc=getKomponenByMapel(mk); 
        map[String(r.id)]=[r.id,r.siswa_id,mk,nc.map(k=>Number(r.scores?.[k]??0))]; 
      });
      appState.db.nl=Object.values(map);
    } else if (tabel==="absensi") {
      const rows=await sbFetch("absensi","?limit=2000"); 
      const map={};
      (appState.db.ab||[]).forEach(a=>{ map[String(a[FIELD.ABSEN.ID])]=a; });
      rows.forEach(r=>{ map[String(r.id)]=absenArr({ id:r.id, tanggal:r.tanggal, siswaId:r.siswa_id, status:r.status }); });
      appState.db.ab=Object.values(map);
    } else if (tabel==="jurnal") {
      const rows=await sbFetch("jurnal","?limit=2000"); 
      const map={};
      (appState.db.jr||[]).forEach(a=>{ map[String(a[FIELD.JURNAL.ID])]=a; });
      rows.forEach(r=>{ map[String(r.id)]=jurnalArr({ id:r.id, tanggal:r.tanggal, kelas:r.kelas, mapel:r.mapel, topik:r.topik, catatan:r.catatan }); });
      appState.db.jr=Object.values(map);
    }
    saveLocal(); 
    showLoading(false); 
    showToast(`✓ ${tabel} ditarik.`,"success"); 
    renderApp();
  } catch(err) { 
    showLoading(false); 
    showToast("Gagal: "+err.message,"error"); 
  }
}

   SAVE TO CLOUD — Supabase PRIMARY
   ========================================================= */
async function saveToCloud() {
  const cfg = getAppConfig();
  const cred = getJsonBinCredential();
  const sb = getSupabaseConfig();
  
  if (!sb && !cred) { 
    showToast("Supabase & JSONBin belum diset.", "error"); 
    return; 
  }
  
  showLoading(true, "Menyimpan...");
  ensureMasterData();
  appState.db.mn = appState.menus;
  
  // ─── Simpan payload utama ke Supabase (PRIMARY) ───
  const payload = {
    ...appState.db,
    mn: appState.menus
  };
  
  const hasilMaster = await saveMasterDB(payload, {
    alsoJsonBin: !!cred,
    binId: cfg?.binId || null,
    cred: cred
  });
  
  // ─── Simpan tabel relasional ke Supabase ───
  if (sb) {
    try {
      if ((appState.db.nl || []).length) {
        await sbUpsert("nilai", appState.db.nl.map(arr => {
          const mk = arr[FIELD.NILAI.MAPEL_KODE];
          const nc = getKomponenByMapel(mk);
          const o = nilaiToObj(arr, nc);
          return { 
            id: String(o.id), 
            siswa_id: String(o.siswaId), 
            mapel_kode: o.mapelKode, 
            scores: o.scores, 
            updated_at: new Date().toISOString() 
          };
        }));
      }
      if ((appState.db.ab || []).length) {
        await sbUpsert("absensi", appState.db.ab.map(arr => {
          const o = absenToObj(arr);
          return { 
            id: String(o.id), 
            tanggal: o.tanggal, 
            siswa_id: String(o.siswaId), 
            status: o.status, 
            updated_at: new Date().toISOString() 
          };
        }));
      }
      if ((appState.db.jr || []).length) {
        await sbUpsert("jurnal", appState.db.jr.map(arr => {
          const o = jurnalToObj(arr);
          return { 
            id: String(o.id), 
            tanggal: o.tanggal, 
            kelas: o.kelas, 
            mapel: o.mapel, 
            topik: o.topik, 
            catatan: o.catatan, 
            updated_at: new Date().toISOString() 
          };
        }));
      }
    } catch(e) { 
      console.warn("Upsert tabel relasional gagal:", e.message); 
    }
  }
  
  // ─── Update Cloudinary config (opsional, untuk auto-login) ───
  try {
    const gk = getGeminiKey();
    const gcHashOnly = { 
      username: appState.db.a?.gc?.[0] || "", 
      passwordHash: appState.db.a?.gc?.[2] || "" 
    };
        // ⭐ v5.1 Patch C2: Ambil provider dari setting user saat ini
    const activeProvider = getPrimarySource();
    console.log("[SaveCloud] Simpan config dengan provider:", activeProvider);
    
    await uploadConfigCloudinary({ 
      version: 5, 
      kodeAplikasi: cfg.kodeAplikasi, 
      namaSekolah: appState.db.a?.ns || cfg.namaSekolah, 
      namaGuru: appState.db.a?.ng || cfg.namaGuru, 
      kelas: appState.db.a?.kl || cfg.kelas, 
      tahunAjar: appState.db.md?.u?.ta || cfg.tahunAjar || "-", 
      guruCredentials: gcHashOnly, 
      geminiApiKey: gk, 
      database: { 
        provider: activeProvider, 
        binId: cfg.binId || null,
        fallback: activeProvider === "supabase" ? "jsonbin" : "supabase"
      }, 
      createdAt: cfg.createdAt || new Date().toISOString() 
    }, cfg.kodeAplikasi);
  } catch(e) {}
  
  showLoading(false);
  
  if (hasilMaster.supabase) {
    setSyncBadge(false, "SUPABASE");
    showToast("✓ Tersimpan ke Supabase (primary).", "success");
  } else if (hasilMaster.jsonbin) {
    setSyncBadge(false, "JSONBIN");
    showToast("⚠️ Supabase gagal, tersimpan ke JSONBin (backup).", "info");
  } else {
    setSyncBadge(true, "LOKAL");
    showToast("⚠️ Cloud gagal, tersimpan lokal saja.", "error");
  }
}

async function fetchRankingData() {
  let nilaiArr=(appState.db.nl||[]).map(a=>{ 
    const mk=a[FIELD.NILAI.MAPEL_KODE]; 
    const nc=getKomponenByMapel(mk); 
    return nilaiToObj(a,nc); 
  });
  let source="lokal"; 
  const sb=getSupabaseConfig();
  if (sb) { 
    try { 
      const rows=await sbFetch("nilai","?limit=5000"); 
      if (Array.isArray(rows)&&rows.length) { 
        nilaiArr=rows.map(r=>({ id:r.id, siswaId:r.siswa_id, mapelKode:r.mapel_kode, scores:r.scores||{} })); 
        source="supabase"; 
      } 
    } catch(e) {} 
  }
  return { nilaiArr, source };
}
function hitungRankingSementara(siswaList, nilaiArr, mapelList) {
  const mapelKode=(mapelList||[]).map(m=>m.kode);
  const hasil=siswaList.map(s=>{
    const rataPerMapel=[];
    mapelKode.forEach(mk=>{
      const rec=nilaiArr.find(n=>String(n.siswaId)===String(s.id)&&String(n.mapelKode)===String(mk));
      if (!rec||!rec.scores) { rataPerMapel.push(0); return; }
      const vals=Object.values(rec.scores).map(v=>Number(v)||0); 
      if (!vals.length) { rataPerMapel.push(0); return; }
      rataPerMapel.push(vals.reduce((a,b)=>a+b,0)/vals.length);
    });
    const overall=rataPerMapel.length?(rataPerMapel.reduce((a,b)=>a+b,0)/rataPerMapel.length):0;
    return { siswa: s, rata: +overall.toFixed(2) };
  });
  hasil.sort((a,b)=>b.rata-a.rata); 
  return hasil;
}
function renderRankingCard(opts={}) {
  const { title="Ranking Sementara", kelasFilter=null, highlightSiswaId=null, showKelasDropdown=false, containerId="ranking-card-content" }=opts;
  const siswaAll=(appState.db.sw||[]).map(siswaToObj);
  const kelasList=[...new Set(siswaAll.map(s=>s.kelas).filter(Boolean))].sort();
  const activeKelas=kelasFilter||(showKelasDropdown?(kelasList[0]||"ALL"):"ALL");
  const dd=showKelasDropdown?`<select onchange="refreshRankingCard('${containerId}', this.value, '${highlightSiswaId||''}')" class="text-[10px] px-2 py-1 border rounded-lg bg-white font-semibold">${kelasList.map(k=>`<option value="${k}" ${activeKelas===k?"selected":""}>Kelas ${k}</option>`).join("")}<option value="ALL" ${activeKelas==="ALL"?"selected":""}>Semua</option></select>`:"";
  return `<div class="bg-white p-4 sm:p-5 rounded-2xl border shadow-sm space-y-3">
    <div class="flex items-center justify-between flex-wrap gap-2"><h3 class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-ranking-star text-amber-500"></i> ${title}</h3>
      <div class="flex items-center gap-2">${dd}<button onclick="refreshRankingCard('${containerId}', '${activeKelas}', '${highlightSiswaId||''}')" class="text-slate-400 p-1"><i class="fa-solid fa-rotate text-xs"></i></button></div>
    </div>
    <div id="${containerId}"><div class="text-center text-xs text-slate-400 py-6"><i class="fa-solid fa-spinner fa-spin"></i></div></div>
  </div>`;
}
async function refreshRankingCard(containerId, kelasFilter, highlightSiswaId) {
  const el=document.getElementById(containerId); 
  if (!el) return;
  el.innerHTML=`<div class="text-center text-xs text-slate-400 py-6"><i class="fa-solid fa-spinner fa-spin"></i></div>`;
  try {
    const { nilaiArr, source }=await fetchRankingData();
    const siswaAll=(appState.db.sw||[]).map(siswaToObj);
    const kelasAktif=kelasFilter||"ALL";
    const siswaFiltered=kelasAktif==="ALL"?siswaAll:siswaAll.filter(s=>s.kelas===kelasAktif);
    const mapelAll=(appState.db.mp||[]).map(mapelToObj);
    const ranked=hitungRankingSementara(siswaFiltered,nilaiArr,mapelAll);
    if (!ranked.length) { 
      el.innerHTML=`<div class="text-center text-xs text-slate-400 py-6">Belum ada data.</div>`; 
      return; 
    }
    const top5=ranked.slice(0,5);
    const highlightId=highlightSiswaId?String(highlightSiswaId):null;
    const myRank=highlightId?ranked.findIndex(r=>String(r.siswa.id)===highlightId):-1;
    const myData=myRank>=0?ranked[myRank]:null;
    const badgeSource=source==="supabase"?`<span class="text-[9px] bg-emerald-100 text-emerald-700 font-bold px-1.5 py-0.5 rounded">Online</span>`:`<span class="text-[9px] bg-amber-100 text-amber-700 font-bold px-1.5 py-0.5 rounded">Lokal</span>`;
    el.innerHTML=`<div class="space-y-2">
      ${myData?`<div class="p-3 bg-gradient-to-br from-amber-50 to-white border-2 border-amber-300 rounded-xl text-center">
        <div class="text-[10px] text-slate-500 font-semibold">Peringkat Kamu ${badgeSource}</div>
        <div class="text-3xl font-black text-amber-600 leading-none mt-1">#${myRank+1}</div>
        <div class="text-[11px] text-slate-600 mt-1">dari ${ranked.length} siswa</div>
        <div class="text-[10px] text-slate-500 mt-0.5">Rata-rata: <b>${myData.rata.toFixed(1)}</b></div>
      </div>`:`<div class="text-[10px] text-slate-500 mb-2 text-center">${badgeSource}</div>`}
      <div class="text-[10px] font-bold text-slate-700 mt-3">🏆 5 Besar</div>
      <div class="space-y-1">
        ${top5.map((r,i)=>{ 
          const isMe=highlightId&&String(r.siswa.id)===highlightId; 
          const medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":`#${i+1}`;
          return `<div class="flex justify-between items-center p-2 rounded-lg ${isMe?'bg-amber-100 border border-amber-300':'bg-slate-50'} text-[11px]"><div class="flex items-center gap-2 min-w-0"><span class="font-bold w-6 text-center shrink-0">${medal}</span><span class="truncate ${isMe?'font-bold text-amber-800':'text-slate-700'}">${r.siswa.nama}</span></div><span class="font-bold text-emerald-700 shrink-0">${r.rata.toFixed(1)}</span></div>`;
        }).join("")}
      </div>
      ${myData&&myRank>=5?`<div class="text-[10px] font-bold text-slate-700 mt-2">Posisi Kamu</div>
        <div class="flex justify-between items-center p-2 rounded-lg bg-amber-100 border border-amber-300 text-[11px]"><div class="flex items-center gap-2"><span class="font-bold w-6 text-center">#${myRank+1}</span><span class="truncate font-bold text-amber-800">${myData.siswa.nama}</span></div><span class="font-bold text-emerald-700">${myData.rata.toFixed(1)}</span></div>`:""}
