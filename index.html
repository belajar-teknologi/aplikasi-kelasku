-- EDUSMART SETUP v4 - SATU KALI JALAN UNTUK SEMUA
-- Jalankan di Supabase SQL Editor. Cukup sekali saja.
-- ============================================================

CREATE OR REPLACE FUNCTION create_dynamic_table(p_table_name TEXT, p_columns JSONB)
RETURNS VOID AS $$
DECLARE
  col_record RECORD;
  sql_query TEXT;
BEGIN
  IF p_table_name !~ '^[a-z][a-z0-9_]*$' THEN
    RAISE EXCEPTION 'Nama tabel hanya boleh huruf kecil, angka, dan underscore';
  END IF;

  sql_query := format('CREATE TABLE IF NOT EXISTS public.%I (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    created_at TIMESTAMPTZ DEFAULT now()', p_table_name);
  
  FOR col_record IN SELECT * FROM jsonb_to_recordset(p_columns) AS (name text, type text)
  LOOP
    IF col_record.type NOT IN ('text','integer','numeric','boolean','timestamptz','date','time','jsonb','bigint','real') THEN
      RAISE EXCEPTION 'Tipe kolom % tidak diizinkan', col_record.type;
    END IF;
    IF col_record.name !~ '^[a-z][a-z0-9_]*$' THEN
      RAISE EXCEPTION 'Nama kolom % tidak valid', col_record.name;
    END IF;
    sql_query := sql_query || format(', %I %s', col_record.name, col_record.type);
  END LOOP;

  sql_query := sql_query || ');';
  EXECUTE sql_query;
  EXECUTE format('GRANT ALL ON public.%I TO anon, authenticated, service_role', p_table_name);
END;
$$ LANGUAGE plpgsql SECURITY DEFINER;

GRANT EXECUTE ON FUNCTION create_dynamic_table(TEXT, JSONB) TO anon, authenticated, service_role;

CREATE OR REPLACE FUNCTION get_public_tables()
RETURNS TABLE (table_name text) AS $$
BEGIN
  RETURN QUERY
  SELECT t.table_name::text
  FROM information_schema.tables t
  WHERE t.table_schema = 'public'
    AND t.table_type = 'BASE TABLE'
    AND t.table_name NOT IN ('spatial_ref_sys');
END;
$$ LANGUAGE plpgsql SECURITY DEFINER;

GRANT EXECUTE ON FUNCTION get_public_tables() TO anon, authenticated, service_role;

CREATE OR REPLACE FUNCTION exec_sql(query text)
RETURNS void AS $$
BEGIN
  EXECUTE query;
END;
$$ LANGUAGE plpgsql SECURITY DEFINER;

GRANT EXECUTE ON FUNCTION exec_sql(TEXT) TO anon, authenticated, service_role;

/* =========================================================
   SUPABASE HELPERS
   ========================================================= */
function sbHeaders(extra = {}) {
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  return { "apikey": sb.key, "Authorization": `Bearer ${sb.key}`, "Content-Type": "application/json", ...extra };
}
async function sbRpc(namaRpc, params = {}) {
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  const res = await fetch(`${sb.url}/rest/v1/rpc/${namaRpc}`, {
    method: "POST", headers: sbHeaders(), body: JSON.stringify(params)
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e) { data = text; }
  if (!res.ok) throw new Error(data?.message || data?.error || `HTTP ${res.status}`);
  return data;
}
async function sbFetch(table, query = "") {
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  const res = await fetch(`${sb.url}/rest/v1/${table}${query}`, { headers: sbHeaders() });
  if (!res.ok) throw new Error(`Fetch ${table} gagal (${res.status}).`);
  return res.json();
}
async function sbInsert(table, rows) {
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  const res = await fetch(`${sb.url}/rest/v1/${table}`, {
    method: "POST",
    headers: sbHeaders({ "Prefer": "return=minimal" }),
    body: JSON.stringify(Array.isArray(rows) ? rows : [rows])
  });
  if (!res.ok) { const t = await res.text(); throw new Error(`Insert ${table} gagal: ${t}`); }
  return true;
}
async function sbUpsert(table, rows) {
  if (!rows.length) return true;
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  const res = await fetch(`${sb.url}/rest/v1/${table}`, {
    method: "POST",
    headers: sbHeaders({ "Prefer": "resolution=merge-duplicates,return=minimal" }),
    body: JSON.stringify(rows)
  });
  if (!res.ok) { const t = await res.text(); throw new Error(`Upsert ${table} gagal: ${t}`); }
  return true;
}
async function sbStorageUpload(bucket, path, file) {
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  const res = await fetch(`${sb.url}/storage/v1/object/${bucket}/${path}`, {
    method: "POST",
    headers: {
      "apikey": sb.key, "Authorization": `Bearer ${sb.key}`,
      "Content-Type": file.type || "application/octet-stream", "x-upsert": "true"
    },
    body: file
  });
  if (!res.ok) { const t = await res.text(); throw new Error(`Upload gagal: ${t.slice(0, 200)}`); }
  return `${sb.url}/storage/v1/object/public/${bucket}/${path}`;
}

  const arr = appState.db.al || [];

  return objs.slice(0, 10);
}

/* =========================================================
   JSONBIN
   ========================================================= */
function getJsonBinHeaders(cred, withCT = false) {
  const h = {};
  if (withCT) h["Content-Type"] = "application/json";
  if (cred?.key) h[cred.type === "access" ? "X-Access-Key" : "X-Master-Key"] = cred.key;
  return h;
}
async function createJsonBinDB(database, kode, nama) {
  const cred = getJsonBinCredential();
  if (!cred) throw new Error("API Key JSONBin belum ada.");
  const res = await fetch(`${JSONBIN_API_BASE}/b`, {
    method: "POST",
    headers: { ...getJsonBinHeaders(cred, true), "X-Bin-Private": "false", "X-Bin-Name": String(nama).slice(0, 128) },
    body: JSON.stringify(database)
  });
  const text = await res.text();
  let result = null;
  try { result = JSON.parse(text); } catch(e) {}
  if (!res.ok || !result?.metadata?.id) throw new Error(result?.message || `HTTP ${res.status}`);
  return result;
}
async function updateJsonBinDB() {
  const cfg = getAppConfig();
  const cred = getJsonBinCredential();
  if (!cfg?.binId || !cred) return false;
  try {
    appState.db.mn = appState.menus;
    const res = await fetch(`${JSONBIN_API_BASE}/b/${encodeURIComponent(cfg.binId)}`, {
      method: "PUT", headers: getJsonBinHeaders(cred, true), body: JSON.stringify(appState.db)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    setLS("edusmart_last_sync", new Date().toISOString());
    return true;
  } catch (err) { console.warn("JSONBin sync gagal:", err); return false; }
}
async function loadJsonBinDB(binId, cred) {
  const c = cred || getJsonBinCredential();
  const h = {};
  if (c) h[c.type === "access" ? "X-Access-Key" : "X-Master-Key"] = c.key;
  const res = await fetch(`${JSONBIN_API_BASE}/b/${encodeURIComponent(binId)}/latest?meta=false`, { cache: "no-store", headers: h });
  const text = await res.text();
  let data = null;
  try { data = JSON.parse(text); } catch(e) {}
  if (!res.ok) throw new Error(data?.message || `HTTP ${res.status}`);
  return data?.record && typeof data.record === "object" ? data.record : data;
}
function getConfigUrl(kode) { return CLOUDINARY_RAW_BASE + encodeURIComponent(`edusmart-${kode}.json`); }
async function uploadConfigCloudinary(configObj, kode) {
  const endpoint = `https://api.cloudinary.com/v1_1/${CLOUDINARY_JSON_CLOUD}/raw/upload`;
  const fileName = `edusmart-${kode}.json`;
  const blob = new Blob([JSON.stringify(configObj, null, 2)], { type: "application/json" });
  const form = new FormData();
  form.append("file", blob, fileName);
  form.append("upload_preset", CLOUDINARY_JSON_PRESET);
  form.append("public_id", fileName);
  const res = await fetch(endpoint, { method: "POST", body: form });
  const text = await res.text();
  let r = null;
  try { r = JSON.parse(text); } catch(e) {}
  if (!res.ok || !r?.secure_url) throw new Error(r?.error?.message || `HTTP ${res.status}`);
  return r;
}
async function loadConfigByCode(kode) {
  const code = String(kode || "").trim().toUpperCase();
  if (!code) throw new Error("Kode Aplikasi kosong.");
  const url = getConfigUrl(code);
  const res = await fetch(url + `?t=${Date.now()}`, { cache: "no-store" });
  if (!res.ok) throw new Error(`Kode ${code} tidak ditemukan.`);
  const cfg = await res.json();
  const binId = cfg.binId || cfg.database?.binId;
  if (!binId || cfg.kodeAplikasi !== code) throw new Error("Config tidak valid.");
  return { ...cfg, binId, guruCredentials: cfg.guruCredentials, cloudinaryUrl: url };
}

/* =========================================================
   INDEXEDDB
   ========================================================= */
const IDB_NAME = "edusmart_files";
const IDB_STORE = "files";
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, { keyPath: "key" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSave(key, file) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    const store = tx.objectStore(IDB_STORE);
    const reader = new FileReader();
    reader.onload = () => {
      store.put({ key, dataUrl: reader.result, name: file.name, type: file.type });
      resolve();
    };
    reader.readAsDataURL(file);
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const req = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/* =========================================================
   UPLOAD FILE
   ========================================================= */
async function uploadFile(file, folder = "edusmart/profile") {
  if (file.size > 5 * 1024 * 1024) throw new Error("Ukuran file maksimal 5 MB.");
  const cloudName = String(getLS(STORAGE.CLOUD_NAME)).trim();
  const cloudPreset = String(getLS(STORAGE.CLOUD_PRESET)).trim();
  if (cloudName && cloudPreset) {
    try {
      const form = new FormData();
      form.append("file", file);
      form.append("upload_preset", cloudPreset);
      if (folder) form.append("folder", folder);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, { method: "POST", body: form });
      const r = await res.json();
      if (res.ok && r?.secure_url) return { url: r.secure_url, publicId: r.public_id, provider: "cloudinary" };
    } catch (err) { console.warn("Cloudinary gagal:", err); }
  }
  const sb = getSupabaseConfig();
  if (sb) {
    try {
      const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
      const fileName = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
      const res = await fetch(`${sb.url}/storage/v1/object/${SUPABASE_BUCKET}/${fileName}`, {
        method: "POST",
        headers: { "apikey": sb.key, "Authorization": `Bearer ${sb.key}`, "Content-Type": file.type, "x-upsert": "true" },
        body: file
      });
      if (res.ok) return { url: `${sb.url}/storage/v1/object/public/${SUPABASE_BUCKET}/${fileName}`, publicId: fileName, provider: "supabase" };
    } catch (err) { console.warn("Supabase gagal:", err); }
  }
  const key = `file_${Date.now()}_${Math.random().toString(36).slice(2)}`;
  await idbSave(key, file);
  const rec = await idbGet(key);
  return { url: rec.dataUrl, publicId: key, provider: "indexeddb" };
}

async function sha256(text) {
  const buf = new TextEncoder().encode(String(text));
  const hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
}

window.__numpad = { target: null, value: "", studentName: "", context: "", cells: [], currentIdx: -1, totalRows: 0, totalCols: 0 };
function getAllNilaiInputs() { return Array.from(document.querySelectorAll('input[data-numpad="nilai"]')); }

function computeNumpadGeometry(cells) {
  if (!cells || !cells.length) return { rows: 0, cols: 0 };
  const firstRow = cells[0].parentElement.parentElement;
  if (!firstRow) return { rows: 0, cols: 0 };
  const tbody = firstRow.parentElement;
  if (!tbody) return { rows: 0, cols: 0 };
  const allRows = Array.from(tbody.querySelectorAll("tr"));
  const rows = allRows.length;
  const cols = rows > 0 ? Math.round(cells.length / rows) : 0;
  return { rows, cols };
}

function openNumpad(inputEl) {
  if (!inputEl || inputEl.dataset.numpad !== "nilai") return;
  const np = document.getElementById("numpad-float");
  if (!np) return;
  const all = getAllNilaiInputs();
  const idx = all.indexOf(inputEl);
  const geom = computeNumpadGeometry(all);
  window.__numpad.target = inputEl;
  window.__numpad.cells = all;
  window.__numpad.currentIdx = idx;
  window.__numpad.totalRows = geom.rows;
  window.__numpad.totalCols = geom.cols;
  window.__numpad.value = String(inputEl.value || "").replace(/[^0-9]/g, "");
  if (window.__numpad.value === "") window.__numpad.value = "0";
  window.__numpad.studentName = inputEl.dataset.namaSiswa || "—";
  window.__numpad.context = inputEl.dataset.konteks || "";
  document.getElementById("np-student-name").textContent = window.__numpad.studentName;
  document.getElementById("np-context").textContent = window.__numpad.context || "≡ GESER ≡";
  updateNumpadDisplay();
  np.style.display = "block";
  const r = inputEl.getBoundingClientRect();
  const npW = np.offsetWidth || 270;
  const npH = np.offsetHeight || 380;
  let left = r.right + 10;
  let top = r.top;
  if (left + npW > window.innerWidth - 10) left = Math.max(10, r.left - npW - 10);
  if (top + npH > window.innerHeight - 10) top = Math.max(10, window.innerHeight - npH - 10);
  if (left < 10) left = 10;
  if (top < 10) top = 10;
  np.style.left = left + "px";
  np.style.top = top + "px";
  const savedSize = getLS(STORAGE.NUMPAD_SIZE, "normal");
  if (savedSize === "large") np.classList.add("np-large");
  else np.classList.remove("np-large");
  highlightNilaiInput(inputEl);
  updateNumpadDisplay();
}
function highlightNilaiInput(el) {
  document.querySelectorAll(".nilai-input-active").forEach(x => x.classList.remove("nilai-input-active"));
  if (el) el.classList.add("nilai-input-active");
}
function updateNumpadDisplay() {
  const d = document.getElementById("np-display");
  if (d) d.textContent = window.__numpad.value || "0";
}
function npPress(v) {
  if (v === "100") window.__numpad.value = "100";
  else {
    let cur = window.__numpad.value;
    if (cur === "100") cur = "0";
    if (cur === "0") cur = "";
    cur += v;
    let n = parseInt(cur, 10);
    if (isNaN(n)) n = 0;
    if (n > 100) n = 100;
    window.__numpad.value = String(n);
  }
  updateNumpadDisplay();
}
function npBack() { window.__numpad.value = window.__numpad.value.slice(0, -1); updateNumpadDisplay(); }

function nextNumpadTarget() {
  const cells = window.__numpad.cells;
  const t = window.__numpad.target;
  if (!cells.length || !t) return null;
  const idx = cells.indexOf(t);
  if (idx < 0) return null;
  const rows = window.__numpad.totalRows || 1;
  const cols = window.__numpad.totalCols || 1;
  const totalCells = cells.length;
  const currentRow = idx % rows;
  const currentCol = Math.floor(idx / rows);
  if (currentRow < rows - 1) {
    const nextIdx = idx + 1;
    if (nextIdx < totalCells) return cells[nextIdx];
  }
  if (currentCol < cols - 1) {
    const nextIdx = (currentCol + 1) * rows;
    if (nextIdx < totalCells) return cells[nextIdx];
  }
  return null;
}

function npOk() {
  const t = window.__numpad.target;
  if (!t) { closeNumpad(); return; }
  t.value = window.__numpad.value || "0";
  t.dispatchEvent(new Event("change", { bubbles: true }));
  const next = nextNumpadTarget();
  if (next) {
    setTimeout(() => {
      try { next.scrollIntoView({ behavior: "smooth", block: "center" }); } catch(e) { next.scrollIntoView(); }
      setTimeout(() => openNumpad(next), 120);
    }, 60);
  } else {
    closeNumpad();
    showToast("✓ Semua kolom terisi. Jangan lupa klik Simpan.", "info");
  }
}
function closeNumpad() {
  const np = document.getElementById("numpad-float");
  if (np) np.style.display = "none";
  window.__numpad.target = null;
  window.__numpad.cells = [];
  window.__numpad.currentIdx = -1;
  document.querySelectorAll(".nilai-input-active").forEach(x => x.classList.remove("nilai-input-active"));
}
function npZoom(delta) {
  const np = document.getElementById("numpad-float");
  if (!np) return;
  const isLarge = np.classList.contains("np-large");
  if (delta > 0 && !isLarge) { np.classList.add("np-large"); setLS(STORAGE.NUMPAD_SIZE, "large"); }
  else if (delta < 0 && isLarge) { np.classList.remove("np-large"); setLS(STORAGE.NUMPAD_SIZE, "normal"); }
}
function initNumpadDrag() {
  const el = document.getElementById("numpad-float");
  if (!el) return;
  let startX, startY, startL, startT, dragging = false;
  const onDown = (e) => {
    if (e.target.closest("button")) return;
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
    startL = parseInt(el.style.left, 10) || 0;
    startT = parseInt(el.style.top, 10) || 0;
    dragging = true;
    document.addEventListener("mousemove", onMove);
    document.addEventListener("touchmove", onMove, { passive: false });
    document.addEventListener("mouseup", onUp);
    document.addEventListener("touchend", onUp);
  };
  const onMove = (e) => {
    if (!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    const nl = Math.max(0, Math.min(window.innerWidth - el.offsetWidth, startL + p.clientX - startX));
    const nt = Math.max(0, Math.min(window.innerHeight - el.offsetHeight, startT + p.clientY - startY));
    el.style.left = nl + "px"; el.style.top = nt + "px";
    if (e.cancelable) e.preventDefault();
  };
  const onUp = () => {
    dragging = false;
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("touchmove", onMove);
    document.removeEventListener("mouseup", onUp);
    document.removeEventListener("touchend", onUp);
  };
  el.addEventListener("mousedown", onDown);
  el.addEventListener("touchstart", onDown, { passive: true });
}

function renderMainContent() {

async function handleLogin(e) {
  e.preventDefault();
  const role = document.getElementById("login-role").value;
  const code = document.getElementById("login-code").value.trim().toUpperCase();
  const username = document.getElementById("login-username").value.trim();
  const password = document.getElementById("login-password").value;
  if (!code) { showToast("Kode Aplikasi wajib diisi.", "error"); return; }
  if (!username || !password) { showToast("Username & Password wajib diisi.", "error"); return; }
  showLoading(true, "Memverifikasi...");
  try {
    const cfg = await loadConfigByCode(code);
    const db = await loadJsonBinDB(cfg.binId);
    if (role === "guru") {
      const gc = db.a?.gc || cfg.guruCredentials;
      if (!gc) throw new Error("Kredensial guru tidak ditemukan.");
      const gcUser = Array.isArray(gc) ? gc[0] : gc.username;
      const gcPass = Array.isArray(gc) ? gc[1] : gc.password;
      const gcHash = Array.isArray(gc) ? gc[2] : gc.passwordHash;
      if (gcUser !== username) throw new Error("Username guru salah.");
      let ok = false;
      if (gcHash) { const hash = await sha256(password); ok = hash === gcHash; }
      if (!ok && gcPass) ok = gcPass === password;
      if (!ok) throw new Error("Password guru salah.");
      appState.db = db;
      ensureMasterData();
      restoreMenusFromDb(db);
      restoreCredsFromDb(db);
      saveAppConfig(cfg);
      setLS(STORAGE.APP_CODE, code);
      appState.currentUser = {
        username: gcUser, name: db.a?.ng || cfg.namaGuru || "Guru", role: "guru",
        sekolah: db.a?.ns || cfg.namaSekolah || "", kelas: db.a?.kl || cfg.kelas || ""
      };
      setLS(STORAGE.USER, JSON.stringify(appState.currentUser));
      setLS(STORAGE.DB, JSON.stringify(appState.db));
      appState.activeView = "dashboard";
      addActivity("login_guru", `${appState.currentUser.name} login`);
      showLoading(false);
      showToast(`Selamat datang, ${appState.currentUser.name}!`, "success");
      renderApp();
      return;
    }
    const sw = (db.sw || []).find(s => String(s[FIELD.SISWA.USER]||"").toLowerCase() === username.toLowerCase() && String(s[FIELD.SISWA.PASS]) === password);
    if (!sw) throw new Error("Username atau password siswa salah.");
    const siswa = siswaToObj(sw);
    appState.db = db;
    ensureMasterData();
    restoreMenusFromDb(db);
    restoreCredsFromDb(db);
    saveAppConfig(cfg);
    setLS(STORAGE.APP_CODE, code);
    appState.currentUser = {
      username: siswa.username, name: siswa.nama, role: "siswa",
      nis: siswa.nis, noAbsen: siswa.noAbsen, kelas: siswa.kelas, siswaId: siswa.id,
      sekolah: db.a?.ns || cfg.namaSekolah || "", guru: db.a?.ng || cfg.namaGuru || ""
    };
    setLS(STORAGE.USER, JSON.stringify(appState.currentUser));
    setLS(STORAGE.DB, JSON.stringify(appState.db));
    appState.activeView = "dashboard_siswa";
    appState.db.ll = appState.db.ll || [];
    appState.db.ll.push(loginArr({ id: Date.now(), siswaId: siswa.id, nama: siswa.nama, nis: siswa.nis, kelas: siswa.kelas, waktu: new Date().toISOString() }));
    addActivity("login_siswa", `${siswa.nama} (${siswa.nis}) login`, { siswaId: siswa.id });
    showLoading(false);
    showToast(`Selamat datang, ${siswa.nama}!`, "success");
    renderApp();
  } catch (err) {
    showLoading(false);
    showToast("Login gagal: " + err.message, "error");
  }
}

async function executeBuatDatabase() {
  const school = document.getElementById("db-school").value.trim();
  const guru = document.getElementById("db-guru").value.trim();
  const kelas = document.getElementById("db-kelas").value.trim();
  const tahunAjar = document.getElementById("db-nama").value.trim() || "-";
  const nama = `EduSmart ${kelas} ${tahunAjar}`;
  const username = document.getElementById("db-username").value.trim();
  const password = document.getElementById("db-password").value;
  const password2 = document.getElementById("db-password2").value;
  const geminiKey = document.getElementById("db-gemini").value.trim();
  if (!school || !guru || !kelas) { showToast("Lengkapi data sekolah.", "error"); return; }
  if (username.length < 4) { showToast("Username min 4 karakter.", "error"); return; }
  if (password.length < 6) { showToast("Password min 6 karakter.", "error"); return; }
  if (password !== password2) { showToast("Konfirmasi password tidak cocok.", "error"); return; }
  const cleanClass = kelas.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let token = "";
  for (let i = 0; i < 6; i++) token += chars[Math.floor(Math.random() * chars.length)];
  const kodeAplikasi = `EDU-${cleanClass}-${token}`;
  const passwordHash = await sha256(password);
  const database = JSON.parse(JSON.stringify(DEFAULT_DB));
  database.a = { k: kodeAplikasi, ns: school, ng: guru, kl: kelas, gc: [username, password, passwordHash], lk: null, ls: null, fg: null };
  database.md.u.ta = tahunAjar;
  database.cfg = { sbUrl: "", sbKey: "", cloudName: "", cloudPreset: "", geminiKey: geminiKey || "" };
  database.mn = [...DEFAULT_MENUS];
  showLoading(true, "Membuat database...");
  try {
    const bin = await createJsonBinDB(database, kodeAplikasi, nama);
    const binId = bin.metadata.id;
    const configObj = {
      version: 4, kodeAplikasi, namaSekolah: school, namaGuru: guru, kelas, tahunAjar,
      guruCredentials: { username, passwordHash },
      geminiApiKey: geminiKey || "",
      database: { provider: "jsonbin", binId },
      createdAt: new Date().toISOString()
    };
    const cloud = await uploadConfigCloudinary(configObj, kodeAplikasi);
    saveAppConfig({ ...configObj, binId, cloudinaryUrl: cloud.secure_url || getConfigUrl(kodeAplikasi) });
    if (geminiKey) saveGeminiKey(geminiKey);
    appState.db = database;
    appState.menus = [...DEFAULT_MENUS];
    setLS(STORAGE.MENUS, JSON.stringify(appState.menus));
    appState.currentUser = { username, name: guru, role: "guru", sekolah: school, kelas };
    setLS(STORAGE.USER, JSON.stringify(appState.currentUser));
    setLS(STORAGE.DB, JSON.stringify(appState.db));
    setLS(STORAGE.APP_CODE, kodeAplikasi);
    appState.activeView = "dashboard";
    showLoading(false);
    renderApp();
    const mb = document.getElementById("modal-body");
    mb.innerHTML = `
    <div class="text-center space-y-4 p-2 text-xs">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-3xl"><i class="fa-solid fa-circle-check"></i></div>
      <h3 class="text-xl font-extrabold text-slate-800">Database Berhasil Dibuat</h3>
      <div class="bg-slate-950 text-emerald-400 rounded-2xl p-5 font-mono text-2xl font-bold tracking-widest select-all">${kodeAplikasi}</div>
      <div class="grid grid-cols-2 gap-2 text-left text-[11px] bg-slate-50 border rounded-xl p-3">
        <div><b>Sekolah</b><br>${school}</div>
        <div><b>Kelas</b><br>${kelas}</div>
        <div><b>Tahun Ajar</b><br>${tahunAjar}</div>
        <div><b>Username</b><br><span class="font-mono">${username}</span></div>
        <div class="col-span-2"><b>Bin ID</b><br><span class="font-mono text-[9px]">${binId}</span></div>
      </div>
      <div class="p-2 bg-amber-50 border border-amber-200 rounded-xl text-[10px] text-amber-800">⚠️ Catat Kode + Username + Password Anda! Password guru hanya tersimpan di JSONBin.</div>
      <div class="flex justify-center gap-2">
        <button onclick="navigator.clipboard.writeText('${kodeAplikasi}');showToast('Kode disalin.','success')" class="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold">Salin Kode</button>
        <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl font-semibold">Tutup</button>
      </div>
    </div>
    `;
  } catch (err) {
    showLoading(false);
    showToast("Gagal buat database: " + err.message, "error");
  }
}

async function testCloudinary() {
  const r = document.getElementById("cloud-test-result");
  r.classList.remove("hidden");
  r.className = "text-[10px] p-2 rounded-lg bg-slate-100 text-slate-600";
  r.textContent = "⏳ Testing Cloudinary...";
  const name = document.getElementById("cloud-name").value.trim();
  const preset = document.getElementById("cloud-preset").value.trim();
  if (!name || !preset) { r.className = "text-[10px] p-2 rounded-lg bg-red-50 text-red-700"; r.textContent = "❌ Cloud Name & Preset wajib diisi."; return; }
  try {
    const b64 = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=";
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const file = new File([new Blob([bytes], { type: "image/png" })], "test.png", { type: "image/png" });
    const form = new FormData();
    form.append("file", file);
    form.append("upload_preset", preset);
    form.append("folder", "edusmart/test");
    const res = await fetch(`https://api.cloudinary.com/v1_1/${name}/image/upload`, { method: "POST", body: form });
    const data = await res.json();
    if (res.ok && data?.secure_url) {
      r.className = "text-[10px] p-2 rounded-lg bg-emerald-50 text-emerald-700";
      r.textContent = "✅ Cloudinary OK! Upload berhasil.";
    } else {
      r.className = "text-[10px] p-2 rounded-lg bg-red-50 text-red-700";
      r.textContent = "❌ " + (data?.error?.message || `HTTP ${res.status}`);
    }
  } catch (err) {
    r.className = "text-[10px] p-2 rounded-lg bg-red-50 text-red-700";
    r.textContent = "❌ " + err.message;
  }
}

  a.href = "data:text/json;charset=utf-8," + encodeURIComponent(data);

function importBackup(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = (ev) => {
    try {
      const p = JSON.parse(ev.target.result);
      if (p.menus) appState.menus = p.menus;
      if (p.database) appState.db = p.database;
      ensureMasterData();
      saveLocal();
      showToast("Restore berhasil.", "success");
      renderApp();
      closeModal();
    } catch (err) { showToast("File tidak valid.", "error"); }
  };
  r.readAsText(f);
}
async function saveToCloud() {
  const cfg = getAppConfig();
  const cred = getJsonBinCredential();
  if (!cred) { showToast("API Key JSONBin belum diset.", "error"); return; }
  if (!cfg?.binId) { showToast("Bin ID belum ada.", "error"); return; }
  showLoading(true, "Menyimpan...");
  ensureMasterData();
  appState.db.mn = appState.menus;
  const ok = await updateJsonBinDB();
  try {
    const geminiKey = getGeminiKey();
    const gcHashOnly = { username: appState.db.a?.gc?.[0] || "", passwordHash: appState.db.a?.gc?.[2] || "" };
    await uploadConfigCloudinary({
      version: cfg.version || 4,
      kodeAplikasi: cfg.kodeAplikasi,
      namaSekolah: appState.db.a?.ns || cfg.namaSekolah,
      namaGuru: appState.db.a?.ng || cfg.namaGuru,
      kelas: appState.db.a?.kl || cfg.kelas,
      tahunAjar: appState.db.md?.u?.ta || cfg.tahunAjar || "-",
      guruCredentials: gcHashOnly,
      geminiApiKey: geminiKey,
      database: { provider: "jsonbin", binId: cfg.binId },
      createdAt: cfg.createdAt || new Date().toISOString()
    }, cfg.kodeAplikasi);
  } catch (e) {}
  const sb = getSupabaseConfig();
  if (sb) {
    try {
      const nc = appState.db.nc || [];
      if ((appState.db.nl || []).length) {
        await sbUpsert("nilai", appState.db.nl.map(arr => {
          const o = nilaiToObj(arr, nc);
          return { id: String(o.id), siswa_id: String(o.siswaId), mapel_kode: o.mapelKode, scores: o.scores, updated_at: new Date().toISOString() };
        }));
      }
      if ((appState.db.ab || []).length) {
        await sbUpsert("absensi", appState.db.ab.map(arr => {
          const o = absenToObj(arr);
          return { id: String(o.id), tanggal: o.tanggal, siswa_id: String(o.siswaId), status: o.status, updated_at: new Date().toISOString() };
        }));
      }
      if ((appState.db.jr || []).length) {
        await sbUpsert("jurnal", appState.db.jr.map(arr => {
          const o = jurnalToObj(arr);
          return { id: String(o.id), tanggal: o.tanggal, kelas: o.kelas, mapel: o.mapel, topik: o.topik, catatan: o.catatan, updated_at: new Date().toISOString() };
        }));
      }
    } catch(e) {}
  }
  showLoading(false);
  if (ok) { showToast("✓ Tersimpan ke cloud.", "success"); setSyncBadge(false, "SIAP"); }
  else showToast("Tersimpan lokal.", "error");
}

async function cekKoneksiSupabase() {
  const r = document.getElementById("cek-koneksi-result");
  if (!r) return;
  r.classList.remove("hidden");
  r.className = "text-xs p-3 rounded-xl bg-slate-100 text-slate-600";
  r.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Mengecek...`;
  const results = [];
  const sb = getSupabaseConfig();
  if (!sb) { r.className = "text-xs p-3 rounded-xl bg-red-50 text-red-700"; r.innerHTML = "❌ Isi URL & Key dulu."; return; }
  try { await sbRpc("get_public_tables"); results.push(`<div class="text-emerald-700">✓ get_public_tables</div>`); }
  catch (e) { results.push(`<div class="text-red-700">✗ get_public_tables — ${escapeHtml(e.message)}</div>`); }
  try { await sbRpc("exec_sql", { query: "SELECT 1" }); results.push(`<div class="text-emerald-700">✓ exec_sql</div>`); }
  catch (e) { results.push(`<div class="text-red-700">✗ exec_sql — ${escapeHtml(e.message)}</div>`); }
  try {
    const res = await fetch(`${sb.url}/storage/v1/bucket/files`, { headers: { "apikey": sb.key, "Authorization": `Bearer ${sb.key}` } });
    if (res.ok) results.push(`<div class="text-emerald-700">✓ Bucket 'files'</div>`);
    else results.push(`<div class="text-amber-700">⚠ Bucket belum ada</div>`);
  } catch (e) { results.push(`<div class="text-amber-700">⚠ Bucket tidak dicek</div>`); }
  const allOk = results.every(x => x.includes("text-emerald-700"));
  r.className = `text-xs p-3 rounded-xl ${allOk ? 'bg-emerald-50' : 'bg-amber-50'}`;
  r.innerHTML = `<div class="font-bold mb-2">${allOk ? '✅ Setup OK!' : '⚠️ Sebagian belum aktif:'}</div><div class="space-y-1">${results.join("")}</div>`;
}

async function buatTabelDinamis() {
  const sb = getSupabaseConfig();
  if (!sb) { showToast("Supabase belum di-setup.", "error"); return; }
  const tableName = document.getElementById("new-table-name").value.trim().toLowerCase();
  if (!/^[a-z][a-z0-9_]*$/.test(tableName)) { showToast("Nama tabel tidak valid.", "error"); return; }
  const cols = window.__newTableCols.filter(c => c.name.trim()).map(c => ({ name: c.name.trim().toLowerCase().replace(/[^a-z0-9_]/g, "_"), type: c.type }));
  if (!cols.length) { showToast("Minimal 1 kolom.", "error"); return; }
  showLoading(true, "Membuat tabel...");
  try {
    await sbRpc("create_dynamic_table", { p_table_name: tableName, p_columns: cols });
    try { await sbRpc("exec_sql", { query: "NOTIFY pgrst, 'reload schema'" }); } catch(e) {}
    showLoading(false);
    showToast(`✓ Tabel "${tableName}" dibuat!`, "success");
  } catch (err) { showLoading(false); showToast("Gagal: " + err.message, "error"); }
}

async function runSqlFromEditor() {
  const sb = getSupabaseConfig();
  const r = document.getElementById("sql-editor-result");
  if (!sb) { showToast("Supabase belum di-setup.", "error"); return; }
  const sql = document.getElementById("sql-editor").value.trim();
  if (!sql) { showToast("SQL kosong.", "error"); return; }
  if (/\b(DROP|DELETE|TRUNCATE)\b/i.test(sql)) {
    showToast("⛔ Diblokir.", "error");
    r.classList.remove("hidden"); r.className = "text-xs p-3 rounded-xl bg-red-50 text-red-700";
    r.textContent = "⛔ DROP/DELETE/TRUNCATE diblokir.";
    return;
  }
  showLoading(true, "Menjalankan...");
  try {
    await sbRpc("exec_sql", { query: sql });
    showLoading(false);
    r.classList.remove("hidden"); r.className = "text-xs p-3 rounded-xl bg-emerald-50 text-emerald-700";
    r.innerHTML = `✓ Berhasil.`;
  } catch (err) {
    showLoading(false);
    r.classList.remove("hidden"); r.className = "text-xs p-3 rounded-xl bg-red-50 text-red-700";
    r.innerHTML = `✗ ${escapeHtml(err.message)}`;
  }
}

function importExcelSiswa(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = async (ev) => {
    try {
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, { defval: "" });
      if (!json.length) { showToast("File kosong.", "error"); return; }
      let n = 0;
      json.forEach(item => {
        if (item.Nama) {
          const nama = String(item.Nama);
          const s = {
            id: nextId(appState.db.sw),
            noAbsen: Number(item.NoAbsen) || (appState.db.sw.length + 1),
            nis: String(item.NIS || ""),
            nama,
            kelas: String(item.Kelas || "5"),
            jk: String(item.JK || "L"),
            username: String(item.Username || nama.toLowerCase().replace(/[^a-z0-9]/g, ".").slice(0,20)),
            password: String(item.Password || "siswa123"),
            tempatLahir: String(item.TempatLahir || "-"),
            tglLahir: String(item.TglLahir || "-"),
            alamat: String(item.Alamat || "-"),
            fotoUrl: null
          };
          appState.db.sw.push(siswaArr(s));
          n++;
        }
      });
      saveLocal(); setSyncBadge(true);
      addActivity("import_siswa", `Import ${n} siswa dari Excel`);
      showToast(`Import ${n} data. Menyimpan...`, "info");
      await updateJsonBinDB();
      setSyncBadge(false);
      renderMainContent();
    } catch (err) { showToast("File tidak valid.", "error"); }
  };
  r.readAsArrayBuffer(f);
  e.target.value = "";
}

function downloadTemplateSiswa() {
  const header = ["NoAbsen", "NIS", "Nama", "Kelas", "JK", "Username", "Password", "TempatLahir", "TglLahir", "Alamat"];
  const contoh = [
    [1, "2025001", "Ahmad Fauzi", appState.db.a?.kl || "5", "L", "ahmad.fauzi", "siswa123", "Jakarta", "2014-05-12", "Jl. Merdeka No. 1"],
    [2, "2025002", "Siti Aminah", appState.db.a?.kl || "5", "P", "siti.aminah", "siswa123", "Bandung", "2014-08-20", "Jl. Sudirman No. 2"]
  ];
  const ws = XLSX.utils.aoa_to_sheet([header, ...contoh]);
  ws["!cols"] = header.map(h => ({ wch: Math.max(String(h).length + 2, 12) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Siswa");
  XLSX.writeFile(wb, `Template_DataSiswa_${Date.now()}.xlsx`);
  showToast("✓ Template siswa diunduh.", "success");
}

function updateNilai(sid, mk, col, val) {
  const nc = appState.db.nc || [];
  const idxCol = nc.indexOf(col);
  if (idxCol < 0) return;
  let n = Number(val);
  if (isNaN(n)) n = 0;
  if (n < 0) n = 0;
  if (n > 100) n = 100;
  let nlArr = (appState.db.nl || []).find(a => Number(a[FIELD.NILAI.SISWA_ID]) === Number(sid) && a[FIELD.NILAI.MAPEL_KODE] === mk);
  if (!nlArr) {
    const newId = nextId(appState.db.nl);
    const scores = new Array(nc.length).fill(0);
    scores[idxCol] = n;
    nlArr = [newId, sid, mk, scores];
    appState.db.nl = appState.db.nl || [];
    appState.db.nl.push(nlArr);
  } else {
    if (!Array.isArray(nlArr[FIELD.NILAI.SCORES])) nlArr[FIELD.NILAI.SCORES] = new Array(nc.length).fill(0);
    while (nlArr[FIELD.NILAI.SCORES].length < nc.length) nlArr[FIELD.NILAI.SCORES].push(0);
    nlArr[FIELD.NILAI.SCORES][idxCol] = n;
  }
  saveLocal(); setSyncBadge(true);
}

function downloadTemplateNilai(mapelKode) {
  const nc = appState.db.nc || [];
  const mapel = (appState.db.mp || []).map(mapelToObj).find(m => m.kode === mapelKode);
  if (!mapel) { showToast("Mapel tidak ditemukan.", "error"); return; }
  const kelasFilter = window.__penilaianKelas || "ALL";
  const siswaAll = (appState.db.sw || []).map(siswaToObj);
  const siswaList = kelasFilter === "ALL" ? siswaAll : siswaAll.filter(s => s.kelas === kelasFilter);
  if (!siswaList.length) { showToast("Tidak ada siswa.", "error"); return; }
  const header = ["NoAbsen", "NIS", "Nama", "Kelas", ...nc];
  const rows = siswaList.map(s => {
    const nlArr = (appState.db.nl || []).find(n => Number(n[FIELD.NILAI.SISWA_ID]) === Number(s.id) && n[FIELD.NILAI.MAPEL_KODE] === mapelKode);
    const rec = nlArr ? nilaiToObj(nlArr, nc) : { scores: {} };
    const row = [s.noAbsen, s.nis, s.nama, s.kelas];
    nc.forEach(cc => row.push(Number(rec.scores?.[cc] ?? 0)));
    return row;
  });
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  ws["!cols"] = header.map((h, i) => {
    let maxLen = String(h).length;
    [header, ...rows].forEach(r => { const len = String(r[i] ?? "").length; if (len > maxLen) maxLen = len; });
    return { wch: Math.min(Math.max(maxLen + 2, 8), 32) };
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Nilai");
  const kelasLabel = kelasFilter === "ALL" ? "SemuaKelas" : `Kelas${kelasFilter}`;
  XLSX.writeFile(wb, `Template_Nilai_${mapelKode}_${kelasLabel}.xlsx`);
  showToast(`✓ Template diunduh.`, "success");
}
async function importNilaiExcel(e, mapelKode) {
  const f = e.target.files[0];
  if (!f) return;
  const nc = appState.db.nc || [];
  const reader = new FileReader();
  reader.onload = async function(evt) {
    showLoading(true, "Membaca Excel...");
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, { defval: "" });
      if (!json.length) throw new Error("File kosong.");
      const sampleKeys = Object.keys(json[0] || {});
      const keyNama = sampleKeys.find(k => /nama/i.test(k));
      if (!keyNama) throw new Error("Kolom 'Nama' tidak ditemukan.");
      let updated = 0, added = 0, skipped = 0;
      const notFound = [];
      json.forEach(row => {
        const nama = String(row[keyNama] ?? "").trim();
        if (!nama) { skipped++; return; }
        const sw = (appState.db.sw || []).find(s => String(s[FIELD.SISWA.NAMA]).toLowerCase() === nama.toLowerCase());
        if (!sw) { skipped++; notFound.push(nama); return; }
        const sid = sw[FIELD.SISWA.ID];
        let nlArr = (appState.db.nl || []).find(a => Number(a[FIELD.NILAI.SISWA_ID]) === Number(sid) && a[FIELD.NILAI.MAPEL_KODE] === mapelKode);
        if (!nlArr) {
          nlArr = [nextId(appState.db.nl), sid, mapelKode, new Array(nc.length).fill(0)];
          appState.db.nl = appState.db.nl || [];
          appState.db.nl.push(nlArr);
          added++;
        } else updated++;
        nc.forEach((cc, i) => {
          if (Object.prototype.hasOwnProperty.call(row, cc)) {
            let n = Number(row[cc]);
            if (isNaN(n)) n = 0;
            if (n < 0) n = 0;
            if (n > 100) n = 100;
            nlArr[FIELD.NILAI.SCORES][i] = n;
          }
        });
      });
      saveLocal();
      addActivity("import_nilai", `Import nilai ${mapelKode}: ${updated + added}`);
      const okJB = await updateJsonBinDB();
      let okSB = false;
      const sb = getSupabaseConfig();
      if (sb) {
        try {
          await sbUpsert("nilai", appState.db.nl.map(arr => {
            const o = nilaiToObj(arr, nc);
            return { id: String(o.id), siswa_id: String(o.siswaId), mapel_kode: o.mapelKode, scores: o.scores, updated_at: new Date().toISOString() };
          }));
          okSB = true;
        } catch(e) {}
      }
      showLoading(false);
      setSyncBadge(!(okJB || okSB));
      let msg = `✓ Import: ${updated} diperbarui, ${added} baru`;
      if (skipped) msg += `, ${skipped} dilewati`;
      showToast(msg, "success");
      if (notFound.length) setTimeout(() => showToast(`⚠️ Tidak ditemukan: ${notFound.slice(0,3).join(", ")}${notFound.length>3?` +${notFound.length-3}`:""}`, "error"), 700);
      renderMainContent();
    } catch (err) {
      showLoading(false);
      showToast("Import gagal: " + err.message, "error");
    } finally { e.target.value = ""; }
  };
  reader.readAsArrayBuffer(f);
}

function cetakRaporPDF() {

  const mapelAll = (appState.db.mp || []).map(mapelToObj);
  const filterKelas = window.__hbKelas || "ALL";
  const filterSiswa = window.__hbSiswa || "ALL";
  let filtered = filterKelas === "ALL" ? siswaAll : siswaAll.filter(s => s.kelas === filterKelas);
  if (filterSiswa !== "ALL") filtered = filtered.filter(s => String(s.id) === String(filterSiswa));
  doc.setFontSize(16);
  doc.text("LAPORAN HASIL BELAJAR", 14, 20);
  doc.setFontSize(10);
  doc.text(`Sekolah: ${appState.db.a?.ns || "-"}`, 14, 28);
  doc.text(`Kelas: ${filterKelas === "ALL" ? "Semua" : filterKelas}`, 14, 34);
  if (filterSiswa !== "ALL" && filtered.length) doc.text(`Siswa: ${filtered[0]?.nama || "-"}`, 14, 40);
  const rows = [];
  filtered.forEach(s => {
    mapelAll.forEach(m => {
      const nlArr = (appState.db.nl || []).find(n => Number(n[FIELD.NILAI.SISWA_ID]) === Number(s.id) && n[FIELD.NILAI.MAPEL_KODE] === m.kode);
      const rec = nlArr ? nilaiToObj(nlArr, nc) : { scores: {} };
      let total = 0;
      const row = [s.noAbsen, s.nama, s.kelas, m.nama];
      nc.forEach(cc => { const v = Number(rec.scores?.[cc] ?? 0); row.push(v); total += v; });
      row.push((total/nc.length).toFixed(1));
      rows.push(row);
    });
  });
  const startY = (filterSiswa !== "ALL") ? 46 : 42;
  doc.autoTable({ startY, head: [["No","Nama","Kelas","Mapel",...nc,"Rata²"]], body: rows, styles: { fontSize: 8 } });
  doc.save(`Rapor_${Date.now()}.pdf`);

function cetakRaporSiswa(sid) {

  const doc = new jsPDF();
  const nc = appState.db.nc || [];
  const mapelAll = (appState.db.mp || []).map(mapelToObj);
  const siswa = (appState.db.sw || []).map(siswaToObj).find(s => String(s.id) === String(sid));
  if (!siswa) { showToast("Siswa tidak ditemukan.", "error"); return; }
  doc.setFontSize(16);

  const body = [];

async function fetchGeminiWithRetry(prompt, systemPrompt, apiKey) {
  let lastError = null;
  for (const model of GEMINI_MODELS) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
    const payload = { contents: [{ parts: [{ text: prompt }] }], systemInstruction: systemPrompt ? { parts: [{ text: systemPrompt }] } : undefined };
    try {
      const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      if (res.ok) return await res.json();
      if (res.status === 401) throw new Error("API Key tidak valid.");
      if (res.status === 403) throw new Error("API Key diblokir.");
      if (res.status === 404) { lastError = new Error(`Model ${model} tidak didukung.`); continue; }
      lastError = new Error(`HTTP ${res.status}`);
    } catch (err) { lastError = err; }
  }
  throw lastError || new Error("Gagal menghubungi Gemini.");
}
async function generateAI() {
  const topic = document.getElementById("ai-topic").value.trim() || "Topik";
  const kelas = document.getElementById("ai-kelas").value.trim() || "5";
  const out = document.getElementById("ai-out");
  const loader = document.getElementById("ai-loader");
  const btn = document.getElementById("ai-generate-btn");
  const apiKey = getGeminiKey();
  out.classList.remove("hidden");
  if (!apiKey) { out.textContent = "Isi API Key dulu di Pengaturan."; showToast("API Key kosong.", "info"); return; }
  loader.classList.remove("hidden");
  if (btn) btn.disabled = true;
  out.textContent = "⏳ Meminta AI...";
  try {
    const result = await fetchGeminiWithRetry(`Buat draft pembelajaran:\nTopik: ${topic}\nKelas: ${kelas}\n\nFormat: 1. Tujuan, 2. Materi, 3. Kegiatan, 4. Soal, 5. Rubrik.`, "Anda guru ahli Indonesia.", apiKey);
    const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!text) throw new Error("Respons kosong.");
    out.textContent = text;
    showToast("✓ Berhasil.", "success");
  } catch (err) {
    out.textContent = `⚠️ ${err.message}`;
    showToast("Gagal: " + err.message, "error");
  } finally {
    loader.classList.add("hidden");
    if (btn) btn.disabled = false;
  }
}

async function fetchRankingData() {
  let nilaiArr = (appState.db.nl || []).map(a => nilaiToObj(a, appState.db.nc || []));
  let source = "lokal";
  const sb = getSupabaseConfig();
  if (sb) {
    try {
      const rows = await sbFetch("nilai", "?limit=5000");
      if (Array.isArray(rows) && rows.length) {
        nilaiArr = rows.map(r => ({ id: r.id, siswaId: r.siswa_id, mapelKode: r.mapel_kode, scores: r.scores || {} }));
        source = "supabase";
      }
    } catch (e) {}
  }
  return { nilaiArr, source };
}
function hitungRankingSementara(siswaList, nilaiArr, mapelList) {
  const mapelKode = (mapelList || []).map(m => m.kode);
  const hasil = siswaList.map(s => {
    const rataPerMapel = [];
    mapelKode.forEach(mk => {
      const rec = nilaiArr.find(n => String(n.siswaId) === String(s.id) && String(n.mapelKode) === String(mk));
      if (!rec || !rec.scores) { rataPerMapel.push(0); return; }
      const vals = Object.values(rec.scores).map(v => Number(v) || 0);
      if (!vals.length) { rataPerMapel.push(0); return; }
      rataPerMapel.push(vals.reduce((a, b) => a + b, 0) / vals.length);
    });
    const overall = rataPerMapel.length ? (rataPerMapel.reduce((a, b) => a + b, 0) / rataPerMapel.length) : 0;
    return { siswa: s, rata: +overall.toFixed(2) };
  });
  hasil.sort((a, b) => b.rata - a.rata);
  return hasil;
}
function renderRankingCard(opts = {}) {
  const { title = "Ranking Sementara", kelasFilter = null, highlightSiswaId = null, showKelasDropdown = false, containerId = "ranking-card-content" } = opts;
  const siswaAll = (appState.db.sw || []).map(siswaToObj);
  const kelasList = [...new Set(siswaAll.map(s => s.kelas).filter(Boolean))].sort();
  const activeKelas = kelasFilter || (showKelasDropdown ? (kelasList[0] || "ALL") : "ALL");
  const dropdownHtml = showKelasDropdown ? `
    <select onchange="refreshRankingCard('${containerId}', this.value, '${highlightSiswaId || ''}')" class="text-[10px] px-2 py-1 border rounded-lg bg-white font-semibold">
      ${kelasList.map(k => `<option value="${k}" ${activeKelas===k?"selected":""}>Kelas ${k}</option>`).join("")}
      <option value="ALL" ${activeKelas==="ALL"?"selected":""}>Semua</option>
    </select>` : "";
  return `
  <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-3">
    <div class="flex items-center justify-between">
      <h3 class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-ranking-star text-amber-500"></i> ${title}</h3>
      <div class="flex items-center gap-2">${dropdownHtml}<button onclick="refreshRankingCard('${containerId}', '${activeKelas}', '${highlightSiswaId || ''}')" class="text-slate-400 hover:text-indigo-600"><i class="fa-solid fa-rotate text-xs"></i></button></div>
    </div>
    <div id="${containerId}"><div class="text-center text-xs text-slate-400 py-6"><i class="fa-solid fa-spinner fa-spin"></i></div></div>
  </div>`;
}
async function refreshRankingCard(containerId, kelasFilter, highlightSiswaId) {

window.__gameState = { soal: [], idx: 0, benar: 0, salah: 0, mulai: null, selesai: null, siswaId: null };
function generateSoalHitung() {
  const soalList = [];
  const ops = ["+", "-", "×", "÷"];
  for (let i = 0; i < 5; i++) {
    const op = ops[Math.floor(Math.random() * ops.length)];
    let a, b, jawaban, soal;
    if (op === "+") { a = randInt(1, 50); b = randInt(1, 50); jawaban = a + b; soal = `${a} + ${b}`; }
    else if (op === "-") { a = randInt(10, 50); b = randInt(1, a); jawaban = a - b; soal = `${a} − ${b}`; }
    else if (op === "×") { a = randInt(1, 12); b = randInt(1, 12); jawaban = a * b; soal = `${a} × ${b}`; }
    else { b = randInt(2, 10); jawaban = randInt(1, 10); a = b * jawaban; soal = `${a} ÷ ${b}`; }
    const opsi = new Set([jawaban]);
    while (opsi.size < 4) {
      let cand = jawaban + randInt(-5, 5);
      if (cand < 0) cand = Math.abs(cand);
      if (cand !== jawaban) opsi.add(cand);
    }
    soalList.push({ tipe: "hitung", soal: soal + " = ?", opsi: [...opsi].sort(() => Math.random() - 0.5).map(String), jawaban: String(jawaban) });
  }
  return soalList;
}
function generateSoalVocab() {
  const soalList = [];
  const shuffled = [...VOCAB_BANK].sort(() => Math.random() - 0.5).slice(0, 5);
  shuffled.forEach(w => {
    const tanya = Math.random() < 0.5;
    const soalText = tanya ? `Apa bahasa Indonesia "${w.en}"?` : `Apa bahasa Inggris "${w.id}"?`;
    const jawaban = tanya ? w.id : w.en;
    const salahPool = VOCAB_BANK.filter(x => x.en !== w.en && x.id !== w.id)
      .sort(() => Math.random() - 0.5).slice(0, 3)
      .map(x => tanya ? x.id : x.en);
    const opsi = [jawaban, ...salahPool].sort(() => Math.random() - 0.5);
    soalList.push({ tipe: "vocab", soal: soalText, opsi, jawaban });
  });
  return soalList;
}
async function generateSoalVocabAI() {
  const apiKey = getGeminiKey();
  if (!apiKey) throw new Error("API Key Gemini belum diset.");
  const cacheKey = new Date().toISOString().split("T")[0];
  const cache = safeParse(getLS(STORAGE.GAME_AI_CACHE));
  if (cache && cache.tanggal === cacheKey && Array.isArray(cache.soal) && cache.soal.length === 5) {
    return cache.soal;
  }
  const prompt = `Buat 5 soal kosakata bahasa Inggris untuk anak SD kelas 5. Format JSON array:
[{"soal":"Apa bahasa Indonesia 'apple'?","opsi":["apel","jeruk","mangga","pisang"],"jawaban":"apel"},...]
Hanya balas JSON, tanpa penjelasan.`;
  const result = await fetchGeminiWithRetry(prompt, "Anda pembuat soal SD.", apiKey);
  const text = result?.candidates?.[0]?.content?.parts?.[0]?.text || "";
  const match = text.match(/\[[\s\S]*\]/);
  if (!match) throw new Error("Format AI tidak valid.");
  const soalArr = JSON.parse(match[0]);
  const valid = soalArr.filter(s => s.soal && Array.isArray(s.opsi) && s.opsi.length === 4 && s.opsi.includes(s.jawaban));
  if (valid.length < 5) throw new Error("Soal AI tidak lengkap.");
  const result5 = valid.slice(0, 5).map(s => ({ tipe: "vocab", soal: s.soal, opsi: s.opsi, jawaban: s.jawaban }));
  setLS(STORAGE.GAME_AI_CACHE, JSON.stringify({ tanggal: cacheKey, soal: result5 }));
  return result5;
}

function jawabGame(pilih) {
  const st = window.__gameState;
  const soal = st.soal[st.idx];
  const benar = String(pilih) === String(soal.jawaban);
  if (benar) st.benar++; else st.salah++;
  st.detail.push({ tipe: soal.tipe, benar });
  st.idx++;
  setTimeout(() => renderSoalGame(), 400);
}
async function selesaiGame() {
  const area = document.getElementById("game-area");
  const st = window.__gameState;
  st.selesai = new Date().toISOString();
  const total = st.soal.length;
  const skor = Math.round((st.benar / total) * 100);
  const durasi = Math.round((new Date(st.selesai) - new Date(st.mulai)) / 1000);
  area.innerHTML = `
    <div class="text-center space-y-3 py-4">

      refreshLeaderboardGame(appState.currentUser.kelas);
    } catch (e) {
      showToast("Gagal simpan skor: " + e.message, "error");

  } else {
    showToast("Skor tidak disimpan (Supabase belum di-setup).", "info");
  }

async function refreshLeaderboardGame(kelas) {
  const el = document.getElementById("leaderboard-game");
  if (!el) return;
  el.innerHTML = `<div class="text-center text-xs text-slate-400 py-4"><i class="fa-solid fa-spinner fa-spin"></i></div>`;
  const sb = getSupabaseConfig();
  if (!sb) { el.innerHTML = `<div class="text-center text-xs text-slate-400 py-4">Supabase belum di-setup.</div>`; return; }
  try {
    const today = new Date().toISOString().split("T")[0];
    const rows = await sbFetch("skor_game", `?created_at=gte.${today}&kelas=eq.${encodeURIComponent(kelas)}&limit=500`);
    if (!rows.length) { el.innerHTML = `<div class="text-center text-xs text-slate-400 py-4">Belum ada yang main hari ini.</div>`; return; }
    const perSiswa = {};
    rows.forEach(r => {
      if (!perSiswa[r.siswa_id]) perSiswa[r.siswa_id] = { sesi: 0, total: 0, max: 0 };
      perSiswa[r.siswa_id].sesi++;
      perSiswa[r.siswa_id].total += Number(r.skor) || 0;
      perSiswa[r.siswa_id].max = Math.max(perSiswa[r.siswa_id].max, Number(r.skor) || 0);
    });
    const siswaAll = (appState.db.sw || []).map(siswaToObj);
    const list = Object.entries(perSiswa).map(([sid, d]) => {
      const s = siswaAll.find(x => String(x.id) === String(sid));
      return { nama: s?.nama || `Siswa ${sid}`, sesi: d.sesi, rata: Math.round(d.total / d.sesi), max: d.max, isMe: String(sid) === String(appState.currentUser?.siswaId) };
    }).sort((a, b) => b.sesi - a.sesi);
    const myStat = list.find(x => x.isMe);
    el.innerHTML = `
      <div class="text-[10px] font-bold text-slate-700">🎯 Paling Sering Main (Top 5)</div>
      <div class="space-y-1">
        ${list.slice(0, 5).map((r, i) => {
          const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `#${i+1}`;

            <span class="font-bold text-indigo-700">${r.sesi}×</span>
          </div>`;
        }).join("")}
      </div>
      ${myStat ? `<div class="text-[10px] font-bold text-slate-700 mt-3">📊 Statistik Kamu Hari Ini</div>
        <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-[11px] space-y-1">
          <div>Main: <b>${myStat.sesi}×</b></div>
          <div>Rata²: <b>${myStat.rata}</b></div>
          <div>Terbaik: <b>${myStat.max}</b></div>
        </div>` : ""}
    `;
  } catch (err) {
    el.innerHTML = `<div class="text-center text-xs text-red-500 py-4">${err.message}</div>`;
  }
}

async function gantiPasswordSiswa() {
  const sid = appState.currentUser.siswaId;
  const sw = appState.db.sw.find(x => Number(x[FIELD.SISWA.ID]) === Number(sid));
  if (!sw) return;
  const old = document.getElementById("old-pwd").value;
  const nw = document.getElementById("new-pwd").value;
  const nw2 = document.getElementById("new-pwd2").value;
  if (old !== sw[FIELD.SISWA.PASS]) { showToast("Password lama salah.", "error"); return; }
  if (nw.length < 4) { showToast("Min 4 karakter.", "error"); return; }
  if (nw !== nw2) { showToast("Konfirmasi tidak cocok.", "error"); return; }
  sw[FIELD.SISWA.PASS] = nw;
  saveLocal();
  addActivity("ganti_password", `${sw[FIELD.SISWA.NAMA]} ganti password`);
  showLoading(true, "Menyimpan...");
  const ok = await updateJsonBinDB();
  showLoading(false);
  if (ok) showToast("Password diubah.", "success");
  else showToast("Tersimpan lokal.", "error");
  renderMainContent();
}

  const c = document.getElementById("main-view-container");
  if (m.dataSource === "supabase") {
    c.innerHTML = `<div class="bg-white p-6 rounded-2xl border shadow-sm"><div class="text-center py-8 text-xs text-slate-500"><i class="fa-solid fa-spinner fa-spin"></i> Memuat ${m.table}...</div></div>`;
    try {
      const rows = await sbFetch(m.table, "?limit=200");
      const cols = rows.length ? Object.keys(rows[0]) : [];
      c.innerHTML = `
      <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-4 fade-in">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-bold"><i class="${m.icon || 'fa-solid fa-table'} text-indigo-600"></i> ${m.name}</h2>
          <button onclick="appState.activeView='${appState.currentUser?.role === 'guru' ? 'menu_tambahan' : 'kelasku'}';renderSidebarNav();renderMainContent()" class="text-xs text-slate-500 hover:text-indigo-600"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
        </div>
        <div class="text-xs bg-slate-50 p-2 rounded-lg">${rows.length} baris · tabel <b class="font-mono">${m.table}</b></div>
        <div class="overflow-x-auto">
          <table class="w-full text-xs border-collapse">
            <thead><tr class="bg-slate-100 border-b">${cols.map(cn => `<th class="p-2 text-left font-bold">${cn}</th>`).join("")}</tr></thead>
            <tbody class="divide-y">${rows.map(r => `<tr>${cols.map(cn => `<td class="p-2">${typeof r[cn] === "object" && r[cn] !== null ? JSON.stringify(r[cn]).slice(0,40) : (r[cn] ?? "-")}</td>`).join("")}</tr>`).join("")}</tbody>
          </table>
        </div>
      </div>`;
    } catch (err) {
      c.innerHTML = `<div class="bg-white p-6 rounded-2xl border shadow-sm"><div class="text-red-600 text-sm">Gagal memuat: ${err.message}</div></div>`;
    }
    return;
  }
  // Static
  const back = appState.currentUser?.role === "guru" ? "menu_tambahan" : "kelasku";
  c.innerHTML = `
  <div class="bg-white p-6 rounded-2xl border shadow-sm fade-in">
    <div class="flex justify-between items-center border-b pb-3">
      <h2 class="text-lg font-bold"><i class="${m.icon || 'fa-solid fa-file'} text-indigo-600"></i> ${m.name}</h2>
      <button onclick="appState.activeView='${back}';renderSidebarNav();renderMainContent()" class="text-xs text-slate-500 hover:text-indigo-600"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
    </div>
    <div class="py-16 text-center text-slate-400">
      <i class="fa-solid fa-file-lines text-5xl mb-3"></i>
      <div class="text-sm font-semibold">${m.name}</div>
      <div class="text-xs mt-1">Halaman statis siap diisi konten.</div>
    </div>
  </div>`;
}

function renderCustomMenuView(c, viewId) {
  const menu = appState.menus.find(m => m.id === viewId) || { name: viewId };
  const back = appState.currentUser?.role === "guru" ? "dashboard" : "dashboard_siswa";
  c.innerHTML = `
  <div class="bg-white p-6 rounded-2xl border shadow-sm fade-in">
    <div class="flex justify-between items-center border-b pb-3">
      <h2 class="text-lg font-bold">${menu.name || viewId}</h2>
      <button onclick="appState.activeView='${back}';renderSidebarNav();renderMainContent()" class="text-xs text-slate-500 hover:text-indigo-600"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
    </div>
    <div class="py-16 text-center text-slate-400">
      <i class="fa-solid fa-circle-question text-5xl mb-3"></i>
      <div class="text-sm">Halaman <b>${menu.name || viewId}</b> belum memiliki konten.</div>
    </div>
  </div>`;
}

/* =========================================================
   UTILITY
   ========================================================= */
function formatRelative(iso) {
  try {
    const d = new Date(iso);
    const diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return "baru saja";
    if (diff < 3600) return Math.floor(diff/60) + " mnt";
    if (diff < 86400) return Math.floor(diff/3600) + " jam";
    return Math.floor(diff/86400) + " hr";
  } catch(e) { return "-"; }
}
