window.__gameState={ soal:[], idx:0, benar:0, salah:0, mulai:null, selesai:null, detail:[] };

function generateSoalHitung() {
  const soalList=[]; 
  const ops=["+","-","×","÷"];
  for (let i=0;i<5;i++) {
    const op=ops[Math.floor(Math.random()*ops.length)]; 
    let a,b,jawaban,soal;
    if (op==="+") { a=randInt(1,50); b=randInt(1,50); jawaban=a+b; soal=`${a} + ${b}`; }
    else if (op==="-") { a=randInt(10,50); b=randInt(1,a); jawaban=a-b; soal=`${a} − ${b}`; }
    else if (op==="×") { a=randInt(1,12); b=randInt(1,12); jawaban=a*b; soal=`${a} × ${b}`; }
    else { b=randInt(2,10); jawaban=randInt(1,10); a=b*jawaban; soal=`${a} ÷ ${b}`; }
    const opsi=new Set([jawaban]);
    while (opsi.size<4) { 
      let cand=jawaban+randInt(-5,5); 
      if (cand<0) cand=Math.abs(cand); 
      if (cand!==jawaban) opsi.add(cand); 
    }
    soalList.push({ tipe:"hitung", soal: soal+" = ?", opsi:[...opsi].sort(()=>Math.random()-0.5).map(String), jawaban: String(jawaban) });
  }
  return soalList;
}
function generateSoalVocab() {
  const soalList=[]; 
  const shuffled=[...VOCAB_BANK].sort(()=>Math.random()-0.5).slice(0,5);
  shuffled.forEach(w=>{
    const tanya=Math.random()<0.5; 
    const soalText=tanya?`Apa bahasa Indonesia "${w.en}"?`:`Apa bahasa Inggris "${w.id}"?`; 
    const jawaban=tanya?w.id:w.en;
    const salahPool=VOCAB_BANK.filter(x=>x.en!==w.en&&x.id!==w.id).sort(()=>Math.random()-0.5).slice(0,3).map(x=>tanya?x.id:x.en);
    const opsi=[jawaban,...salahPool].sort(()=>Math.random()-0.5);
    soalList.push({ tipe:"vocab", soal: soalText, opsi, jawaban });
  });
  return soalList;
}
async function generateSoalVocabAI() {
  const apiKey=getGeminiKey(); 
  if (!apiKey) throw new Error("API Key Gemini belum diset.");
  const cacheKey=new Date().toISOString().split("T")[0]; 
  const cache=safeParse(getLS(STORAGE.GAME_AI_CACHE));
  if (cache && cache.tanggal===cacheKey && Array.isArray(cache.soal) && cache.soal.length===5) return cache.soal;
  const prompt=`Buat 5 soal kosakata bahasa Inggris untuk anak SD kelas 5. Format JSON array:\n[{"soal":"Apa bahasa Indonesia 'apple'?","opsi":["apel","jeruk","mangga","pisang"],"jawaban":"apel"}]\nHanya balas JSON.`;
  const result=await fetchGeminiWithRetry(prompt,"Anda pembuat soal SD.",apiKey);
  const text=result?.candidates?.[0]?.content?.parts?.[0]?.text||""; 
  const m=text.match(/\[[\s\S]*\]/); 
  if (!m) throw new Error("Format AI tidak valid.");
  const soalArr=JSON.parse(m[0]); 
  const valid=soalArr.filter(s=>s.soal&&Array.isArray(s.opsi)&&s.opsi.length===4&&s.opsi.includes(s.jawaban));
  if (valid.length<5) throw new Error("Soal AI tidak lengkap.");
  const r5=valid.slice(0,5).map(s=>({ tipe:"vocab", soal: s.soal, opsi: s.opsi, jawaban: s.jawaban }));
  setLS(STORAGE.GAME_AI_CACHE, JSON.stringify({ tanggal: cacheKey, soal: r5 })); 
  return r5;
}

function jawabGame(indexPilih) {
  const st = window.__gameState;
  const soal = st.soal[st.idx];
  const pilih = soal.opsi[indexPilih];
  const benar = String(pilih) === String(soal.jawaban);
  if (benar) st.benar++;
  else st.salah++;
  st.detail.push({ tipe: soal.tipe, benar });
  st.idx++;
  setTimeout(() => renderSoalGame(), 400);
}

async function refreshLeaderboardGame(kelas) {
  const el=document.getElementById("leaderboard-game");

  if (!sb) { 
    el.innerHTML=`<div class="text-center text-xs text-slate-400 py-4">Supabase belum di-setup.</div>`; 
    return; 
  }
  try {
    const today=new Date().toISOString().split("T")[0];
    const rows=await sbFetch("skor_game",`?created_at=gte.${today}&kelas=eq.${encodeURIComponent(kelas)}&limit=500`);
    if (!rows.length) { 
      el.innerHTML=`<div class="text-center text-xs text-slate-400 py-4">Belum ada yang main hari ini.</div>`; 
      return; 
    }
    const perSiswa={};
    rows.forEach(r=>{ 
      if (!perSiswa[r.siswa_id]) perSiswa[r.siswa_id]={ sesi:0, total:0, max:0 }; 
      perSiswa[r.siswa_id].sesi++; 
      perSiswa[r.siswa_id].total+=Number(r.skor)||0; 
      perSiswa[r.siswa_id].max=Math.max(perSiswa[r.siswa_id].max,Number(r.skor)||0); 
    });
    const siswaAll=(appState.db.sw||[]).map(siswaToObj);
    const list=Object.entries(perSiswa).map(([sid,d])=>{ 
      const s=siswaAll.find(x=>String(x.id)===String(sid)); 
      return { nama: s?.nama||`Siswa ${sid}`, sesi: d.sesi, rata: Math.round(d.total/d.sesi), max: d.max, isMe: String(sid)===String(appState.currentUser?.siswaId) }; 
    }).sort((a,b)=>b.sesi-a.sesi);
    const myStat=list.find(x=>x.isMe);
    el.innerHTML=`<div class="text-[10px] font-bold text-slate-700">🎯 Paling Sering Main (Top 5)</div>
      <div class="space-y-1">${list.slice(0,5).map((r,i)=>{

  } catch(err) {

  }
}

function renderNilaiSiswa(c) {
  const sid=appState.currentUser.siswaId; 
  const mapelAll=(appState.db.mp||[]).map(mapelToObj);
  const rows=mapelAll.map(m=>{
    const nc=getKomponenByMapel(m.kode);
    const nlArr=(appState.db.nl||[]).find(n=>Number(n[FIELD.NILAI.SISWA_ID])===Number(sid)&&n[FIELD.NILAI.MAPEL_KODE]===m.kode);
    const rec=nlArr?nilaiToObj(nlArr,nc):{ scores:{} };

async function handleAddMenu(e) {
  e.preventDefault();
  
  const name = document.getElementById("menu-name").value.trim();
  const icon = document.getElementById("menu-icon").value.trim() || "fa-solid fa-link";
  const role = document.getElementById("menu-role").value;
  const source = document.getElementById("menu-source").value;
  const url = document.getElementById("menu-url")?.value.trim() || "";
  const table = document.getElementById("menu-table")?.value || "";
  const roles = role === "both" ? ["guru", "siswa"] : [role];
  
  const item = { 
    id: `custom_${Date.now()}`, 
    name, icon, roles, 
    isCustom: true, 
    dataSource: source 
  };
  if (source === "url" && url) item.url = url;
  else if (source === "supabase" && table) item.table = table;
  else item.dataSource = "static";
  
  // ─── Update state lokal ───
  appState.menus.push(item);
  appState.db.mn = appState.menus;   // ⭐ sync ke db juga
  saveLocal();
  
  showToast(`⏳ Menyimpan menu "${name}"...`, "info");
  closeModal();
  
  // ─── Kirim ke Supabase + JSONBin ───
  showLoading(true, "Menyimpan ke cloud...");
  try {
    const payload = { ...appState.db, mn: appState.menus };
    const hasil = await saveMasterDB(payload, {
      alsoJsonBin: !!getJsonBinCredential(),
      binId: getAppConfig()?.binId || null
    });
    showLoading(false);
    
    if (hasil.supabase) {
      setSyncBadge(false, "SUPABASE");
      showToast(`✓ Menu "${name}" tersimpan ke Supabase.`, "success");
    } else if (hasil.jsonbin) {
      setSyncBadge(false, "JSONBIN");
      showToast(`⚠️ Supabase gagal, menu "${name}" tersimpan ke JSONBin.`, "info");
    } else {
      setSyncBadge(true, "OFFLINE");
      showToast(`⚠️ Cloud gagal, menu "${name}" tersimpan lokal saja.`, "error");
    }
    
    renderApp();
  } catch(err) {
    showLoading(false);
    showToast("Gagal simpan menu: " + err.message, "error");
    renderApp();
  }
}

async function hapusMenuCustom(id) {
  const m = appState.menus.find(x => x.id === id);
  if (!m) return;
  if (!confirm(`Hapus menu "${m.name}"?`)) return;
  
  appState.menus = appState.menus.filter(x => x.id !== id);
  appState.db.mn = appState.menus;   // ⭐ sync ke db
  saveLocal();
  
  showLoading(true, "Menghapus dari cloud...");
  try {
    const payload = { ...appState.db, mn: appState.menus };
    const hasil = await saveMasterDB(payload, {
      alsoJsonBin: !!getJsonBinCredential(),
      binId: getAppConfig()?.binId || null
    });
    showLoading(false);
    
    if (hasil.supabase) {
      showToast(`✓ Menu "${m.name}" dihapus dari Supabase.`, "success");
      setSyncBadge(false, "SUPABASE");
    } else if (hasil.jsonbin) {
      showToast(`⚠️ Menu "${m.name}" dihapus dari JSONBin.`, "info");
    } else {
      showToast(`⚠️ Menu "${m.name}" hanya dihapus lokal.`, "error");
    }
  } catch(err) {
    showLoading(false);
    showToast("Gagal hapus: " + err.message, "error");
  }
  
  renderMainContent();
}

function saveSetupKredensial() {
  const url=document.getElementById("setup-sb-url").value.trim(); 
  const key=document.getElementById("setup-sb-key").value.trim();
  if (!url||!key) { showToast("Lengkapi URL & Key.","error"); return; }
  saveSupabaseConfig(url,key); 
  if (!appState.db.cfg) appState.db.cfg={}; 
  appState.db.cfg.sbUrl=url; 
  appState.db.cfg.sbKey=key;
  saveLocal(); 
  updateJsonBinDB().catch(()=>{}); 
  showToast("✓ Tersimpan.","success"); 
  renderMainContent();
}
async function cekKoneksiSupabase() {
  const r=document.getElementById("cek-koneksi-result"); 
  if (!r) return;
  r.classList.remove("hidden"); 
  r.className="text-xs p-3 rounded-xl bg-slate-100 text-slate-600"; 
  r.innerHTML=`<i class="fa-solid fa-spinner fa-spin"></i> Mengecek...`;
  const results=[]; 
  const sb=getSupabaseConfig();
  if (!sb) { 
    r.className="text-xs p-3 rounded-xl bg-red-50 text-red-700"; 
    r.innerHTML="❌ Isi URL & Key dulu."; 
    return; 
  }
  try { await sbRpc("get_public_tables"); results.push(`<div class="text-emerald-700">✓ get_public_tables</div>`); } 
  catch(e) { results.push(`<div class="text-red-700">✗ ${escapeHtml(e.message)}</div>`); }
  try { await sbRpc("exec_sql",{ query:"SELECT 1" }); results.push(`<div class="text-emerald-700">✓ exec_sql</div>`); } 
  catch(e) { results.push(`<div class="text-red-700">✗ ${escapeHtml(e.message)}</div>`); }
  try { 
    const payload = await sbGetMasterConfig("app_master"); 
    if (payload !== null) results.push(`<div class="text-emerald-700">✓ master_config (${Object.keys(payload).length} field)</div>`); 
    else results.push(`<div class="text-amber-700">⚠ master_config kosong (jalankan SQL Migrasi Fase 1)</div>`); 
  } 
  catch(e) { results.push(`<div class="text-red-700">✗ master_config: ${escapeHtml(e.message)}</div>`); }
  const ok=results.every(x=>x.includes("text-emerald-700"));
  r.className=`text-xs p-3 rounded-xl ${ok?'bg-emerald-50':'bg-amber-50'}`;
  r.innerHTML=`<div class="font-bold mb-2">${ok?'✅ Setup OK!':'⚠️ Sebagian belum aktif:'}</div><div class="space-y-1">${results.join("")}</div>`;
}

async function buatTabelDinamis() {
  const sb=getSupabaseConfig(); 
  if (!sb) { showToast("Supabase belum di-setup.","error"); return; }
  const tableName=document.getElementById("new-table-name").value.trim().toLowerCase();
  if (!/^[a-z][a-z0-9_]*$/.test(tableName)) { showToast("Nama tabel tidak valid.","error"); return; }
  const cols=window.__newTableCols.filter(c=>c.name.trim()).map(c=>({ name: c.name.trim().toLowerCase().replace(/[^a-z0-9_]/g,"_"), type: c.type }));
  if (!cols.length) { showToast("Minimal 1 kolom.","error"); return; }
  showLoading(true,"Membuat tabel...");
  try { 
    await sbRpc("create_dynamic_table",{ p_table_name: tableName, p_columns: cols }); 
    try { await sbRpc("exec_sql",{ query:"NOTIFY pgrst, 'reload schema'" }); } catch(e) {} 
    showLoading(false); 
    showToast(`✓ Tabel "${tableName}" dibuat!`,"success"); 
  }
  catch(err) { 
    showLoading(false); 
    showToast("Gagal: "+err.message,"error"); 
  }
}

/* ⭐ BARU v5: SQL EDITOR dengan 3 PRESET */
function renderSqlEditorTab(c) {
  c.innerHTML=`<div class="bg-white p-4 sm:p-5 rounded-2xl border shadow-sm space-y-4">
    <div class="flex flex-col sm:flex-row justify-between gap-2 items-start sm:items-center">
      <h3 class="font-bold text-sm"><i class="fa-solid fa-terminal text-indigo-600"></i> SQL Editor</h3>
      <div class="flex flex-wrap gap-1.5">
        <button onclick="sqlPreset('setup')" class="sql-preset-btn text-[10px] bg-indigo-600 text-white font-bold px-3 py-2 rounded-lg"><i class="fa-solid fa-rocket"></i> Isi Setup Awal</button>
        <button onclick="sqlPreset('migrasi')" class="sql-preset-btn text-[10px] bg-rose-600 text-white font-bold px-3 py-2 rounded-lg"><i class="fa-solid fa-arrow-right-arrow-left"></i> Isi Migrasi Fase 1</button>
        <button onclick="sqlPreset('cek')" class="sql-preset-btn text-[10px] bg-slate-600 text-white font-bold px-3 py-2 rounded-lg"><i class="fa-solid fa-magnifying-glass"></i> Cek Tabel</button>
      </div>
    </div>
    <textarea id="sql-editor" rows="14" class="w-full px-3 py-2.5 border rounded-lg text-[11px]" placeholder="-- Pilih preset di atas atau tulis SQL manual..."></textarea>
    <div class="p-3 bg-blue-50 border border-blue-200 rounded-xl text-[11px] text-blue-800">
      <i class="fa-solid fa-circle-info"></i> <b>Cara pakai:</b> Klik preset → <b>Copy SQL</b> → buka <b>Supabase SQL Editor</b> → Paste → Run.
    </div>
    <div class="flex flex-wrap justify-end gap-2 pt-3 border-t">
      <button onclick="document.getElementById('sql-editor').value=''" class="bg-slate-100 px-4 py-2.5 rounded-xl text-xs font-semibold">Bersihkan</button>
      <button onclick="copySqlEditor()" class="bg-amber-500 text-white px-4 py-2.5 rounded-xl text-xs font-bold"><i class="fa-solid fa-copy"></i> Copy SQL</button>
      <button onclick="runSqlFromEditor()" class="bg-emerald-600 text-white font-bold text-xs px-5 py-3 rounded-xl"><i class="fa-solid fa-bolt"></i> Run SQL (opsional)</button>
    </div>
    <div id="sql-editor-result" class="hidden text-xs p-3 rounded-xl font-mono"></div>
  </div>`;
}

function sqlPreset(jenis) {
  const ta = document.getElementById("sql-editor");
  if (!ta) return;
  
  if (jenis === "setup") {
    ta.value = SUPABASE_SETUP_SQL;
    showToast("✓ SQL Setup dimuat ke editor", "success");
  } else if (jenis === "migrasi") {
    ta.value = SUPABASE_SQL_MIGRASI_FASE1;
    showToast("✓ SQL Migrasi Fase 1 dimuat ke editor", "success");
  } else if (jenis === "cek") {
    ta.value = `-- Cek semua tabel di Supabase
SELECT table_name 
FROM information_schema.tables 
WHERE table_schema = 'public' 
  AND table_type = 'BASE TABLE'
ORDER BY table_name;

-- Cek isi master_config
SELECT id, kode_aplikasi, 
       jsonb_pretty(payload) AS payload_preview,
       updated_at
FROM public.master_config;
`;
    showToast("✓ SQL Cek Tabel dimuat", "success");
  }
  
  ta.scrollIntoView({ behavior: "smooth", block: "center" });
  ta.focus();
}

function copySqlEditor() {
  const ta = document.getElementById("sql-editor");
  if (!ta || !ta.value.trim()) {
    showToast("Editor kosong. Pilih preset dulu.", "error");
    return;
  }
  copyToClipboard(ta.value, "✓ SQL disalin ke clipboard!");
}

async function runSqlFromEditor() {
  const sb=getSupabaseConfig(); 
  const r=document.getElementById("sql-editor-result");
  if (!sb) { showToast("Supabase belum di-setup.","error"); return; }
  const sql=document.getElementById("sql-editor").value.trim(); 
  if (!sql) { showToast("SQL kosong.","error"); return; }
  if (/\b(DROP|DELETE|TRUNCATE)\b/i.test(sql)) { 
    showToast("⛔ Diblokir.","error"); 
    r.classList.remove("hidden"); 
    r.className="text-xs p-3 rounded-xl bg-red-50 text-red-700"; 
    r.textContent="⛔ DROP/DELETE/TRUNCATE diblokir."; 
    return; 
  }
  showLoading(true,"Menjalankan...");
  try { 
    await sbRpc("exec_sql",{ query: sql }); 
    showLoading(false); 
    r.classList.remove("hidden"); 
    r.className="text-xs p-3 rounded-xl bg-emerald-50 text-emerald-700"; 
    r.innerHTML="✓ Berhasil."; 
  }
  catch(err) { 
    showLoading(false); 
    r.classList.remove("hidden"); 
    r.className="text-xs p-3 rounded-xl bg-red-50 text-red-700"; 
    r.innerHTML=`✗ ${escapeHtml(err.message)}`; 
  }
}

async function renderKelolaDataTab(c) {
  c.innerHTML=`<div class="bg-white p-4 sm:p-5 rounded-2xl border shadow-sm space-y-4">
    <div class="flex flex-col sm:flex-row gap-2"><select id="kelola-table-select" onchange="switchKelolaTable(this.value)" class="flex-1 px-3 py-2.5 border rounded-lg text-xs font-mono"><option value="">-- Pilih tabel --</option></select><button onclick="refreshKelolaTables()" class="text-xs bg-slate-100 px-4 py-2.5 rounded-lg">Cari</button></div>
    <div id="kelola-content"></div>
  </div>`;
  await refreshKelolaTables();
}
async function refreshKelolaTables() {
  const sb=getSupabaseConfig(); 
  if (!sb) return;
  try { 
    const list=await sbRpc("get_public_tables"); 
    const sel=document.getElementById("kelola-table-select"); 
    if (!sel) return; 
    sel.innerHTML=`<option value="">-- Pilih tabel --</option>`+(list||[]).map(t=>`<option value="${t.table_name}">${t.table_name}</option>`).join(""); 
  } catch(e) {}
}
async function switchKelolaTable(name) {
  const content=document.getElementById("kelola-content"); 
  if (!name) { content.innerHTML=""; return; }
  content.innerHTML=`<div class="text-center py-4 text-slate-400 text-xs"><i class="fa-solid fa-spinner fa-spin"></i></div>`;
  try {
    const rows=await sbFetch(name,"?limit=100"); 
    const cols=rows.length?Object.keys(rows[0]):[];
    content.innerHTML=`<div class="text-xs bg-slate-50 p-2 rounded-lg mb-2">${rows.length} baris</div>
      <div class="table-scroll"><table class="w-full text-xs border-collapse">
        <thead><tr class="bg-slate-100 border-b">${cols.map(c=>`<th class="p-2 text-left whitespace-nowrap">${c}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(r=>`<tr class="border-b">${cols.map(cn=>`<td class="p-2 whitespace-nowrap">${typeof r[cn]==="object"?JSON.stringify(r[cn]).slice(0,30):r[cn]??"-"}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div>`;
  } catch(err) { 
    content.innerHTML=`<div class="text-red-500 text-xs p-4">Error: ${err.message}</div>`; 
  }
}

/* =========================================================
   AKTIVITAS SUPABASE
   ========================================================= */
async function refreshAktivitasSupabase() {
  const el = document.getElementById("aktivitas-supabase");
  if (!el) return;
  el.innerHTML = '<div class="text-center text-xs text-slate-400 py-4"><i class="fa-solid fa-spinner fa-spin"></i> Memuat...</div>';
  try {
    const list = await getMergedActivityAsync(15);
    if (!list.length) {
      el.innerHTML = '<div class="text-center text-xs text-slate-400 py-4">Belum ada aktivitas online</div>';
      return;
    }
    el.innerHTML = list.map(function(a) {
      const waktu = formatRelative(a.waktu);
      const roleWarna = a.role === "guru" ? "bg-indigo-100 text-indigo-700" : "bg-emerald-100 text-emerald-700";
      return '<div class="p-2 border rounded-lg bg-slate-50 flex gap-2 hover:bg-white transition">' +
        '<div class="w-8 h-8 rounded-lg ' + roleWarna + ' flex items-center justify-center shrink-0 text-xs"><i class="fa-solid fa-user"></i></div>' +
        '<div class="flex-1 min-w-0">' +
          '<div class="flex items-center gap-2 flex-wrap">' +
            '<span class="font-semibold text-slate-700 text-xs">' + (a.user || "-") + '</span>' +
            '<span class="text-[9px] bg-slate-200 text-slate-600 font-bold px-1.5 py-0.5 rounded uppercase">' + (a.role || "-") + '</span>' +
            '<span class="text-[10px] text-slate-400">' + waktu + '</span>' +
          '</div>' +
          '<div class="text-slate-500 text-[11px] break-words mt-0.5">' + (a.detail || "-") + '</div>' +
        '</div>' +
      '</div>';
    }).join("");
  } catch(err) {
    el.innerHTML = '<div class="text-red-500 text-center py-4 text-xs">Gagal memuat: ' + err.message + '</div>';
  }
}

/* =========================================================
   UTILITY
   ========================================================= */
function formatRelative(iso) {
  try { 
    const d=new Date(iso); 
    const diff=(Date.now()-d.getTime())/1000;
    if (diff<60) return "baru saja"; 
    if (diff<3600) return Math.floor(diff/60)+" mnt"; 
    if (diff<86400) return Math.floor(diff/3600)+" jam"; 
    return Math.floor(diff/86400)+" hr";
  } catch(e) { return "-"; }
}
