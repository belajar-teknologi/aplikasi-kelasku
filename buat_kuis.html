<script>
/* =========================================================
   BAGIAN 1/5 — KONSTANTA, STATE, HELPER, CONFIG, UPLOAD, INIT
   ========================================================= */

const STORAGE = {
  USER: "edusmart_user", MENUS: "edusmart_master_menus", DB: "edusmart_db",
  JSONBIN_KEY: "edusmart_jsonbin_api_key", JSONBIN_TYPE: "edusmart_jsonbin_key_type",
  APP_CONFIG: "edusmart_app_config", APP_CODE: "edusmart_application_code",
  CLOUD_NAME: "edusmart_cloudinary_cloud_name", CLOUD_PRESET: "edusmart_cloudinary_preset",
  SB_URL: "edusmart_supabase_url", SB_KEY: "edusmart_supabase_anon_key",
  GEMINI_KEY: "edusmart_gemini_api_key",
  MENU_ACTIVE: "edusmart_buat_kuis_active"
};

const SUPABASE_BUCKET = "edusmart-profile";

/* ✅ FIX: hanya model yang tersedia */
const GEMINI_MODELS = ["gemini-2.5-flash"];

const JENIS_SOAL = {
  PG:          { label: "Pilihan Ganda", kode: "PG",          icon: "fa-list-ul" },
  PGK:         { label: "PG Kompleks",   kode: "PGK",         icon: "fa-list-check" },
  MENJODOHKAN: { label: "Menjodohkan",   kode: "MENJODOHKAN", icon: "fa-arrows-left-right" },
  ISIAN:       { label: "Isian Singkat", kode: "ISIAN",       icon: "fa-keyboard" },
  URAIAN:      { label: "Uraian",        kode: "URAIAN",      icon: "fa-align-left" }
};

const HURUF_PILIHAN = ["A", "B", "C", "D"];

let appState = {
  currentUser: null,
  db: null,
  activeView: "paket"
};

let currentConfig = null;

/* ==== HELPER DASAR ==== */
function safeParse(s) { try { return JSON.parse(s); } catch(e) { return null; } }
const getLS = (k, d="") => localStorage.getItem(k) || d;
const setLS = (k, v) => localStorage.setItem(k, v);
const delLS = (k) => localStorage.removeItem(k);

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function nextId(arr) {
  if (!arr || !arr.length) return 1;
  let max = 0;
  arr.forEach(r => { const id = Number(r[0]) || 0; if (id > max) max = id; });
  return max + 1;
}
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function formatRelative(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return "baru saja";
  if (diff < 3600) return Math.floor(diff/60) + " mnt";
  if (diff < 86400) return Math.floor(diff/3600) + " jam";
  return Math.floor(diff/86400) + " hr";
}
function uid(prefix = "id") {
  return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
}

/* ==== UI HELPER ==== */
function showToast(msg, type = "info", durasi = 3500) {
  const c = document.getElementById("toast-container");
  if (!c) return;
  const t = document.createElement("div");
  const bg = type === "success" ? "bg-emerald-600" : type === "error" ? "bg-red-600" : type === "warning" ? "bg-amber-500" : "bg-indigo-600";
  t.className = `${bg} text-white text-xs px-4 py-3 rounded-xl shadow-xl flex items-center justify-between gap-3 transition-all transform translate-y-2 opacity-0 fade-in`;
  t.innerHTML = `<span>${esc(msg)}</span><button onclick="this.parentElement.remove()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark"></i></button>`;
  c.appendChild(t);
  setTimeout(() => t.classList.remove("translate-y-2","opacity-0"), 10);
  setTimeout(() => t.remove(), durasi);
}
function showLoading(on, text = "Memuat...") {
  let el = document.getElementById("edusmart-loading");
  if (!el) {
    el = document.createElement("div");
    el.id = "edusmart-loading";
    el.className = "fixed inset-0 z-[90] bg-slate-900/30 backdrop-blur-sm items-center justify-center hidden";
    el.innerHTML = `<div class="bg-white rounded-2xl shadow-xl px-5 py-4 flex items-center gap-3"><i class="fa-solid fa-spinner fa-spin text-indigo-600"></i><span id="edusmart-loading-text" class="text-sm font-semibold text-slate-700">Memuat...</span></div>`;
    document.body.appendChild(el);
  }
  el.classList.toggle("hidden", !on);
  el.classList.toggle("flex", !!on);
  const txt = document.getElementById("edusmart-loading-text");
  if (txt) txt.textContent = text;
}
function openModal() {
  document.getElementById("modal-backdrop").classList.remove("hidden");
  document.getElementById("modal-container").classList.remove("hidden");
}
function closeModal() {
  document.getElementById("modal-backdrop").classList.add("hidden");
  document.getElementById("modal-container").classList.add("hidden");
}
function toggleSidebar() { document.getElementById("sidebar").classList.toggle("-translate-x-full"); }
function setSyncBadge(on, text) {
  const el = document.getElementById("sync-badge");
  if (!el) return;
  if (on) {
    el.className = "px-3 py-1 rounded-full text-xs font-semibold bg-amber-400 text-slate-900 flex items-center gap-1.5 shadow-sm";
    el.innerHTML = `<span class="w-2 h-2 rounded-full bg-slate-900 animate-pulse"></span><span>${esc(text || "BELUM DISIMPAN")}</span>`;
  } else {
    el.className = "px-3 py-1 rounded-full text-xs font-semibold bg-emerald-400 text-slate-900 flex items-center gap-1.5 shadow-sm";
    el.innerHTML = `<span class="w-2 h-2 rounded-full bg-slate-900"></span><span>${esc(text || "SIAP")}</span>`;
  }
}
function copyToClipboard(text, successMsg = "Tersalin!") {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => showToast(successMsg, "success"));
  } else {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.left = "-9999px";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); showToast(successMsg, "success"); }
    catch(e) { showToast("Gagal copy", "error"); }
    document.body.removeChild(ta);
  }
}

/* ==== KONFIGURASI ==== */
function getJsonBinCredential() {
  const key = String(getLS(STORAGE.JSONBIN_KEY)).trim();
  const type = String(getLS(STORAGE.JSONBIN_TYPE, "master")).toLowerCase();
  return key ? { key, type: type === "access" ? "access" : "master" } : null;
}
function getAppConfig() { return safeParse(getLS(STORAGE.APP_CONFIG)); }
function getSupabaseConfig() {
  const url = String(getLS(STORAGE.SB_URL)).trim();
  const key = String(getLS(STORAGE.SB_KEY)).trim();
  return url && key ? { url, key } : null;
}
function getGeminiKey() { return String(getLS(STORAGE.GEMINI_KEY)).trim(); }
function getCloudinaryConfig() {
  const name = String(getLS(STORAGE.CLOUD_NAME)).trim();
  const preset = String(getLS(STORAGE.CLOUD_PRESET)).trim();
  return name && preset ? { name, preset } : null;
}

/* ==== SUPABASE HELPERS ==== */
function sbHeaders(extra = {}) {
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  return { "apikey": sb.key, "Authorization": `Bearer ${sb.key}`, "Content-Type": "application/json", ...extra };
}
async function sbFetch(table, query = "") {
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  const res = await fetch(`${sb.url}/rest/v1/${table}${query}`, { headers: sbHeaders() });
  if (!res.ok) throw new Error(`Fetch ${table} gagal (${res.status}).`);
  return res.json();
}
async function sbInsert(table, rows) {
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  const res = await fetch(`${sb.url}/rest/v1/${table}`, {
    method: "POST",
    headers: sbHeaders({ "Prefer": "return=representation" }),
    body: JSON.stringify(Array.isArray(rows) ? rows : [rows])
  });
  if (!res.ok) { const t = await res.text(); throw new Error(`Insert ${table} gagal: ${t.slice(0,200)}`); }
  return res.json();
}
async function sbUpsert(table, rows) {
  if (!rows.length) return true;
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  const res = await fetch(`${sb.url}/rest/v1/${table}`, {
    method: "POST",
    headers: sbHeaders({ "Prefer": "resolution=merge-duplicates,return=minimal" }),
    body: JSON.stringify(rows)
  });
  if (!res.ok) { const t = await res.text(); throw new Error(`Upsert ${table} gagal: ${t.slice(0,200)}`); }
  return true;
}
async function sbDelete(table, query = "") {
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  const res = await fetch(`${sb.url}/rest/v1/${table}${query}`, {
    method: "DELETE", headers: sbHeaders()
  });
  if (!res.ok) { const t = await res.text(); throw new Error(`Delete ${table} gagal: ${t.slice(0,200)}`); }
  return true;
}
async function sbRpc(namaRpc, params = {}) {
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  const res = await fetch(`${sb.url}/rest/v1/rpc/${namaRpc}`, {
    method: "POST", headers: sbHeaders(), body: JSON.stringify(params)
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e) { data = text; }
  if (!res.ok) throw new Error(data?.message || data?.error || `HTTP ${res.status}`);
  return data;
}

/* ==== UPLOAD FILE (Cloudinary → Supabase → IndexedDB) ==== */
const IDB_NAME = "edusmart_files";
const IDB_STORE = "files";
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, { keyPath: "key" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSave(key, file) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    const store = tx.objectStore(IDB_STORE);
    const reader = new FileReader();
    reader.onload = () => {
      store.put({ key, dataUrl: reader.result, name: file.name, type: file.type });
      resolve();
    };
    reader.readAsDataURL(file);
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const req = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function uploadFile(file, folder = "edusmart/soal") {
  if (file.size > 5 * 1024 * 1024) throw new Error("Ukuran file maksimal 5 MB.");
  const cloud = getCloudinaryConfig();
  if (cloud) {
    try {
      const form = new FormData();
      form.append("file", file);
      form.append("upload_preset", cloud.preset);
      if (folder) form.append("folder", folder);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${cloud.name}/image/upload`, { method: "POST", body: form });
      const r = await res.json();
      if (res.ok && r?.secure_url) return { url: r.secure_url, publicId: r.public_id, provider: "cloudinary" };
      throw new Error(r?.error?.message || `HTTP ${res.status}`);
    } catch (err) { console.warn("Cloudinary gagal, fallback:", err); }
  }
  const sb = getSupabaseConfig();
  if (sb) {
    try {
      const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
      const fileName = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
      const res = await fetch(`${sb.url}/storage/v1/object/${SUPABASE_BUCKET}/${fileName}`, {
        method: "POST",
        headers: { "apikey": sb.key, "Authorization": `Bearer ${sb.key}`, "Content-Type": file.type, "x-upsert": "true" },
        body: file
      });
      if (res.ok) return { url: `${sb.url}/storage/v1/object/public/${SUPABASE_BUCKET}/${fileName}`, publicId: fileName, provider: "supabase" };
    } catch (err) { console.warn("Supabase gagal, fallback:", err); }
  }
  const key = `file_${Date.now()}_${Math.random().toString(36).slice(2)}`;
  await idbSave(key, file);
  const rec = await idbGet(key);
  return { url: rec.dataUrl, publicId: key, provider: "indexeddb" };
}

/* ==== JSONBIN HELPERS ==== */
function getJsonBinHeaders(cred, withCT = false) {
  const h = {};
  if (withCT) h["Content-Type"] = "application/json";
  if (cred?.key) h[cred.type === "access" ? "X-Access-Key" : "X-Master-Key"] = cred.key;
  return h;
}
async function loadJsonBinDB(binId, cred) {
  const c = cred || getJsonBinCredential();
  if (!c) throw new Error("API Key JSONBin belum diset.");
  if (!binId) throw new Error("Bin ID JSONBin belum ada.");
  const h = {};
  h[c.type === "access" ? "X-Access-Key" : "X-Master-Key"] = c.key;
  const res = await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(binId)}/latest?meta=false`, { cache: "no-store", headers: h });
  const text = await res.text();
  let data = null;
  try { data = JSON.parse(text); } catch(e) {}
  if (!res.ok) throw new Error(data?.message || `HTTP ${res.status}`);
  return data?.record && typeof data.record === "object" ? data.record : data;
}
async function updateJsonBinDB(db, binId, cred) {
  const c = cred || getJsonBinCredential();
  const cfg = getAppConfig();
  const bid = binId || cfg?.binId;
  if (!bid || !c) throw new Error("Bin ID atau API Key belum ada.");
  const res = await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(bid)}`, {
    method: "PUT",
    headers: getJsonBinHeaders(c, true),
    body: JSON.stringify(db)
  });
  if (!res.ok) { const t = await res.text(); throw new Error(`Update JSONBin gagal: ${t.slice(0,200)}`); }
  setLS("edusmart_last_sync", new Date().toISOString());
  return true;
}

/* ==== LINK MATERI (km = kuis materi, disimpan di JSONBin) ==== */
function kmGetLinks(paketId) {
  const km = appState.db?.km || [];
  const rec = km.find(r => String(r[1]) === String(paketId));
  return rec ? (Array.isArray(rec[2]) ? rec[2].filter(Boolean) : []) : [];
}
function kmSetAllLinks(paketId, links) {
  if (!appState.db) appState.db = {};
  appState.db.km = appState.db.km || [];
  let rec = appState.db.km.find(r => String(r[1]) === String(paketId));
  if (!rec) {
    const newId = nextId(appState.db.km);
    rec = [newId, paketId, []];
    appState.db.km.push(rec);
  }
  rec[2] = (links || []).map(u => u ? String(u).trim() : null).filter(Boolean);
  return rec[2];
}
function kmDeleteRecord(paketId) {
  if (!appState.db?.km) return;
  appState.db.km = appState.db.km.filter(r => String(r[1]) !== String(paketId));
}

/* ==== GEMINI HELPER ==== */
async function fetchGeminiWithRetry(prompt, systemPrompt, apiKey, schema = null) {
  let lastError = null;
  for (const model of GEMINI_MODELS) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
    const payload = {
      contents: [{ parts: [{ text: prompt }] }],
      systemInstruction: systemPrompt ? { parts: [{ text: systemPrompt }] } : undefined
    };
    if (schema) {
      payload.generationConfig = { responseMimeType: "application/json", responseSchema: schema };
    }
    try {
      const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      if (res.ok) return await res.json();
      if (res.status === 401) throw new Error("API Key tidak valid (401).");
      if (res.status === 403) throw new Error("API Key diblokir (403).");
      if (res.status === 404) { lastError = new Error(`Model ${model} tidak didukung.`); continue; }
      lastError = new Error(`HTTP ${res.status}`);
    } catch (err) { lastError = err; }
  }
  throw lastError || new Error("Gagal menghubungi Gemini.");
}

/* ==== AUTH CHECK ==== */
function checkAuth() {
  const user = safeParse(getLS(STORAGE.USER));
  if (!user || user.role !== "guru") {
    return { ok: false, msg: "Anda belum login sebagai guru. Silakan login di Dashboard dulu." };
  }
  appState.currentUser = user;
  const cfg = getAppConfig();
  if (!cfg?.binId) return { ok: false, msg: "Bin ID JSONBin belum ada. Set di Pengaturan index.html dulu." };
  const cred = getJsonBinCredential();
  if (!cred) return { ok: false, msg: "API Key JSONBin belum diset. Buka Pengaturan di index.html." };
  const sb = getSupabaseConfig();
  if (!sb) return { ok: false, msg: "Supabase belum dikonfigurasi. Buka Pengaturan di index.html." };
  currentConfig = cfg;
  return { ok: true };
}

/* ==== ROUTER ==== */
function renderMainContent() {
  const c = document.getElementById("main-view-container");
  if (!c) return;
  const v = appState.activeView;
  const router = { paket: renderPaketList, soal: renderBankSoalList };
  if (router[v]) router[v](c);
  else renderPaketList(c);
}

function renderSidebarNav() {
  const nav = document.getElementById("sidebar-nav-list");
  if (!nav) return;
  const menu = [
    { id: "paket", name: "Paket Soal", icon: "fa-solid fa-layer-group" },
    { id: "soal", name: "Bank Soal", icon: "fa-solid fa-database" }
  ];
  nav.innerHTML = menu.map(m => {
    const active = appState.activeView === m.id;
    return `<button onclick="switchView('${m.id}')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold flex items-center gap-2.5 transition ${active ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}">
      <i class="${m.icon} text-sm w-5 text-center"></i> <span>${m.name}</span>
    </button>`;
  }).join("") + `
  <div class="pt-3 mt-3 border-t border-slate-100">
    <a href="./index.html" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold flex items-center gap-2.5 transition text-slate-600 hover:bg-slate-100">
      <i class="fa-solid fa-house text-sm w-5 text-center"></i> <span>Dashboard</span>
    </a>
    <a href="./kuis.html" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold flex items-center gap-2.5 transition text-slate-600 hover:bg-slate-100">
      <i class="fa-solid fa-laptop-code text-sm w-5 text-center"></i> <span>Kuis Siswa</span>
    </a>
  </div>`;
}
function switchView(id) {
  appState.activeView = id;
  setLS(STORAGE.MENU_ACTIVE, id);
  renderSidebarNav();
  renderMainContent();
}

function updateHeaderUI() {
  const user = appState.currentUser;
  if (!user) return;
  const info = document.getElementById("header-user-info");
  const nameEl = document.getElementById("header-user-name");
  const photoEl = document.getElementById("header-user-photo");
  const iconEl = document.getElementById("header-user-icon");
  if (info) { info.classList.remove("hidden"); info.classList.add("flex"); }
  if (nameEl) nameEl.textContent = user.name;
  const fotoGuru = appState.db?.a?.fg || "";
  if (fotoGuru && photoEl && iconEl) {
    photoEl.referrerPolicy = "no-referrer";
    photoEl.classList.remove("hidden");
    iconEl.classList.add("hidden");
    photoEl.src = fotoGuru;
  }
  const brandTitle = document.getElementById("header-brand-title");
  if (brandTitle) brandTitle.textContent = "Buat Kuis · " + (appState.db?.a?.ns || "EduSmart LMS");
  const brandLogo = document.getElementById("header-brand-logo");
  const brandIcon = document.getElementById("header-brand-icon");
  const logoSekolah = appState.db?.a?.ls || "";
  if (logoSekolah && brandLogo && brandIcon) {
    brandLogo.referrerPolicy = "no-referrer";
    brandLogo.classList.remove("hidden");
    brandIcon.classList.add("hidden");
    brandLogo.src = logoSekolah;
  }
}

/* ==== INIT ==== */
document.addEventListener("DOMContentLoaded", async () => {
  const auth = checkAuth();
  if (!auth.ok) {
    document.getElementById("main-view-container").innerHTML = `
      <div class="max-w-md mx-auto my-16 bg-white p-8 rounded-2xl shadow-xl border text-center fade-in">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center text-3xl mb-4"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h2 class="text-lg font-bold text-slate-800 mb-2">Perlu Setup</h2>
        <p class="text-xs text-slate-500 mb-4">${esc(auth.msg)}</p>
        <a href="./index.html" class="inline-block px-5 py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-bold">Buka Dashboard</a>
      </div>`;
    return;
  }

  try {
    showLoading(true, "Menarik data dari JSONBin...");
    const cred = getJsonBinCredential();
    const db = await loadJsonBinDB(currentConfig.binId, cred);
    appState.db = db;
    if (!appState.db.km) appState.db.km = [];
    showLoading(false);
  } catch (err) {
    showLoading(false);
    document.getElementById("main-view-container").innerHTML = `
      <div class="max-w-md mx-auto my-16 bg-white p-8 rounded-2xl shadow-xl border text-center fade-in">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-red-100 text-red-600 flex items-center justify-center text-3xl mb-4"><i class="fa-solid fa-circle-xmark"></i></div>
        <h2 class="text-lg font-bold text-slate-800 mb-2">Gagal Muat Data</h2>
        <p class="text-xs text-slate-500 mb-4">${esc(err.message)}</p>
        <button onclick="location.reload()" class="inline-block px-5 py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-bold">Coba Lagi</button>
      </div>`;
    return;
  }

  const savedView = getLS(STORAGE.MENU_ACTIVE, "paket");
  appState.activeView = savedView;
  updateHeaderUI();
  renderSidebarNav();
  renderMainContent();
});

function refreshPaket() { renderPaketList(document.getElementById("main-view-container")); }

/* ---------- MODAL PAKET 2 TAB ---------- */
function showBuatPaketModal(editId = null, defaultTab = "info") {
  __editPaketId = editId;
  __activeTabPaket = defaultTab;
  __tempLinks = editId ? [...kmGetLinks(editId)] : [""];
  if (!__tempLinks.length) __tempLinks = [""];
  __tempSoalAI = [];
  __tempSoalAIMeta = { mapel: "", kelas: "", topik: "" };

  let paket = { nama: "", mapel_kode: "", kelas: "", durasi_menit: 30, aktif: true, acak_soal: false, acak_pilihan: false };
  if (editId) {
    const p = __paketCache.find(x => x.id === editId);
    if (p) paket = p;
  }
  window.__paketTemp = paket;

  renderPaketModal();
  openModal();
}

function renderPaketModal() {
  const paket = window.__paketTemp || {};
  const mapelAll = (appState.db?.mp || []).map(m => ({ kode: m[1], nama: m[2], kkm: m[3] }));
  const kelasList = [...new Set((appState.db?.sw || []).map(s => s[4]).filter(Boolean))].sort();
  const tab = __activeTabPaket;
  const totalAI = __tempSoalAI.length;

  const mb = document.getElementById("modal-body");
  mb.innerHTML = `
  <div class="space-y-4 text-xs">
    <div class="border-b pb-3">
      <h3 class="font-bold text-base"><i class="fa-solid fa-layer-group text-indigo-600"></i> ${__editPaketId ? 'Edit' : 'Buat'} Paket Soal</h3>
      <p class="text-slate-500 mt-1">Isi info paket & opsional generate soal AI sekaligus.</p>
    </div>

    <div class="flex gap-1 border-b">
      <button onclick="switchTabPaket('info')" class="px-4 py-2 text-xs font-bold rounded-t-lg ${tab === 'info' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
        <i class="fa-solid fa-circle-info"></i> Info Paket
      </button>
      <button onclick="switchTabPaket('ai')" class="px-4 py-2 text-xs font-bold rounded-t-lg ${tab === 'ai' ? 'bg-fuchsia-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Generate AI
        ${totalAI > 0 ? `<span class="ml-1 bg-white/30 px-1.5 py-0.5 rounded-full text-[9px]">${totalAI}</span>` : ""}
      </button>
    </div>

    <div id="paket-tab-content"></div>

    <div class="flex justify-between items-center gap-2 pt-3 border-t">
      <div class="text-[10px] text-slate-500" id="paket-status-hint">
        ${totalAI > 0 ? `<i class="fa-solid fa-info-circle text-fuchsia-600"></i> ${totalAI} soal AI siap disimpan bersama paket.` : ""}
      </div>
      <div class="flex gap-2">
        <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl">Batal</button>
        <button onclick="simpanPaket()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl"><i class="fa-solid fa-save"></i> Simpan Paket${totalAI > 0 ? ` + ${totalAI} Soal` : ""}</button>
      </div>
    </div>
  </div>`;

  if (tab === "info") renderPaketInfoTab(mapelAll, kelasList);
  else renderPaketAITab(mapelAll, kelasList);
}

function switchTabPaket(tab) {
  if (__activeTabPaket === "info") savePaketInfoToTemp();
  __activeTabPaket = tab;
  renderPaketModal();
}

function savePaketInfoToTemp() {
  const p = window.__paketTemp || {};
  const el = document.getElementById("pk-nama");
  if (!el) return;
  p.nama = el.value.trim();
  p.mapel_kode = document.getElementById("pk-mapel").value;
  p.kelas = document.getElementById("pk-kelas").value;
  p.durasi_menit = Number(document.getElementById("pk-durasi").value) || 30;
  p.aktif = document.getElementById("pk-aktif").value === "1";
  p.acak_soal = document.getElementById("pk-acak-soal")?.checked || false;
  p.acak_pilihan = document.getElementById("pk-acak-pilihan")?.checked || false;
  window.__paketTemp = p;
}

function renderLinksList() {
  const el = document.getElementById("pk-links-list");
  if (!el) return;
  el.innerHTML = __tempLinks.map((link, i) => `
    <div class="flex items-center gap-2">
      <span class="text-[10px] text-slate-400 w-6">${i + 1}.</span>
      <input type="url" value="${esc(link || '')}" onchange="updateLinkMateri(${i}, this.value)" placeholder="https://..." class="materi-input flex-1 px-2 py-1.5 border border-slate-200 bg-slate-50 rounded-lg font-mono text-[11px] outline-none">
      <button type="button" onclick="hapusLinkMateri(${i})" class="text-red-500 hover:text-red-700 p-1.5" title="Hapus"><i class="fa-solid fa-xmark"></i></button>
    </div>
  `).join("");
}
function tambahLinkMateri() { __tempLinks.push(""); renderLinksList(); }
function updateLinkMateri(i, v) { __tempLinks[i] = v; }
function hapusLinkMateri(i) {
  if (__tempLinks.length <= 1) __tempLinks[0] = "";
  else __tempLinks.splice(i, 1);
  renderLinksList();
}

/* ---------- SIMPAN PAKET + SOAL AI ---------- */
async function simpanPaket() {
  if (__activeTabPaket === "info") savePaketInfoToTemp();
  else {
    __tempSoalAIMeta = {
      mapel: document.getElementById("ai-mapel")?.value || __tempSoalAIMeta.mapel,
      kelas: document.getElementById("ai-kelas")?.value || __tempSoalAIMeta.kelas,
      topik: document.getElementById("ai-topik")?.value || __tempSoalAIMeta.topik
    };
  }
  const p = window.__paketTemp || {};
  if (!p.nama) { showToast("Nama paket wajib (isi di Tab Info Paket).", "error"); return; }
  if (!p.mapel_kode) { showToast("Mata pelajaran wajib.", "error"); return; }
  if (!p.kelas) { showToast("Kelas wajib.", "error"); return; }

  showLoading(true, "Menyimpan paket...");
  try {
    let paketId = __editPaketId;
    const payloadPaket = {
      nama: p.nama,
      mapel_kode: p.mapel_kode,
      kelas: p.kelas,
      durasi_menit: p.durasi_menit || 30,
      aktif: !!p.aktif,
      acak_soal: !!p.acak_soal,
      acak_pilihan: !!p.acak_pilihan,
      link_materi: []
    };

    if (paketId) {
      await sbUpsert("paket_soal", [{ id: paketId, ...payloadPaket }]);
    } else {
      const res = await sbInsert("paket_soal", [payloadPaket]);
      paketId = res?.[0]?.id;
      if (!paketId) throw new Error("Gagal dapat ID paket baru.");
    }

    const cred = getJsonBinCredential();
    const freshDb = await loadJsonBinDB(currentConfig.binId, cred);
    appState.db = freshDb;
    if (!appState.db.km) appState.db.km = [];
    kmSetAllLinks(paketId, __tempLinks.filter(Boolean));
    await updateJsonBinDB(appState.db, currentConfig.binId, cred);

    let insertedSoal = 0;
    if (__tempSoalAI.length > 0) {
      showLoading(true, `Menyimpan ${__tempSoalAI.length} soal AI...`);
      const finalSoal = __tempSoalAI.map(s => ({
        ...s,
        mapel_kode: s.mapel_kode || p.mapel_kode,
        kelas: s.kelas || p.kelas,
        topik: s.topik || __tempSoalAIMeta.topik || ""
      }));
      const inserted = await sbInsert("bank_soal", finalSoal);
      insertedSoal = inserted?.length || 0;

      if (inserted?.length) {
        const startUrutan = await sbFetch("paket_soal_items", `?paket_id=eq.${paketId}`).then(r => r.length);
        const items = inserted.map((soal, idx) => ({
          paket_id: paketId, soal_id: soal.id, urutan: startUrutan + idx
        }));
        await sbInsert("paket_soal_items", items);
      }
    }

    showLoading(false);
    showToast(`✓ Paket "${p.nama}" disimpan${insertedSoal ? ` + ${insertedSoal} soal AI` : ""}.`, "success");
    setSyncBadge(false);
    closeModal();
    refreshPaket();
  } catch (err) {
    showLoading(false);
    showToast("Gagal simpan: " + err.message, "error");
  }
}

async function toggleAktifPaket(id, aktifSekarang) {
  try {
    showLoading(true, "Update status...");
    await sbUpsert("paket_soal", [{ id, aktif: !aktifSekarang }]);
    showLoading(false);
    showToast(aktifSekarang ? "Paket dinonaktifkan." : "Paket diaktifkan.", "success");
    refreshPaket();
  } catch (err) { showLoading(false); showToast("Gagal: " + err.message, "error"); }
}

async function duplikatPaket(id) {
  if (!confirm("Duplikat paket ini?")) return;
  try {
    showLoading(true, "Duplikat paket...");
    const asal = (await sbFetch("paket_soal", `?id=eq.${id}&limit=1`))?.[0];
    if (!asal) throw new Error("Paket asal tidak ditemukan.");
    const namaBaru = (asal.nama || "Paket") + " (Copy)";
    const res = await sbInsert("paket_soal", [{
      nama: namaBaru, mapel_kode: asal.mapel_kode, kelas: asal.kelas,
      durasi_menit: asal.durasi_menit, aktif: false,
      acak_soal: asal.acak_soal, acak_pilihan: asal.acak_pilihan, link_materi: []
    }]);
    const newId = res?.[0]?.id;
    if (!newId) throw new Error("Gagal buat paket baru.");

    const items = await sbFetch("paket_soal_items", `?paket_id=eq.${id}`);
    if (items.length) {
      await sbInsert("paket_soal_items", items.map(it => ({
        paket_id: newId, soal_id: it.soal_id, urutan: it.urutan
      })));
    }

    const links = kmGetLinks(id);
    if (links.length) {
      const cred = getJsonBinCredential();
      const freshDb = await loadJsonBinDB(currentConfig.binId, cred);
      appState.db = freshDb;
      if (!appState.db.km) appState.db.km = [];
      kmSetAllLinks(newId, links);
      await updateJsonBinDB(appState.db, currentConfig.binId, cred);
    }

    showLoading(false);
    showToast("✓ Paket diduplikat.", "success");
    refreshPaket();
  } catch (err) { showLoading(false); showToast("Gagal: " + err.message, "error"); }
}

async function hapusPaket(id) {
  if (!confirm("Hapus paket ini? Soal di bank soal TIDAK dihapus.")) return;
  try {
    showLoading(true, "Menghapus...");
    await sbDelete("paket_soal", `?id=eq.${id}`);
    kmDeleteRecord(id);
    const cred = getJsonBinCredential();
    await updateJsonDBAfterLoad(cred);
    showLoading(false);
    showToast("Paket dihapus.", "success");
    refreshPaket();
  } catch (err) { showLoading(false); showToast("Gagal: " + err.message, "error"); }
}
async function updateJsonDBAfterLoad(cred) {
  try {
    const freshDb = await loadJsonBinDB(currentConfig.binId, cred);
    freshDb.km = appState.db.km;
    appState.db = freshDb;
    await updateJsonBinDB(appState.db, currentConfig.binId, cred);
  } catch(e) { console.warn(e); }
}

/* =========================================================
   UPLOAD MEDIA SOAL
   ========================================================= */
async function uploadMediaSoal(e) {
  const f = e.target.files[0];
  if (!f) return;
  showLoading(true, "Mengunggah gambar...");
  try {
    const r = await uploadFile(f, "edusmart/soal");
    __tempSoal.media = { url: r.url, publicId: r.publicId, provider: r.provider };
    showLoading(false);
    showToast("✓ Gambar terunggah.", "success");
    syncFormKeTemp();
    renderSoalModal();
  } catch (err) {
    showLoading(false);
    showToast("Gagal upload: " + err.message, "error");
  }
}
function hapusMediaSoal() {
  if (!confirm("Hapus gambar ini?")) return;
  __tempSoal.media = null;
  syncFormKeTemp();
  renderSoalModal();
}

/* =========================================================
   SIMPAN SOAL → bank_soal
   ========================================================= */
async function simpanSoal() {
  const pertanyaan = document.getElementById("so-pertanyaan").value.trim();
  if (!pertanyaan) { showToast("Pertanyaan wajib.", "error"); return; }
  __tempSoal.pertanyaan = pertanyaan;
  __tempSoal.mapel_kode = document.getElementById("so-mapel").value;
  __tempSoal.kelas = document.getElementById("so-kelas").value;
  __tempSoal.topik = document.getElementById("so-topik").value.trim();
  __tempSoal.pembahasan = document.getElementById("so-pembahasan").value.trim();

  const j = __tempSoal.jenis;

  if (j === "PG") {
    if (!__tempSoal.jawaban.kunci) { showToast("Pilih kunci jawaban — klik huruf A/B/C/D.", "error"); return; }
    if (!__tempSoal.pilihan.A || !__tempSoal.pilihan.B || !__tempSoal.pilihan.C || !__tempSoal.pilihan.D) {
      showToast("Isi semua pilihan A-D.", "error"); return;
    }
  } else if (j === "PGK") {
    if (!Array.isArray(__tempSoal.jawaban.kunci) || __tempSoal.jawaban.kunci.length < 2) {
      showToast("PGK butuh minimal 2 kunci.", "error"); return;
    }
    if (!__tempSoal.pilihan.A || !__tempSoal.pilihan.B || !__tempSoal.pilihan.C || !__tempSoal.pilihan.D) {
      showToast("Isi semua pilihan A-D.", "error"); return;
    }
  } else if (j === "ISIAN") {
    const arr = (Array.isArray(__tempSoal.jawaban.kunci) ? __tempSoal.jawaban.kunci : [__tempSoal.jawaban.kunci]).map(x => String(x||"").trim()).filter(Boolean);
    if (!arr.length) { showToast("Isi minimal 1 alternatif jawaban.", "error"); return; }
    __tempSoal.jawaban.kunci = arr;
  } else if (j === "MENJODOHKAN") {
    if (__tempSoal.kiri.length < 3) { showToast("Minimal 3 pasangan.", "error"); return; }
    if (__tempSoal.kiri.some(k => !String(k||"").trim()) || __tempSoal.kanan.some(k => !String(k||"").trim())) {
      showToast("Lengkapi semua pasangan kiri & kanan.", "error"); return;
    }
  } else if (j === "URAIAN") {
    if (!String(__tempSoal.jawaban.kunci || "").trim()) { showToast("Isi kunci jawaban uraian.", "error"); return; }
  }

  const payload = {
    jenis: j,
    mapel_kode: __tempSoal.mapel_kode,
    kelas: __tempSoal.kelas,
    topik: __tempSoal.topik,
    pertanyaan: __tempSoal.pertanyaan,
    tingkat: __tempSoal.tingkat,
    pembahasan: __tempSoal.pembahasan,
    pilihan: null,
    jawaban: {},
    media: __tempSoal.media,
    skor: 1
  };
  if (j === "PG" || j === "PGK") {
    payload.pilihan = {
      A: __tempSoal.pilihan.A, B: __tempSoal.pilihan.B,
      C: __tempSoal.pilihan.C, D: __tempSoal.pilihan.D
    };
    payload.jawaban = { kunci: __tempSoal.jawaban.kunci };
  } else if (j === "ISIAN") {
    payload.jawaban = { kunci: __tempSoal.jawaban.kunci };
  } else if (j === "MENJODOHKAN") {
    payload.pilihan = { kiri: __tempSoal.kiri, kanan: __tempSoal.kanan };
    payload.jawaban = { pasangan: __tempSoal.pasangan };
  } else if (j === "URAIAN") {
    payload.jawaban = { kunci: __tempSoal.jawaban.kunci };
  }

  showLoading(true, "Menyimpan soal...");
  try {
    let newSoalId = null;
    if (__editSoalId) {
      await sbUpsert("bank_soal", [{ id: __editSoalId, ...payload, updated_at: new Date().toISOString() }]);
      newSoalId = __editSoalId;
    } else {
      const res = await sbInsert("bank_soal", [payload]);
      newSoalId = res?.[0]?.id;
    }
    showLoading(false);
    showToast("✓ Soal tersimpan.", "success");
    closeModal();

    if (window.__paketIdTambahan && newSoalId) {
      try {
        await toggleSoalDiPaket(window.__paketIdTambahan, newSoalId, true);
        showToast("✓ Soal juga ditambahkan ke paket.", "success");
      } catch(e) { console.warn("Gagal tambah ke paket:", e); }
      window.__paketIdTambahan = null;
      if (typeof kelolaSoalPaket === "function" && window.__paketIdSaatIni) {
        return kelolaSoalPaket(window.__paketIdSaatIni);
      }
    }
    refreshBankSoal();
  } catch (err) {
    showLoading(false);
    showToast("Gagal simpan soal: " + err.message, "error");
  }
}

  document.querySelectorAll(".kp-item").forEach(el => {

async function toggleSoalDiPaket(paketId, soalId, checked) {
  try {
    if (checked) {
      const exist = await sbFetch("paket_soal_items", `?paket_id=eq.${paketId}&soal_id=eq.${soalId}&limit=1`);

    showToast("Gagal update: " + err.message, "error");

/* =========================================================
   4D. ⭐ NORMALISASI SOAL AI — VERSI TOLERAN (INTI PERBAIKAN)
   Menerima berbagai variasi format dari Gemini:
   - key bahasa Indonesia / Inggris
   - pilihan object A-D / array / dibungkus
   - kunci huruf / teks jawaban / array
   - PGK dengan 1 kunci tetap diterima
   - MENJODOHKAN dari berbagai struktur
   ========================================================= */
function normalisasiSoalAI(raw) {
  if (!raw || typeof raw !== "object") return null;

  // --- Normalisasi jenis ---
  let jenisRaw = String(raw.jenis || raw.type || "").toUpperCase().trim();
  if (jenisRaw.includes("PILIHAN") && jenisRaw.includes("GANDA") && !jenisRaw.includes("KOMPLEKS")) jenisRaw = "PG";
  if (jenisRaw === "PG" || jenisRaw === "MULTIPLE CHOICE") jenisRaw = "PG";
  if (jenisRaw.includes("KOMPLEKS") || jenisRaw === "PGK" || jenisRaw === "MULTIPLE ANSWER") jenisRaw = "PGK";
  if (jenisRaw.includes("JODOH") || jenisRaw.includes("MATCH") || jenisRaw === "PAIRING") jenisRaw = "MENJODOHKAN";
  if (jenisRaw.includes("ISIAN") || jenisRaw.includes("SHORT") || jenisRaw === "FILL") jenisRaw = "ISIAN";
  if (jenisRaw.includes("URAIAN") || jenisRaw.includes("ESSAY") || jenisRaw === "ESAI") jenisRaw = "URAIAN";

  // --- Pertanyaan ---
  const pertanyaan = String(raw.pertanyaan || raw.question || raw.soal || raw.text || "").trim();
  if (!pertanyaan) return null;

  const pembahasan = String(raw.pembahasan || raw.explanation || raw.penjelasan || "").trim();
  const out = {
    jenis: jenisRaw,
    pertanyaan,
    pembahasan,
    tingkat: "sedang",
    skor: 1,
    pilihan: null,
    jawaban: {},
    media: null
  };

  // --- Helper: normalisasi pilihan jadi {A,B,C,D} ---
  const normPilihan = (src) => {
    if (!src) return null;
    // Kalau dibungkus {pilihan: {...}}
    if (src.pilihan && typeof src.pilihan === "object" && !Array.isArray(src.pilihan)) src = src.pilihan;
    // Kalau array → konversi ke A,B,C,D
    if (Array.isArray(src)) {
      const m = {};
      src.forEach((t, i) => { if (i < 4) m[HURUF_PILIHAN[i]] = String(t ?? "").trim(); });
      return Object.keys(m).length ? m : null;
    }
    if (typeof src !== "object") return null;
    const keys = Object.keys(src);
    const m = {};
    // Prioritas: key A-D
    keys.forEach(k => {
      const K = String(k).toUpperCase().trim();
      if (/^[A-D]$/.test(K)) m[K] = String(src[k] ?? "").trim();
    });
    // Fallback: pakai urutan kunci
    if (!Object.keys(m).length) {
      HURUF_PILIHAN.forEach((h, i) => { if (keys[i] !== undefined) m[h] = String(src[keys[i]] ?? "").trim(); });
    }
    return Object.keys(m).length ? m : null;
  };

  // --- Ambil rawKunci dari berbagai bentuk ---
  let rawKunci = raw.jawaban ?? raw.answer ?? raw.kunci ?? raw.correct ?? null;
  if (rawKunci && typeof rawKunci === "object" && !Array.isArray(rawKunci)) {
    rawKunci = rawKunci.kunci ?? rawKunci.answer ?? rawKunci.jawaban ?? rawKunci.correct ?? null;
  }

  // --- Helper: cari huruf dari teks pilihan ---
  const findHurufDariTeks = (teks, pilihan) => {
    if (!pilihan) return null;
    const t = String(teks).trim().toUpperCase();
    for (const h of HURUF_PILIHAN) {
      if (pilihan[h] && pilihan[h].toUpperCase() === t) return h;
    }
    return null;
  };

  if (jenisRaw === "PG") {
    out.pilihan = normPilihan(raw.pilihan || raw.options || raw.opsi || raw.choices);
    if (!out.pilihan || !out.pilihan.A || !out.pilihan.B) return null;
    let k = String(rawKunci || "").toUpperCase().trim();
    if (!/^[A-D]$/.test(k)) k = findHurufDariTeks(rawKunci, out.pilihan);
    if (!k || !out.pilihan[k]) return null;
    out.jawaban = { kunci: k };

  } else if (jenisRaw === "PGK") {
    out.pilihan = normPilihan(raw.pilihan || raw.options || raw.opsi || raw.choices);
    if (!out.pilihan || !out.pilihan.A || !out.pilihan.B) return null;
    let arr = Array.isArray(rawKunci) ? rawKunci : (rawKunci ? [rawKunci] : []);
    let clean = arr.map(x => {
      let s = String(x ?? "").toUpperCase().trim();
      if (/^[A-D]$/.test(s)) return s;
      return findHurufDariTeks(x, out.pilihan);
    }).filter(Boolean);
    clean = [...new Set(clean)].sort();
    // ✅ TOLERAN: kalau cuma 1 kunci, terima juga (AI kadang salah jenis)
    if (clean.length === 0) return null;
    out.jawaban = { kunci: clean };

  } else if (jenisRaw === "ISIAN") {
    const arr = Array.isArray(rawKunci) ? rawKunci : [rawKunci];
    const clean = arr.map(x => String(x ?? "").trim()).filter(Boolean);
    if (!clean.length) return null;
    out.jawaban = { kunci: clean };

  } else if (jenisRaw === "MENJODOHKAN") {
    let pil = raw.pilihan || raw.pairs || {};
    if (pil.pilihan && typeof pil.pilihan === "object" && !Array.isArray(pil.pilihan)) pil = pil.pilihan;
    const kiri = pil.kiri || raw.kiri || raw.left || raw.soal || raw.items || [];
    const kanan = pil.kanan || raw.kanan || raw.right || raw.jawaban || [];
    if (!Array.isArray(kiri) || !Array.isArray(kanan)) return null;
    if (kiri.length < 2 || kiri.length !== kanan.length) return null;
    const cKiri = kiri.map(x => String(x ?? "").trim());
    const cKanan = kanan.map(x => String(x ?? "").trim());
    if (cKiri.some(x => !x) || cKanan.some(x => !x)) return null;
    out.pilihan = { kiri: cKiri, kanan: cKanan };
    // Coba baca pasangan dari AI; kalau tidak ada, default [i, i]
    let pasangan = null;
    if (Array.isArray(raw.jawaban?.pasangan)) pasangan = raw.jawaban.pasangan;
    else if (Array.isArray(raw.pasangan)) pasangan = raw.pasangan;
    if (!pasangan) pasangan = cKiri.map((_, i) => [i, i]);
    out.jawaban = { pasangan };

  } else if (jenisRaw === "URAIAN") {
    const k = String(rawKunci || "").trim();
    if (!k) return null;
    out.jawaban = { kunci: k };

  } else {
    return null;
  }

  return out;
}

ATURAN WAJIB:
1. Setiap soal WAJIB punya key: "jenis", "pertanyaan", "jawaban" (pembahasan & pilihan opsional sesuai jenis).
2. PG & PGK: "pilihan" WAJIB object dengan key "A","B","C","D" (huruf besar).
3. PG: "jawaban.kunci" = 1 huruf saja, contoh: "A"
4. PGK: "jawaban.kunci" = ARRAY minimal 2 huruf, contoh: ["A","C"]
5. MENJODOHKAN: "pilihan.kiri" & "pilihan.kanan" WAJIB array string dengan panjang SAMA, minimal 3.
6. MENJODOHKAN: "jawaban.pasangan" = [[0,0],[1,1],[2,2],...]
7. ISIAN: "pilihan" = null, "jawaban.kunci" = array string alternatif, contoh: ["jawaban1","jawaban2"]
8. URAIAN: "pilihan" = null, "jawaban.kunci" = string panjang
9. Jangan pakai teks di luar JSON. Jangan bungkus dengan markdown.

Jawab HANYA array JSON.`;

  const schema = {
    type: "ARRAY",
    items: {
      type: "OBJECT",
      properties: {
        jenis: { type: "STRING" },
        pertanyaan: { type: "STRING" },
        pilihan: { type: "OBJECT" },
        jawaban: { type: "OBJECT" },
        pembahasan: { type: "STRING" }
      },
      required: ["jenis", "pertanyaan", "jawaban"]
    }
  };

  try {
    const result = await fetchGeminiWithRetry(userPrompt, systemPrompt, apiKey, schema);
    const jsonText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!jsonText) throw new Error("Respons kosong dari Gemini.");

    // Parse JSON (tahan markdown code block)
    let soalArr;
    try { soalArr = JSON.parse(jsonText); }
    catch (e) {
      const m = jsonText.match(/\[[\s\S]*\]/);
      if (m) {
        try { soalArr = JSON.parse(m[0]); }
        catch(e2) { throw new Error("Format JSON tidak valid."); }
      }
      else throw new Error("Format JSON tidak valid.");
    }
    if (!Array.isArray(soalArr) || !soalArr.length) throw new Error("AI tidak mengembalikan array.");

    // Normalisasi
    const normalized = soalArr.map(normalisasiSoalAI).filter(Boolean);
    const skipped = soalArr.length - normalized.length;

    if (!normalized.length) {
      throw new Error("Semua soal formatnya tidak valid. Coba generate ulang atau ubah topik.");
    }

    __tempSoalAI = [...__tempSoalAI, ...normalized];

    if (loader) loader.classList.add("hidden");
    if (btn) btn.disabled = false;

    if (skipped > 0) showToast(`✓ ${normalized.length} soal valid, ${skipped} dilewati.`, "info");
    else showToast(`✓ Berhasil generate ${normalized.length} soal.`, "success");

    renderPaketModal();

  } catch (err) {
    if (loader) loader.classList.add("hidden");
    if (out) {
      out.classList.remove("hidden");
      out.innerHTML = `<div class="text-red-600 text-xs whitespace-pre-wrap"><b>Gagal:</b> ${esc(err.message)}</div>`;
    }
    if (btn) btn.disabled = false;
    showToast("Gagal generate: " + err.message, "error", 6000);
  }
}

async function exportPaketJSON(id) {
  try {
    showLoading(true, "Menyiapkan export...");
    const paket = (await sbFetch("paket_soal", `?id=eq.${id}&limit=1`))?.[0];
    const items = await sbFetch("paket_soal_items", `?paket_id=eq.${id}`);
    const ids = items.map(it => it.soal_id).filter(Boolean);
    const soals = ids.length ? await sbFetch("bank_soal", `?id=in.(${ids.map(i => `"${i}"`).join(",")})`) : [];
    const links = kmGetLinks(id);
    const data = {
      paket,
      soal: soals,
      links,
      exportedAt: new Date().toISOString(),
      exportedBy: appState.currentUser?.name || "guru"
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `paket_${(paket?.nama || "quiz").replace(/[^a-z0-9]/gi, "_")}_${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showLoading(false);
    showToast("✓ Paket diekspor.", "success");
  } catch (err) {
    showLoading(false);
    showToast("Gagal export: " + err.message, "error");
  }
}

/* ---------------------------------------------------------
   5D. KEYBOARD SHORTCUT
   --------------------------------------------------------- */
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
    e.preventDefault();
    const saveBtn = document.querySelector('#modal-body button[onclick*="simpan"], #modal-body button[onclick*="Simpan"]');
    if (saveBtn) saveBtn.click();
  }
  if (e.key === "Escape") {
    const modal = document.getElementById("modal-container");
    if (modal && !modal.classList.contains("hidden")) closeModal();
  }
  if (e.altKey && (e.key === "1" || e.key === "2")) {
    const modal = document.getElementById("modal-container");
    if (modal && !modal.classList.contains("hidden")) {
      const tabInfo = document.querySelector('#modal-body button[onclick*="switchTabPaket(\'info\')"]');
      const tabAI = document.querySelector('#modal-body button[onclick*="switchTabPaket(\'ai\')"]');
      if (e.key === "1" && tabInfo) { e.preventDefault(); tabInfo.click(); }
      if (e.key === "2" && tabAI) { e.preventDefault(); tabAI.click(); }
    }
  }
});
