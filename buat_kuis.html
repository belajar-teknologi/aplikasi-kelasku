<script>
/* =========================================================
   KONSTANTA GLOBAL
   ========================================================= */
const STORAGE = {
  USER: "edusmart_user", MENUS: "edusmart_master_menus", DB: "edusmart_db",
  JSONBIN_KEY: "edusmart_jsonbin_api_key", JSONBIN_TYPE: "edusmart_jsonbin_key_type",
  APP_CONFIG: "edusmart_app_config", APP_CODE: "edusmart_application_code",
  CLOUD_NAME: "edusmart_cloudinary_cloud_name", CLOUD_PRESET: "edusmart_cloudinary_preset",
  SB_URL: "edusmart_supabase_url", SB_KEY: "edusmart_supabase_anon_key",
  GEMINI_KEY: "edusmart_gemini_api_key",
  MENU_ACTIVE: "edusmart_buat_kuis_active"
};

const GEMINI_MODELS = [
  "gemini-3-flash-preview", "gemini-3.6-flash", "gemini-3.5-flash",
  "gemini-3.5-flash-lite", "gemini-3.0-flash", "gemini-flash-latest"
];

const JENIS_SOAL = {
  PG: { label: "Pilihan Ganda", kode: "PG", icon: "fa-list-ul" },
  PGK: { label: "PG Kompleks", kode: "PGK", icon: "fa-list-check" },
  MENJODOHKAN: { label: "Menjodohkan", kode: "MENJODOHKAN", icon: "fa-arrows-left-right" },
  ISIAN: { label: "Isian Singkat", kode: "ISIAN", icon: "fa-keyboard" },
  URAIAN: { label: "Uraian", kode: "URAIAN", icon: "fa-align-left" }
};

const PENGEMBANG = { nama: "ABURRIZAL HAMDANI LUBIS", email: "lubisbima@gmail.com" };

/* =========================================================
   STATE
   ========================================================= */
let appState = {
  currentUser: null,
  db: null,
  activeView: "paket"
};

let currentConfig = null;

/* =========================================================
   HELPER DASAR
   ========================================================= */
function safeParse(s) { try { return JSON.parse(s); } catch(e) { return null; } }
const getLS = (k, d="") => localStorage.getItem(k) || d;
const setLS = (k, v) => localStorage.setItem(k, v);
const delLS = (k) => localStorage.removeItem(k);

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function nextId(arr) {
  if (!arr || !arr.length) return 1;
  let max = 0;
  arr.forEach(r => { const id = Number(r[0]) || 0; if (id > max) max = id; });
  return max + 1;
}
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function formatRelative(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return "baru saja";
  if (diff < 3600) return Math.floor(diff/60) + " mnt";
  if (diff < 86400) return Math.floor(diff/3600) + " jam";
  return Math.floor(diff/86400) + " hr";
}
function uid(prefix = "id") {
  return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
}

/* =========================================================
   UI HELPER
   ========================================================= */
function showToast(msg, type = "info") {
  const c = document.getElementById("toast-container");
  const t = document.createElement("div");
  const bg = type === "success" ? "bg-emerald-600" : type === "error" ? "bg-red-600" : "bg-indigo-600";
  t.className = `${bg} text-white text-xs px-4 py-3 rounded-xl shadow-xl flex items-center justify-between gap-3 transition-all transform translate-y-2 opacity-0 fade-in`;
  t.innerHTML = `<span>${esc(msg)}</span><button onclick="this.parentElement.remove()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark"></i></button>`;
  c.appendChild(t);
  setTimeout(() => t.classList.remove("translate-y-2","opacity-0"), 10);
  setTimeout(() => t.remove(), 4500);
}
function showLoading(on, text = "Memuat...") {
  let el = document.getElementById("edusmart-loading");
  if (!el) {
    el = document.createElement("div");
    el.id = "edusmart-loading";
    el.className = "fixed inset-0 z-[90] bg-slate-900/30 backdrop-blur-sm items-center justify-center hidden";
    el.innerHTML = `<div class="bg-white rounded-2xl shadow-xl px-5 py-4 flex items-center gap-3"><i class="fa-solid fa-spinner fa-spin text-indigo-600"></i><span id="edusmart-loading-text" class="text-sm font-semibold text-slate-700">Memuat...</span></div>`;
    document.body.appendChild(el);
  }
  el.classList.toggle("hidden", !on);
  el.classList.toggle("flex", !!on);
  const txt = document.getElementById("edusmart-loading-text");
  if (txt) txt.textContent = text;
}
function openModal() {
  document.getElementById("modal-backdrop").classList.remove("hidden");
  document.getElementById("modal-container").classList.remove("hidden");
}
function closeModal() {

  document.getElementById("modal-container").classList.add("hidden");
}
function toggleSidebar() { document.getElementById("sidebar").classList.toggle("-translate-x-full"); }

/* =========================================================
   KONFIGURASI
   ========================================================= */
function getJsonBinCredential() {
  const key = String(getLS(STORAGE.JSONBIN_KEY)).trim();
  const type = String(getLS(STORAGE.JSONBIN_TYPE, "master")).toLowerCase();
  return key ? { key, type: type === "access" ? "access" : "master" } : null;
}
function getAppConfig() { return safeParse(getLS(STORAGE.APP_CONFIG)); }
function getSupabaseConfig() {
  const url = String(getLS(STORAGE.SB_URL)).trim();
  const key = String(getLS(STORAGE.SB_KEY)).trim();
  return url && key ? { url, key } : null;
}
function getGeminiKey() {
  return String(getLS(STORAGE.GEMINI_KEY)).trim();
}

/* =========================================================
   SUPABASE HELPERS
   ========================================================= */
function sbHeaders(extra = {}) {
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi. Buka index.html → Pengaturan → Supabase.");
  return { "apikey": sb.key, "Authorization": `Bearer ${sb.key}`, "Content-Type": "application/json", ...extra };
}
async function sbFetch(table, query = "") {
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  const res = await fetch(`${sb.url}/rest/v1/${table}${query}`, { headers: sbHeaders() });
  if (!res.ok) throw new Error(`Fetch ${table} gagal (${res.status}).`);
  return res.json();
}
async function sbInsert(table, rows) {
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  const res = await fetch(`${sb.url}/rest/v1/${table}`, {
    method: "POST",
    headers: sbHeaders({ "Prefer": "return=representation" }),
    body: JSON.stringify(Array.isArray(rows) ? rows : [rows])
  });
  if (!res.ok) { const t = await res.text(); throw new Error(`Insert ${table} gagal: ${t.slice(0,200)}`); }
  return res.json();
}
async function sbUpsert(table, rows) {
  if (!rows.length) return true;
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  const res = await fetch(`${sb.url}/rest/v1/${table}`, {
    method: "POST",
    headers: sbHeaders({ "Prefer": "resolution=merge-duplicates,return=minimal" }),
    body: JSON.stringify(rows)
  });
  if (!res.ok) { const t = await res.text(); throw new Error(`Upsert ${table} gagal: ${t.slice(0,200)}`); }
  return true;
}
async function sbDelete(table, query = "") {
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  const res = await fetch(`${sb.url}/rest/v1/${table}${query}`, {
    method: "DELETE",
    headers: sbHeaders()
  });
  if (!res.ok) { const t = await res.text(); throw new Error(`Delete ${table} gagal: ${t.slice(0,200)}`); }
  return true;
}
async function sbRpc(namaRpc, params = {}) {
  const sb = getSupabaseConfig();
  if (!sb) throw new Error("Supabase belum dikonfigurasi.");
  const res = await fetch(`${sb.url}/rest/v1/rpc/${namaRpc}`, {
    method: "POST", headers: sbHeaders(), body: JSON.stringify(params)
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e) { data = text; }
  if (!res.ok) throw new Error(data?.message || data?.error || `HTTP ${res.status}`);
  return data;
}

/* =========================================================
   JSONBIN HELPERS
   ========================================================= */
function getJsonBinHeaders(cred, withCT = false) {
  const h = {};
  if (withCT) h["Content-Type"] = "application/json";
  if (cred?.key) h[cred.type === "access" ? "X-Access-Key" : "X-Master-Key"] = cred.key;
  return h;
}
async function loadJsonBinDB(binId, cred) {
  const c = cred || getJsonBinCredential();
  if (!c) throw new Error("API Key JSONBin belum diset.");
  if (!binId) throw new Error("Bin ID JSONBin belum ada.");
  const h = {};
  if (c) h[c.type === "access" ? "X-Access-Key" : "X-Master-Key"] = c.key;
  const res = await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(binId)}/latest?meta=false`, { cache: "no-store", headers: h });
  const text = await res.text();
  let data = null;
  try { data = JSON.parse(text); } catch(e) {}
  if (!res.ok) throw new Error(data?.message || `HTTP ${res.status}`);
  return data?.record && typeof data.record === "object" ? data.record : data;
}
async function updateJsonBinDB(db, binId, cred) {
  const c = cred || getJsonBinCredential();
  const cfg = getAppConfig();
  const bid = binId || cfg?.binId;
  if (!bid || !c) throw new Error("Bin ID atau API Key belum ada.");
  const res = await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(bid)}`, {
    method: "PUT",
    headers: getJsonBinHeaders(c, true),
    body: JSON.stringify(db)
  });
  if (!res.ok) { const t = await res.text(); throw new Error(`Update JSONBin gagal: ${t.slice(0,200)}`); }
  setLS("edusmart_last_sync", new Date().toISOString());
  return true;
}

/* =========================================================
   HELPER LINK MATERI (km = kuis materi)
   =========================================================
   Struktur: km = [ [id, paketId, [link1, link2, link3, ...]], ... ]
   ========================================================= */
function kmGetLinks(paketId) {
  const km = appState.db?.km || [];
  const rec = km.find(r => String(r[1]) === String(paketId));
  return rec ? (Array.isArray(rec[2]) ? rec[2] : []) : [];
}
function kmSetLink(paketId, index, url) {
  if (!appState.db) appState.db = {};
  appState.db.km = appState.db.km || [];
  let rec = appState.db.km.find(r => String(r[1]) === String(paketId));
  if (!rec) {
    const newId = nextId(appState.db.km);
    rec = [newId, paketId, []];
    appState.db.km.push(rec);
  }
  while (rec[2].length <= index) rec[2].push(null);
  rec[2][index] = url ? String(url).trim() : null;
  return true;
}
function kmDeleteLink(paketId, index) {
  const km = appState.db?.km || [];
  const rec = km.find(r => String(r[1]) === String(paketId));
  if (rec && rec[2][index] !== undefined) rec[2][index] = null;
}
function kmClearAllLinks(paketId) {
  const km = appState.db?.km || [];
  const rec = km.find(r => String(r[1]) === String(paketId));
  if (rec) rec[2] = [];
}
function kmDeleteRecord(paketId) {
  if (!appState.db?.km) return;
  appState.db.km = appState.db.km.filter(r => String(r[1]) !== String(paketId));
}
function kmSetAllLinks(paketId, links) {
  if (!appState.db) appState.db = {};
  appState.db.km = appState.db.km || [];
  let rec = appState.db.km.find(r => String(r[1]) === String(paketId));
  if (!rec) {
    const newId = nextId(appState.db.km);
    rec = [newId, paketId, []];
    appState.db.km.push(rec);
  }
  rec[2] = (links || []).map(u => u ? String(u).trim() : null);
  while (rec[2].length && rec[2][rec[2].length - 1] === null) rec[2].pop();
  return rec[2];
}

/* =========================================================
   GEMINI HELPER (multi-model fallback)
   ========================================================= */
async function fetchGeminiWithRetry(prompt, systemPrompt, apiKey, schema = null) {
  let lastError = null;
  for (const model of GEMINI_MODELS) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
    const payload = {
      contents: [{ parts: [{ text: prompt }] }],
      systemInstruction: systemPrompt ? { parts: [{ text: systemPrompt }] } : undefined
    };
    if (schema) {
      payload.generationConfig = {
        responseMimeType: "application/json",
        responseSchema: schema
      };
    }
    try {
      const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      if (res.ok) return await res.json();
      if (res.status === 401) throw new Error("API Key tidak valid (401).");
      if (res.status === 403) throw new Error("API Key diblokir (403).");
      if (res.status === 404) { lastError = new Error(`Model ${model} tidak didukung.`); continue; }
      lastError = new Error(`HTTP ${res.status}`);
    } catch (err) { lastError = err; }
  }
  throw lastError || new Error("Gagal menghubungi Gemini.");
}

/* =========================================================
   AUTO-LOGIN & CEK CONFIG
   ========================================================= */
function checkAuth() {
  const user = safeParse(getLS(STORAGE.USER));
  if (!user || user.role !== "guru") {
    return { ok: false, msg: "Anda belum login sebagai guru. Silakan login di Dashboard dulu." };
  }
  appState.currentUser = user;
  const cfg = getAppConfig();
  if (!cfg?.binId) {
    return { ok: false, msg: "Bin ID JSONBin belum ada. Set di Pengaturan index.html dulu." };
  }
  const cred = getJsonBinCredential();
  if (!cred) {
    return { ok: false, msg: "API Key JSONBin belum diset. Buka Pengaturan di index.html." };
  }
  const sb = getSupabaseConfig();
  if (!sb) {
    return { ok: false, msg: "Supabase belum dikonfigurasi. Buka Pengaturan di index.html." };
  }
  currentConfig = cfg;
  return { ok: true };
}

   ROUTER SEDERHANA
   ========================================================= */

  if (!c) return;
  const v = appState.activeView;
  const router = {
    paket: renderPaketList,
    soal: renderBankSoalList,
    ai: renderAIGenerator
  };
  if (router[v]) router[v](c);
  else renderPaketList(c);
}

  const nav = document.getElementById("sidebar-nav-list");
  if (!nav) return;
  const menu = [
    { id: "paket", name: "Paket Soal", icon: "fa-solid fa-layer-group" },
    { id: "soal", name: "Bank Soal", icon: "fa-solid fa-database" },

    </button>`;

      <i class="fa-solid fa-laptop-code text-sm w-5 text-center"></i> <span>Kuis Siswa</span>

function switchView(id) {
  appState.activeView = id;
  setLS(STORAGE.MENU_ACTIVE, id);

  if (info) info.classList.add("flex");
  if (nameEl) nameEl.textContent = user.name;
  const fotoGuru = appState.db?.a?.fg || "";
  if (fotoGuru && photoEl && iconEl) {
    photoEl.referrerPolicy = "no-referrer";
    photoEl.classList.remove("hidden");
    iconEl.classList.add("hidden");
    photoEl.src = fotoGuru;
  }
  const brandTitle = document.getElementById("header-brand-title");
  if (brandTitle) brandTitle.textContent = "Buat Kuis · " + (appState.db?.a?.ns || "EduSmart LMS");
  const brandLogo = document.getElementById("header-brand-logo");

/* =========================================================
   SIMPAN PAKET → SUPABASE + JSONBIN
   ========================================================= */
async function simpanPaket() {
  const nama = document.getElementById("pk-nama").value.trim();
  const mapel = document.getElementById("pk-mapel").value;
  const kelas = document.getElementById("pk-kelas").value;
  const durasi = Number(document.getElementById("pk-durasi").value) || 30;
  const aktif = document.getElementById("pk-aktif").value === "1";

  if (!nama) { showToast("Nama paket wajib.", "error"); return; }
  if (!mapel) { showToast("Mata pelajaran wajib.", "error"); return; }
  if (!kelas) { showToast("Kelas wajib.", "error"); return; }

  showLoading(true, "Menyimpan paket...");
  try {
    let paketId = __editPaketId;

    if (paketId) {
      // Update
      await sbUpsert("paket_soal", [{
        id: paketId, nama, mapel_kode: mapel, kelas,
        durasi_menit: durasi, aktif,
        link_materi: []
      }]);
    } else {
      // Insert
      const res = await sbInsert("paket_soal", [{
        nama, mapel_kode: mapel, kelas,
        durasi_menit: durasi, aktif,
        acak_soal: false, acak_pilihan: false,
        link_materi: []
      }]);
      paketId = res?.[0]?.id;
      if (!paketId) throw new Error("Gagal dapat ID paket baru.");
    }

    // Simpan link ke JSONBin
    const cred = getJsonBinCredential();
    const freshDb = await loadJsonBinDB(currentConfig.binId, cred);
    appState.db = freshDb;
    if (!appState.db.km) appState.db.km = [];
    kmSetAllLinks(paketId, __tempLinks.filter(Boolean));
    await updateJsonBinDB(appState.db, currentConfig.binId, cred);

    showLoading(false);
    showToast(`✓ Paket "${nama}" disimpan.`, "success");
    setSyncBadge(false);
    closeModal();
    refreshPaket();
  } catch (err) {
    showLoading(false);
    showToast("Gagal simpan: " + err.message, "error");
  }
}

/* =========================================================
   TOGGLE AKTIF / DUPLIKAT / HAPUS
   ========================================================= */
async function toggleAktifPaket(id, aktifSekarang) {
  try {
    showLoading(true, "Update status...");
    await sbUpsert("paket_soal", [{ id, aktif: !aktifSekarang }]);
    showLoading(false);
    showToast(aktifSekarang ? "Paket dinonaktifkan." : "Paket diaktifkan.", "success");
    refreshPaket();
  } catch (err) { showLoading(false); showToast("Gagal: " + err.message, "error"); }
}
async function duplikatPaket(id) {
  if (!confirm("Duplikat paket ini?")) return;
  try {
    showLoading(true, "Duplikat paket...");
    const asal = (await sbFetch("paket_soal", `?id=eq.${id}&limit=1`))?.[0];
    if (!asal) throw new Error("Paket asal tidak ditemukan.");
    const namaBaru = (asal.nama || "Paket") + " (Copy)";
    const res = await sbInsert("paket_soal", [{
      nama: namaBaru, mapel_kode: asal.mapel_kode, kelas: asal.kelas,
      durasi_menit: asal.durasi_menit, aktif: false,
      acak_soal: asal.acak_soal, acak_pilihan: asal.acak_pilihan,
      link_materi: []
    }]);
    const newId = res?.[0]?.id;
    if (!newId) throw new Error("Gagal buat paket baru.");

    // Copy relasi soal dari paket asal (jika ada)
    const items = await sbFetch("paket_soal_items", `?paket_id=eq.${id}`);
    if (items.length) {
      await sbInsert("paket_soal_items", items.map(it => ({
        paket_id: newId, soal_id: it.soal_id, urutan: it.urutan
      })));
    }

    // Copy link materi dari JSONBin
    const links = kmGetLinks(id);
    if (links.length) {
      const cred = getJsonBinCredential();
      const freshDb = await loadJsonBinDB(currentConfig.binId, cred);
      appState.db = freshDb;
      if (!appState.db.km) appState.db.km = [];
      kmSetAllLinks(newId, links);
      await updateJsonBinDB(appState.db, currentConfig.binId, cred);
    }

    showLoading(false);
    showToast("✓ Paket diduplikat.", "success");
    refreshPaket();
  } catch (err) { showLoading(false); showToast("Gagal: " + err.message, "error"); }
}
async function hapusPaket(id) {
  if (!confirm("Hapus paket ini? Soal-soal di dalamnya TIDAK dihapus dari bank soal.")) return;
  try {
    showLoading(true, "Menghapus...");
    await sbDelete("paket_soal", `?id=eq.${id}`);
    kmDeleteRecord(id);
    const cred = getJsonBinCredential();
    await updateJsonBinDB(appState.db, currentConfig.binId, cred);
    showLoading(false);
    showToast("Paket dihapus.", "success");
    refreshPaket();
  } catch (err) { showLoading(false); showToast("Gagal: " + err.message, "error"); }
}

function renderSoalCard(s) {
  const j = JENIS_SOAL[s.jenis] || JENIS_SOAL.PG;
  const pilihan = s.pilihan || {};
  const jawaban = s.jawaban || {};
  let jawabanText = "";
  if (s.jenis === "PG") {
    jawabanText = `Jawaban: <b>${esc(jawaban.kunci || "-")}</b>`;
  } else if (s.jenis === "PGK") {
    jawabanText = `Jawaban: <b>${(jawaban.kunci || []).join(", ")}</b>`;
  } else if (s.jenis === "ISIAN") {
    jawabanText = `Jawaban: <b>${(jawaban.kunci || []).join(" / ")}</b>`;
  } else if (s.jenis === "MENJODOHKAN") {
    jawabanText = `Pasangan: <b>${(jawaban.pasangan || []).length} pasang</b>`;
  } else if (s.jenis === "URAIAN") {
    jawabanText = `Kunci: <b>${esc((jawaban.kunci || "").slice(0, 80))}...</b>`;
  }

  return `
  <div class="bg-white p-4 rounded-xl border hover:border-indigo-300 transition">
    <div class="flex items-start gap-3">
      <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-700 flex items-center justify-center text-sm shrink-0">
        <i class="fa-solid ${j.icon}"></i>
      </div>

function toggleKunciPGK(k, checked) {
  let arr = __tempSoal.jawaban.kunci || [];
  if (checked) { if (!arr.includes(k)) arr.push(k); }
  else { arr = arr.filter(x => x !== k); }
  __tempSoal.jawaban.kunci = arr.sort();
}
function updateIsian(i, v) {
  const arr = Array.isArray(__tempSoal.jawaban.kunci) ? __tempSoal.jawaban.kunci : [__tempSoal.jawaban.kunci || ""];
  arr[i] = v;
  __tempSoal.jawaban.kunci = arr;
}
function tambahIsian() {
  const arr = Array.isArray(__tempSoal.jawaban.kunci) ? __tempSoal.jawaban.kunci : [__tempSoal.jawaban.kunci || ""];
  arr.push("");
  __tempSoal.jawaban.kunci = arr;
  renderJenisForm();
}
function hapusIsian(i) {
  let arr = Array.isArray(__tempSoal.jawaban.kunci) ? __tempSoal.jawaban.kunci : [__tempSoal.jawaban.kunci || ""];
  if (arr.length <= 1) arr = [""];
  else arr.splice(i, 1);
  __tempSoal.jawaban.kunci = arr;
  renderJenisForm();
}
function renderJodohList() {
  const el = document.getElementById("jodoh-list");
  if (!el) return;
  const s = __tempSoal;
  if (!s.kiri.length) s.kiri = [""];
  if (!s.kanan.length) s.kanan = [""];
  if (!s.pasangan.length) s.pasangan = [];
  el.innerHTML = s.kiri.map((kiri, i) => `

      <span class="text-[10px] text-slate-400 w-5">${i+1}.</span>
      <input type="text" value="${esc(kiri)}" onchange="__tempSoal.kiri[${i}]=this.value" placeholder="Kiri (soal)" class="flex-1 px-2 py-1.5 border rounded-lg">
      <i class="fa-solid fa-arrow-right text-slate-400"></i>
      <input type="text" value="${esc(s.kanan[i] || '')}" onchange="__tempSoal.kanan[${i}]=this.value" placeholder="Kanan (jawaban)" class="flex-1 px-2 py-1.5 border rounded-lg">
      <button type="button" onclick="hapusJodoh(${i})" class="text-red-500 p-1"><i class="fa-solid fa-xmark"></i></button>
    </div>
  `).join("");
  // Sinkronkan pasangan (index ke index)
  s.pasangan = s.kiri.map((_, i) => [i, i]);
}
function tambahJodoh() {
  __tempSoal.kiri.push("");
  __tempSoal.kanan.push("");
  renderJodohList();
}
function hapusJodoh(i) {
  __tempSoal.kiri.splice(i, 1);
  __tempSoal.kanan.splice(i, 1);
  if (!__tempSoal.kiri.length) { __tempSoal.kiri = [""]; __tempSoal.kanan = [""]; }
  renderJodohList();
}

/* =========================================================
   SIMPAN SOAL → SUPABASE
   ========================================================= */
async function simpanSoal() {
  const pertanyaan = document.getElementById("so-pertanyaan").value.trim();
  if (!pertanyaan) { showToast("Pertanyaan wajib.", "error"); return; }
  __tempSoal.pertanyaan = pertanyaan;
  __tempSoal.mapel_kode = document.getElementById("so-mapel").value;
  __tempSoal.kelas = document.getElementById("so-kelas").value;
  __tempSoal.topik = document.getElementById("so-topik").value.trim();
  __tempSoal.pembahasan = document.getElementById("so-pembahasan").value.trim();

  // Validasi per jenis
  const j = __tempSoal.jenis;
  if (j === "PG") {
    if (!__tempSoal.jawaban.kunci) { showToast("Pilih kunci jawaban.", "error"); return; }
    if (!__tempSoal.pilihan.A || !__tempSoal.pilihan.B || !__tempSoal.pilihan.C || !__tempSoal.pilihan.D) {
      showToast("Isi semua pilihan A-D.", "error"); return;
    }
  } else if (j === "PGK") {
    if (!Array.isArray(__tempSoal.jawaban.kunci) || __tempSoal.jawaban.kunci.length < 2) {
      showToast("PGK harus punya minimal 2 kunci.", "error"); return;
    }
  } else if (j === "ISIAN") {
    const arr = (__tempSoal.jawaban.kunci || []).filter(Boolean);
    if (!arr.length) { showToast("Isi minimal 1 alternatif jawaban.", "error"); return; }
  } else if (j === "MENJODOHKAN") {
    if (__tempSoal.kiri.length < 2) { showToast("Minimal 2 pasangan.", "error"); return; }
    if (__tempSoal.kiri.some(k => !k) || __tempSoal.kanan.some(k => !k)) { showToast("Lengkapi semua pasangan.", "error"); return; }
  } else if (j === "URAIAN") {
    if (!__tempSoal.jawaban.kunci) { showToast("Isi kunci jawaban uraian.", "error"); return; }
  }

  // Susun payload
  const payload = {
    jenis: j,
    mapel_kode: __tempSoal.mapel_kode,
    kelas: __tempSoal.kelas,
    topik: __tempSoal.topik,
    pertanyaan: __tempSoal.pertanyaan,
    tingkat: __tempSoal.tingkat,
    pembahasan: __tempSoal.pembahasan,
    pilihan: {},
    jawaban: {},
    skor: 1
  };
  if (j === "PG" || j === "PGK") {
    payload.pilihan = { A: __tempSoal.pilihan.A, B: __tempSoal.pilihan.B, C: __tempSoal.pilihan.C, D: __tempSoal.pilihan.D };
    payload.jawaban = { kunci: __tempSoal.jawaban.kunci };
  } else if (j === "ISIAN") {
    payload.pilihan = null;
    payload.jawaban = { kunci: (__tempSoal.jawaban.kunci || []).filter(Boolean) };
  } else if (j === "MENJODOHKAN") {
    payload.pilihan = { kiri: __tempSoal.kiri, kanan: __tempSoal.kanan };
    payload.jawaban = { pasangan: __tempSoal.pasangan };
  } else if (j === "URAIAN") {
    payload.pilihan = null;
    payload.jawaban = { kunci: __tempSoal.jawaban.kunci };
  }

  showLoading(true, "Menyimpan soal...");
  try {
    if (__editSoalId) {
      await sbUpsert("bank_soal", [{ id: __editSoalId, ...payload, updated_at: new Date().toISOString() }]);
    } else {
      await sbInsert("bank_soal", [{ ...payload }]);
    }
    showLoading(false);
    showToast("✓ Soal tersimpan.", "success");
    closeModal();
    refreshBankSoal();
  } catch (err) {
    showLoading(false);
    showToast("Gagal simpan soal: " + err.message, "error");
  }
}

function renderJawabanPreview(s) {

  const pilihan = s.pilihan || {};
  const jawaban = s.jawaban || {};

    return `<div class="mt-1.5 grid grid-cols-2 gap-1 text-[10px]">
      ${["A","B","C","D"].map(k => `<div class="${jawaban.kunci === k ? 'text-emerald-700 font-bold' : 'text-slate-600'}"><b>${k}.</b> ${esc(pilihan[k] || "")}</div>`).join("")}
    </div>`;
  }
  if (j === "PGK") {
    const kunci = jawaban.kunci || [];
    return `<div class="mt-1.5 grid grid-cols-2 gap-1 text-[10px]">
      ${["A","B","C","D"].map(k => `<div class="${kunci.includes(k) ? 'text-emerald-700 font-bold' : 'text-slate-600'}"><b>${k}.</b> ${esc(pilihan[k] || "")}</div>`).join("")}
    </div>`;
  }
  if (j === "ISIAN") {
    return `<div class="mt-1.5 text-[10px] text-emerald-700"><b>Kunci:</b> ${(jawaban.kunci || []).map(esc).join(" / ")}</div>`;
  }
  if (j === "MENJODOHKAN") {
    const kiri = pilihan.kiri || [];
    const kanan = pilihan.kanan || [];
    return `<div class="mt-1.5 space-y-0.5 text-[10px]">
      ${kiri.map((k, i) => `<div class="text-slate-600">• <b>${esc(k)}</b> → ${esc(kanan[i] || "")}</div>`).join("")}
    </div>`;
  }
  if (j === "URAIAN") {
    return `<div class="mt-1.5 text-[10px] text-emerald-700"><b>Kunci:</b> ${esc((jawaban.kunci || "").slice(0, 120))}${(jawaban.kunci || "").length > 120 ? "..." : ""}</div>`;
  }
  return "";
}

async function toggleSoalDiPaket(paketId, soalId, checked) {

      // Dapat urutan berikutnya

async function jalankanGenerateAI() {
  const apiKey = getGeminiKey();
  if (!apiKey) { showToast("API Key Gemini belum diset.", "error"); return; }

  const topik = document.getElementById("ai-topik").value.trim();
  const mapel = document.getElementById("ai-mapel").value;
  const kelas = document.getElementById("ai-kelas").value;
  const numPG = Number(document.getElementById("ai-num-pg").value) || 0;
  const numPGK = Number(document.getElementById("ai-num-pgk").value) || 0;
  const numJodoh = Number(document.getElementById("ai-num-jodoh").value) || 0;
  const numIsian = Number(document.getElementById("ai-num-isian").value) || 0;
  const numUraian = Number(document.getElementById("ai-num-uraian").value) || 0;

  if (!topik) { showToast("Isi topik.", "error"); return; }
  if (!mapel) { showToast("Pilih mapel.", "error"); return; }
  if (!kelas) { showToast("Pilih kelas.", "error"); return; }
  const total = numPG + numPGK + numJodoh + numIsian + numUraian;
  if (total === 0) { showToast("Minimal 1 soal.", "error"); return; }

  const btn = document.getElementById("ai-gen-btn");
  const loader = document.getElementById("ai-loader");
  const loaderText = document.getElementById("ai-loader-text");
  const out = document.getElementById("ai-out");
  btn.disabled = true;
  loader.classList.remove("hidden");
  out.classList.add("hidden");
  loaderText.textContent = `Menghubungi Gemini... (${total} soal)`;

  const systemPrompt = "Anda adalah asisten pembuatan soal kurikulum SD di Indonesia kelas 4-6. Selalu jawab dalam format JSON terstruktur valid, tanpa penjelasan tambahan.";
  const userPrompt = `
Buatkan soal untuk mata pelajaran "${mapel}" kelas "${kelas}" dengan topik materi "${topik}".

Jumlah soal yang diminta:
- Pilihan Ganda (PG): ${numPG} soal
- PG Kompleks (PGK): ${numPGK} soal
- Menjodohkan (MENJODOHKAN): ${numJodoh} soal
- Isian Singkat (ISIAN): ${numIsian} soal
- Uraian (URAIAN): ${numUraian} soal

Format output: array JSON. Setiap elemen objek dengan properti:
{
  "jenis": "PG" | "PGK" | "MENJODOHKAN" | "ISIAN" | "URAIAN",
  "pertanyaan": "teks soal",
  "pilihan": { "A": "...", "B": "...", "C": "...", "D": "..." },
  "jawaban": { "kunci": "A" },
  "pembahasan": "penjelasan"
}

Aturan per jenis:
- PG: pilihan A-D + jawaban.kunci = "A"|"B"|"C"|"D"
- PGK: pilihan A-D + jawaban.kunci = ["A","C"] (array minimal 2)
- MENJODOHKAN: pilihan = { "kiri": ["soal1","soal2"], "kanan": ["jawab1","jawab2"] }, jawaban = { "pasangan": [[0,0],[1,1]] }
- ISIAN: pilihan = null, jawaban = { "kunci": ["alternatif1","alternatif2"] }
- URAIAN: pilihan = null, jawaban = { "kunci": "kunci jawaban lengkap" }

Untuk MENJODOHKAN, kiri dan kanan harus array dengan jumlah sama, minimal 3 pasang.
Jawab hanya array JSON, tanpa markdown, tanpa penjelasan.`;

  const schema = {
    type: "ARRAY",
    items: {
      type: "OBJECT",
      properties: {
        jenis: { type: "STRING" },
        pertanyaan: { type: "STRING" },
        pilihan: { type: "OBJECT" },
        jawaban: { type: "OBJECT" },
        pembahasan: { type: "STRING" }
      },
      required: ["jenis", "pertanyaan", "jawaban"]
    }
  };

  try {
    const result = await fetchGeminiWithRetry(userPrompt, systemPrompt, apiKey, schema);
    const jsonText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!jsonText) throw new Error("Respons kosong dari Gemini.");

    let soalArr;
    try { soalArr = JSON.parse(jsonText); }
    catch(e) {
      // Coba ekstrak array JSON dari markdown code block
      const m = jsonText.match(/\[[\s\S]*\]/);
      if (m) soalArr = JSON.parse(m[0]);
      else throw new Error("Format JSON dari AI tidak valid.");
    }
    if (!Array.isArray(soalArr) || !soalArr.length) throw new Error("AI tidak mengembalikan soal.");

    loader.classList.add("hidden");
    out.classList.remove("hidden");
    out.innerHTML = `
      <div class="font-bold text-emerald-700 mb-3"><i class="fa-solid fa-circle-check"></i> Berhasil generate ${soalArr.length} soal</div>
      <div class="space-y-2 mb-4">
        ${soalArr.map((s, i) => {
          const j = JENIS_SOAL[s.jenis] || JENIS_SOAL.PG;
          return `<div class="p-2 bg-white border rounded-lg">
            <div class="text-[10px] font-bold text-indigo-600 mb-1">${i+1}. ${esc(j.label)}</div>
            <div class="text-xs">${esc(s.pertanyaan || "")}</div>
          </div>`;
        }).join("")}
      </div>
      <div class="flex flex-wrap gap-2">
        <button onclick="simpanHasilAI()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl font-bold text-xs"><i class="fa-solid fa-save"></i> Simpan Semua ke Bank Soal</button>
        <button onclick="document.getElementById('ai-out').classList.add('hidden')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl font-bold text-xs">Tutup</button>
      </div>`;

    window.__hasilAI = soalArr.map(s => ({
      jenis: s.jenis,
      pertanyaan: s.pertanyaan,
      pilihan: s.pilihan || null,
      jawaban: s.jawaban || {},
      pembahasan: s.pembahasan || "",
      mapel_kode: mapel,
      kelas,
      topik,
      tingkat: "sedang",
      skor: 1
    }));

  } catch (err) {
    loader.classList.add("hidden");
    out.classList.remove("hidden");
    out.innerHTML = `<div class="text-red-600 text-xs"><b>Gagal:</b> ${esc(err.message)}</div>`;
    showToast("Gagal generate: " + err.message, "error");
  } finally {
    btn.disabled = false;
  }
}

async function simpanHasilAI() {
  if (!window.__hasilAI || !window.__hasilAI.length) { showToast("Tidak ada soal untuk disimpan.", "error"); return; }
  showLoading(true, `Menyimpan ${window.__hasilAI.length} soal...`);
  try {
    let ok = 0;
    // Batch insert (chunk 50)
    const chunks = [];
    for (let i = 0; i < window.__hasilAI.length; i += 50) chunks.push(window.__hasilAI.slice(i, i + 50));
    for (const chunk of chunks) {
      await sbInsert("bank_soal", chunk);
      ok += chunk.length;
    }
    showLoading(false);
    showToast(`✓ ${ok} soal disimpan ke Bank Soal.`, "success");
    window.__hasilAI = null;
    document.getElementById("ai-out").classList.add("hidden");
    // Reset form
    document.getElementById("ai-topik").value = "";
    document.getElementById("ai-num-pg").value = 5;
    document.getElementById("ai-num-pgk").value = 0;
    document.getElementById("ai-num-jodoh").value = 0;
    document.getElementById("ai-num-isian").value = 0;
    document.getElementById("ai-num-uraian").value = 0;
    // Refresh bank soal count
  } catch (err) {
    showLoading(false);
    showToast("Gagal simpan: " + err.message, "error");
  }
}

async function exportPaketJSON(id) {
  try {
    const paket = (await sbFetch("paket_soal", `?id=eq.${id}&limit=1`))?.[0];
    const items = await sbFetch("paket_soal_items", `?paket_id=eq.${id}`);
    const ids = items.map(it => it.soal_id).filter(Boolean);
    const soals = ids.length ? await sbFetch("bank_soal", `?id=in.(${ids.map(i => `"${i}"`).join(",")})`) : [];
    const links = kmGetLinks(id);
    const data = { paket, soal: soals, links, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `paket_${(paket?.nama || "quiz").replace(/[^a-z0-9]/gi, "_")}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast("Paket diekspor.", "success");
  } catch (err) { showToast("Gagal export: " + err.message, "error"); }
}

    e.preventDefault();
    // Cari tombol simpan di modal
    const saveBtn = document.querySelector('#modal-body button[onclick*="simpan"]');
    if (saveBtn) saveBtn.click();
  }
  // ESC → tutup modal
  if (e.key === "Escape") {
    const modal = document.getElementById("modal-container");
    if (modal && !modal.classList.contains("hidden")) closeModal();
  }
});

</script>
