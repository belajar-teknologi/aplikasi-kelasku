<script>
/* =========================================================
   KONFIGURASI & STATE GLOBAL (Sama Persis dengan Game Kelas)
   ========================================================= */
const STORAGE = {
  USER: "edusmart_user",
  APP_CONFIG: "edusmart_app_config",
  JSONBIN_KEY: "edusmart_jsonbin_api_key",
  JSONBIN_TYPE: "edusmart_jsonbin_key_type",
  DB_LOCAL: "edusmart_db"
};

let studentsData = [];        // [{ id, nama, kelas, foto }]
let appConfig = null;         // { binId, namaSekolah, kelas }
let fullDb = null;            // data dari JSONBin
let supabaseClient = null;    // Supabase client

/* Player aktif (guru atau siswa) */
let currentPlayer = null;     // { id, nama, kelas, foto, role }

/* Timers & Audio FX */
let gameInterval = null;
let gameTimer = null;
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'correct') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15); // A5
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
      osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.2); // A2
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'pop') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }
  } catch(e) {}
}

/* =========================================================
   HELPER DASAR
   ========================================================= */
function safeParse(s) { try { return JSON.parse(s); } catch(e) { return null; } }
const getLS = (k, d="") => localStorage.getItem(k) || d;
const setLS = (k, v) => localStorage.setItem(k, v);

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function showToast(message, type = 'info') {
  const toast = document.getElementById('toast-message');
  const toastText = document.getElementById('toast-text');
  const toastIcon = document.getElementById('toast-icon');
  toastText.textContent = message;
  if (type === 'success') toastIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-xl';
  else if (type === 'error') toastIcon.className = 'fa-solid fa-circle-xmark text-rose-400 text-xl';
  else if (type === 'warning') toastIcon.className = 'fa-solid fa-triangle-exclamation text-amber-400 text-xl';
  else toastIcon.className = 'fa-solid fa-circle-info text-sky-400 text-xl';
  toast.classList.remove('hidden');
  clearTimeout(window.__toastTimeout);
  window.__toastTimeout = setTimeout(() => toast.classList.add('hidden'), 3000);
}

/* =========================================================
   SUPABASE CONFIG DARI JSONBIN (db.cfg)
   ========================================================= */
function initSupabaseFromDb(db) {
  const sbUrl = db?.cfg?.sbUrl || "";
  const sbKey = db?.cfg?.sbKey || "";
  if (sbUrl && sbKey && window.supabase) {
    try {
      supabaseClient = window.supabase.createClient(sbUrl, sbKey);
      console.log("[ArcadeKelas] Supabase siap (dari db.cfg)");
      return true;
    } catch (e) {
      console.error("[ArcadeKelas] Supabase init error:", e);
      supabaseClient = null;
    }
  }
  supabaseClient = null;
  return false;
}

/* =========================================================
   FETCH JSONBIN
   ========================================================= */
async function fetchJsonBinData(binId, opts = {}) {
  const apiKey = (opts.apiKey !== undefined ? opts.apiKey : getLS(STORAGE.JSONBIN_KEY)).trim();
  const keyType = (opts.keyType || getLS(STORAGE.JSONBIN_TYPE, "master")).toLowerCase();

  const headers = {};
  if (apiKey) {
    headers[keyType === "access" ? "X-Access-Key" : "X-Master-Key"] = apiKey;
  }

  const url = `https://api.jsonbin.io/v3/b/${encodeURIComponent(binId)}/latest?meta=false&t=${Date.now()}`;
  const res = await fetch(url, { cache: "no-store", headers });

  if (!res.ok) {
    if (res.status === 401 || res.status === 403) throw new Error("Akses JSONBin ditolak. Bin Private? Cek API key.");
    if (res.status === 404) throw new Error("Bin ID tidak ditemukan.");
    throw new Error(`Gagal ambil data JSONBin (HTTP ${res.status}).`);
  }
  const data = await res.json();
  return data.record || data;
}

/* =========================================================
   NORMALISASI DATA SISWA
   ========================================================= */
function normalizeStudents(db) {
  const rawSw = db.sw || db.siswa || db.students || [];
  if (!Array.isArray(rawSw)) return [];
  return rawSw.map((s, idx) => {
    if (Array.isArray(s)) {
      const fotoUrl = s[11] ? String(s[11]).trim() : "";
      return {
        id: s[0] || `S${idx + 1}`,
        noAbsen: s[1] || idx + 1,
        nis: s[2] || "",
        nama: s[3] || `Siswa ${idx + 1}`,
        kelas: s[4] || "",
        jk: s[5] || "",
        foto: (fotoUrl && fotoUrl !== "null" && fotoUrl !== "undefined") ? fotoUrl : ""
      };
    }
    const fotoUrl = (s.foto || s.fotoUrl || s.photo || "").trim();
    return {
      id: s.id || `S${idx + 1}`,
      noAbsen: s.noAbsen || idx + 1,
      nis: s.nis || "",
      nama: s.nama || s.name || `Siswa ${idx + 1}`,
      kelas: s.kelas || "",
      jk: s.jk || "",
      foto: (fotoUrl && fotoUrl !== "null" && fotoUrl !== "undefined") ? fotoUrl : ""
    };
  }).filter(s => s.nama && !s.nama.toLowerCase().includes("tanpa nama"));
}

/* =========================================================
   PLAYER HELPER — Deteksi Guru / Siswa
   ========================================================= */
function getPlayerAktif() {
  const user = safeParse(getLS(STORAGE.USER));
  if (!user) return null;
  
  if (user.role === "guru") {
    return {
      id: "guru_" + String(user.username || user.name || "unknown")
            .toLowerCase()
            .replace(/[^a-z0-9]/g, "_")
            .slice(0, 40),
      nama: user.name || "Guru",
      kelas: user.kelas || "",
      foto: fullDb?.a?.fg || user.foto || "",
      role: "guru"
    };
  }
  
  if (user.role === "siswa") {
    const sw = (fullDb?.sw || []).find(s => String(s[0]) === String(user.siswaId));
    return {
      id: String(user.siswaId || ""),
      nama: user.name || (sw ? sw[3] : "Siswa"),
      kelas: user.kelas || (sw ? sw[4] : ""),
      foto: sw ? (sw[11] || "") : "",
      role: "siswa"
    };
  }
  
  return null;
}

function cekPunyaFoto(player) {
  if (!player) return false;
  const foto = String(player.foto || "").trim();
  if (!foto || foto === "null" || foto === "undefined") return false;
  return foto.startsWith("http") || foto.startsWith("data:");
}

function getPemainSiap() {
  const player = getPlayerAktif();
  const hasil = [];
  
  if (player && player.role === "guru" && cekPunyaFoto(player)) {
    hasil.push({ ...player, isGuru: true });
  }
  
  studentsData.forEach(s => {
    const foto = String(s.foto || "").trim();
    if (foto && (foto.startsWith("http") || foto.startsWith("data:"))) {
      hasil.push({ ...s, isGuru: false });
    }
  });
  
  return hasil;
}

function playerSiapMain() {
  return cekPunyaFoto(getPlayerAktif());
}

/* =========================================================
   AUTO-LOGIN DARI LOCALSTORAGE
   ========================================================= */
async function tryAutoLogin() {
  const user = safeParse(getLS(STORAGE.USER));
  if (!user || (user.role !== "siswa" && user.role !== "guru")) {
    return { ok: false, alasan: "belum_login" };
  }

  const cfg = safeParse(getLS(STORAGE.APP_CONFIG));
  if (!cfg?.binId) return { ok: false, alasan: "belum_setup", user };

  try {
    const db = await fetchJsonBinData(cfg.binId);
    const students = normalizeStudents(db);

    if (user.role === "siswa" && students.length < 4) {
      throw new Error(`Data siswa kurang dari 4 (ada ${students.length}). Minimal 4 siswa untuk main game.`);
    }

    appConfig = { kode: "AUTO", binId: cfg.binId, namaSekolah: db?.a?.ns || user.sekolah || "Sekolah", kelas: user.kelas || "" };
    fullDb = db;
    studentsData = students;

    currentPlayer = getPlayerAktif();
    const sbReady = initSupabaseFromDb(db);
    setLS(STORAGE.DB_LOCAL, JSON.stringify(db));

    return { ok: true, user, sbReady, player: currentPlayer };
  } catch (err) {
    const cached = safeParse(getLS(STORAGE.DB_LOCAL));
    if (cached) {
      const students = normalizeStudents(cached);
      if (user.role === "siswa" && students.length < 4) {
        return { ok: false, alasan: "gagal_fetch", user, error: `Data siswa kurang dari 4 (cache: ${students.length})` };
      }
      fullDb = cached;
      studentsData = students;
      appConfig = { kode: "CACHE", binId: cfg.binId, namaSekolah: cached?.a?.ns || user.sekolah || "Sekolah", kelas: user.kelas || "" };
      currentPlayer = getPlayerAktif();
      initSupabaseFromDb(cached);
      return { ok: true, user, fromCache: true, player: currentPlayer };
    }
    return { ok: false, alasan: "gagal_fetch", user, error: err.message };
  }
}

/* =========================================================
   SCREEN ROUTER & SCREENS
   ========================================================= */
function showScreen(screenId) {
  if (gameInterval) clearInterval(gameInterval);
  if (gameTimer) clearInterval(gameTimer);

  if (screenId === "menu-screen") renderMenuScreen();
  else if (screenId === "setup-screen") renderSetupScreen();
  else if (screenId === "belum-login-screen") renderBelumLoginScreen();
}

async function handleSetupSubmit() {
  const binId = (document.getElementById("setup-bin-id").value || "").trim();
  const apiKey = (document.getElementById("setup-api-key").value || "").trim();
  const btn = document.getElementById("setup-submit-btn");
  const statusEl = document.getElementById("setup-status");

  if (!binId) { showToast("Bin ID wajib diisi.", "error"); return; }

  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menghubungkan...';
  statusEl.classList.remove("hidden");
  statusEl.className = "text-center p-3 rounded-xl text-xs font-semibold bg-sky-950/80 text-sky-300 border border-sky-800";
  statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengambil data siswa...';

  try {
    const db = await fetchJsonBinData(binId, { apiKey, keyType: "master" });
    const students = normalizeStudents(db);
    const user = safeParse(getLS(STORAGE.USER)) || {};
    
    if (user.role === "siswa" && students.length < 4) {
      throw new Error(`Data siswa kurang dari 4 (ada ${students.length})`);
    }

    setLS(STORAGE.APP_CONFIG, JSON.stringify({ binId }));
    if (apiKey) {
      setLS(STORAGE.JSONBIN_KEY, apiKey);
      setLS(STORAGE.JSONBIN_TYPE, "master");
    }

    fullDb = db;
    studentsData = students;
    appConfig = { kode: "SETUP", binId, namaSekolah: db?.a?.ns || user.sekolah || "Sekolah", kelas: user.kelas || "" };
    currentPlayer = getPlayerAktif();

    const sbReady = initSupabaseFromDb(db);
    setLS(STORAGE.DB_LOCAL, JSON.stringify(db));

    statusEl.className = "text-center p-3 rounded-xl text-xs font-semibold bg-emerald-950/80 text-emerald-300 border border-emerald-800";
    statusEl.innerHTML = `<i class="fa-solid fa-circle-check"></i> Berhasil! ${students.length} siswa dimuat.`;

    showToast("Berhasil terhubung!", "success");
    setTimeout(() => showScreen("menu-screen"), 700);
  } catch (err) {
    statusEl.className = "text-center p-3 rounded-xl text-xs font-semibold bg-rose-950/80 text-rose-300 border border-rose-800";
    statusEl.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> ${esc(err.message)}`;
    showToast("Gagal: " + err.message, "error");
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-link mr-1"></i> Hubungkan';
  }
}

/* =========================================================
   SIMPAN SKOR (Sama Persis Supabase Schema)
   ========================================================= */
async function saveScoreToSupabase({ gameId, skor, jumlahBenar, jumlahSalah, waktuMulai, waktuSelesai, detail }) {
  const player = getPlayerAktif();
  if (!player) {
    showToast("Player tidak terdeteksi. Coba login ulang.", "error");
    return;
  }
  
  const siswaId = String(player.id);
  const kelas = String(player.kelas || appConfig?.kelas || "Unspecified");
  const durasiDetik = Math.max(1, Math.round((waktuSelesai - waktuMulai) / 1000));
  const namaSiswa = player.nama || "Pemain";
  const role = player.role || "siswa";

  const payload = {
    siswa_id: siswaId,
    kelas: kelas,
    game_id: String(gameId),
    skor: parseInt(skor) || 0,
    jumlah_benar: parseInt(jumlahBenar) || 0,
    jumlah_salah: parseInt(jumlahSalah) || 0,
    waktu_mulai: waktuMulai.toISOString(),
    waktu_selesai: waktuSelesai.toISOString(),
    durasi_detik: durasiDetik,
    detail: { ...(detail || {}), role: role }
  };

  // 1. Simpan Lokal
  const localScores = safeParse(getLS("gamekelas_local_scores")) || [];
  localScores.unshift({
    ...payload,
    nama_siswa: namaSiswa,
    role: role,
    created_at: new Date().toISOString()
  });
  setLS("gamekelas_local_scores", JSON.stringify(localScores.slice(0, 50)));

  // 2. Simpan ke Supabase
  if (supabaseClient) {
    try {
      const { error } = await supabaseClient.from("skor_game").insert([payload]);
      if (error) {
        console.error("Supabase insert error:", error);
        showToast("Skor tersimpan lokal (gagal ke server).", "warning");
      } else {
        const badge = role === "guru" ? " (Guru)" : "";
        showToast(`Skor tersimpan ke server${badge}! ☁️`, "success");
      }
    } catch (err) {
      console.error("Exception:", err);
      showToast("Skor tersimpan lokal.", "info");
    }
  } else {
    showToast("Skor tersimpan lokal.", "info");
  }

  setTimeout(() => refreshScoreboard(), 500);
}

/* =========================================================
   PAPAN SKOR
   ========================================================= */
async function refreshScoreboard() {
  const section = document.getElementById("scoreboard-section");
  const list = document.getElementById("scoreboard-list");
  if (!section || !list) return;

  section.classList.remove("hidden");
  const player = getPlayerAktif();
  const myId = String(player?.id || "");

  list.innerHTML = `<p class="text-center text-slate-500 py-4 text-xs"><i class="fa-solid fa-spinner fa-spin"></i> Memuat...</p>`;

  try {
    let scores = [];
    if (supabaseClient) {
      try {
        const { data, error } = await supabaseClient
          .from("skor_game")
          .select("*")
          .order("created_at", { ascending: false })
          .limit(10);
        if (!error && data) scores = data;
      } catch (e) {}
    }

    if (!scores.length) {
      const local = safeParse(getLS("gamekelas_local_scores")) || [];
      scores = local.slice(0, 10);
    }

    if (!scores.length) {
      list.innerHTML = `<p class="text-center text-slate-500 py-4 text-xs">Belum ada skor tersimpan. Ayo main sekarang!</p>`;
      return;
    }

    const gameInfo = {
      "tangkap_teman": { icon: "fa-hand-holding-heart", color: "bg-amber-500/20 text-amber-400", label: "Tangkap Teman" },
      "match_kilat": { icon: "fa-bolt", color: "bg-pink-500/20 text-pink-400", label: "Match Kilat" },
      "pop_balon": { icon: "fa-circle-dot", color: "bg-purple-500/20 text-purple-400", label: "Pop Balon" },
      "bayangan_misteri": { icon: "fa-user-secret", color: "bg-emerald-500/20 text-emerald-400", label: "Bayangan Misteri" }
    };

    list.innerHTML = scores.map(item => {
      const isMe = String(item.siswa_id) === myId;
      const info = gameInfo[item.game_id] || { icon: "fa-gamepad", color: "bg-slate-800 text-slate-300", label: item.game_id };
      
      let pNama = item.nama_siswa || `ID ${item.siswa_id}`;
      const isGuru = item.detail?.role === "guru" || String(item.siswa_id).startsWith("guru_");
      
      return `
        <div class="score-row flex items-center gap-2 p-2.5 rounded-xl ${isMe ? 'bg-amber-500/10 border border-amber-500/40' : 'bg-slate-800/60 border border-slate-700/50'}">
          <div class="w-8 h-8 rounded-lg ${info.color} flex items-center justify-center shrink-0 border border-slate-700">
            <i class="fa-solid ${info.icon} text-xs"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="font-bold text-[11px] truncate ${isMe ? 'text-amber-300' : 'text-slate-200'} flex items-center">
              ${esc(pNama)} ${isGuru ? '<span class="text-[8px] bg-indigo-600 text-white px-1 py-0.5 rounded-full font-bold ml-1">GURU</span>' : ''}
              ${isMe ? ' <span class="text-[8px] bg-amber-500 text-slate-950 px-1.5 py-0.5 rounded-full font-bold ml-1">KAMU</span>' : ''}
            </div>
            <div class="text-[10px] text-slate-400 truncate">
              ${esc(info.label)} · ✓${item.jumlah_benar || 0} ✗${item.jumlah_salah || 0}
            </div>
          </div>
          <div class="text-right shrink-0">
            <div class="font-black text-sm ${isMe ? 'text-amber-400' : 'text-purple-400'}">${item.skor || 0}</div>
            <div class="text-[9px] text-slate-500">${item.durasi_detik || 0}s</div>
          </div>
        </div>`;
    }).join("");

  } catch (err) {
    list.innerHTML = `<p class="text-center text-rose-400 py-4 text-xs">Gagal memuat papan skor.</p>`;
  }
}

      </div>
    </div>`;

  function spawnAvatar() {
    const playArea = document.getElementById("play-area");
    if (!playArea) return;

    const isTarget = Math.random() < 0.45;
    const p = isTarget ? targetPemain : pemainList[Math.floor(Math.random() * pemainList.length)];

    const avatar = document.createElement("div");
    avatar.className = "absolute cursor-pointer rounded-full p-1 bg-slate-800 border-2 border-amber-400 shadow-lg hover:scale-110 transition-transform";
    
    const size = 56;
    const posX = Math.random() * (playArea.clientWidth - size);
    avatar.style.left = `${posX}px`;
    avatar.style.bottom = `-60px`;
    avatar.style.width = `${size}px`;
    avatar.style.height = `${size}px`;

    avatar.innerHTML = `<img src="${esc(p.foto)}" class="w-full h-full rounded-full object-cover pointer-events-none" onerror="this.src='https://placehold.co/100?text=Err'">`;

    let posPosY = -60;
    const speed = 2 + Math.random() * 2.5;

    const moveAnim = setInterval(() => {
      posPosY += speed;
      avatar.style.bottom = `${posPosY}px`;

      if (posPosY > playArea.clientHeight) {
        clearInterval(moveAnim);
        if (avatar.parentNode) playArea.removeChild(avatar);
        if (p.id === targetPemain.id) {
          // Missed target
          lives--;
          updateLivesDisplay();
          playSound('wrong');
          if (lives <= 0) endGame();
        }
      }
    }, 20);

    avatar.onclick = () => {
      clearInterval(moveAnim);
      if (avatar.parentNode) playArea.removeChild(avatar);

      if (p.id === targetPemain.id) {
        score += 100;
        correctHits++;
        playSound('correct');
        document.getElementById("game-score").textContent = score;

        // Switch new target every 3 hits
        if (correctHits % 3 === 0) {
          targetPemain = pemainList[Math.floor(Math.random() * pemainList.length)];
          document.getElementById("target-name").textContent = targetPemain.nama;
        }
      } else {
        score = Math.max(0, score - 30);
        wrongHits++;
        lives--;
        playSound('wrong');
        document.getElementById("game-score").textContent = score;
        updateLivesDisplay();
        if (lives <= 0) endGame();
      }
    };

    playArea.appendChild(avatar);
  }

  function updateLivesDisplay() {
    const el = document.getElementById("game-lives");
    if (el) el.textContent = "❤️".repeat(Math.max(0, lives));
  }

  gameInterval = setInterval(spawnAvatar, 1100);

  function endGame() {
    clearInterval(gameInterval);
    const endTime = new Date();
    saveScoreToSupabase({
      gameId: "tangkap_teman",
      skor: score,
      jumlahBenar: correctHits,
      jumlahSalah: wrongHits,
      waktuMulai: startTime,
      waktuSelesai: endTime,
      detail: { mode: "Arcade Tangkap" }

      </div>`;
  }
}

/* =========================================================
   GAME 2: MATCH KILAT BENAR / SALAH (3-Sec Rapid Quiz)
   ========================================================= */
function startKilatGame() {
  const pemainList = getPemainSiap();
  if (pemainList.length < 2) {
    showToast("Minimal butuh 2 pemain berpoto!", "error");
    return;
  }

  const container = document.getElementById("main-view-container");
  let score = 0;
  let correctHits = 0;
  let wrongHits = 0;
  let timerVal = 30;
  let currentPair = null;
  const startTime = new Date();

  function nextRound() {
    const isCorrectPair = Math.random() < 0.5;
    const photoPlayer = pemainList[Math.floor(Math.random() * pemainList.length)];
    let namePlayer = photoPlayer;

    if (!isCorrectPair) {
      const others = pemainList.filter(p => p.id !== photoPlayer.id);
      namePlayer = others[Math.floor(Math.random() * others.length)];
    }

    currentPair = { photoPlayer, namePlayer, isCorrect: photoPlayer.id === namePlayer.id };

    const imgEl = document.getElementById("kilat-img");
    const nameEl = document.getElementById("kilat-name");

    if (imgEl && nameEl) {
      imgEl.src = photoPlayer.foto;
      nameEl.textContent = namePlayer.nama;
    }
  }

  container.innerHTML = `
    <div class="bg-slate-900/90 backdrop-blur-md rounded-3xl p-6 shadow-2xl border-2 border-pink-500/50 max-w-md mx-auto fade-in text-white text-center">
      <div class="flex justify-between items-center bg-slate-800 px-4 py-2 rounded-xl border border-slate-700 mb-4 text-xs font-bold">
        <button onclick="showScreen('menu-screen')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i> Menu</button>
        <span class="text-pink-400">Waktu: <span id="kilat-timer">30</span>s</span>
        <span class="text-amber-400">Skor: <span id="kilat-score">0</span></span>
      </div>

      <div class="mb-4">
        <p class="text-xs text-slate-400 font-sans mb-2">Apakah Foto dan Nama ini COCOK?</p>
        <div class="w-36 h-36 mx-auto rounded-2xl overflow-hidden border-4 border-pink-500 shadow-xl mb-3">
          <img id="kilat-img" src="" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/150?text=Err'">
        </div>
        <h3 id="kilat-name" class="text-xl font-black text-amber-300">Loading...</h3>
      </div>

      <div class="grid grid-cols-2 gap-3 mt-6">
        <button onclick="answerKilat(true)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-black py-4 rounded-2xl text-lg shadow-lg transition active:scale-95">
          <i class="fa-solid fa-check mr-1"></i> BENAR
        </button>
        <button onclick="answerKilat(false)" class="bg-rose-500 hover:bg-rose-600 text-white font-black py-4 rounded-2xl text-lg shadow-lg transition active:scale-95">
          <i class="fa-solid fa-xmark mr-1"></i> SALAH
        </button>
      </div>
    </div>`;

  window.answerKilat = function(userAnswer) {
    if (!currentPair) return;
    if (userAnswer === currentPair.isCorrect) {
      score += 50;
      correctHits++;
      playSound('correct');
    } else {
      score = Math.max(0, score - 20);
      wrongHits++;
      playSound('wrong');
    }
    document.getElementById("kilat-score").textContent = score;
    nextRound();
  };

  nextRound();

  gameTimer = setInterval(() => {
    timerVal--;
    const el = document.getElementById("kilat-timer");
    if (el) el.textContent = timerVal;

    if (timerVal <= 0) {
      clearInterval(gameTimer);
      const endTime = new Date();
      saveScoreToSupabase({
        gameId: "match_kilat",
        skor: score,
        jumlahBenar: correctHits,
        jumlahSalah: wrongHits,
        waktuMulai: startTime,
        waktuSelesai: endTime,
        detail: { mode: "Match Kilat 30s" }
      });

      container.innerHTML = `
        <div class="bg-slate-900/90 backdrop-blur-md rounded-3xl p-6 shadow-2xl border-2 border-pink-500 text-center max-w-md mx-auto fade-in">
          <div class="text-4xl mb-2">⚡</div>
          <h3 class="text-2xl font-black text-white mb-1">Waktu Habis!</h3>
          <p class="text-xs text-slate-400 mb-4">Total Skor Kamu: <span class="text-amber-400 font-bold text-lg">${score}</span></p>

          <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 text-xs font-sans space-y-1 mb-5">
            <div class="flex justify-between text-slate-300"><span>Tebakan Benar:</span><span class="text-emerald-400 font-bold">${correctHits}</span></div>
            <div class="flex justify-between text-slate-300"><span>Tebakan Salah:</span><span class="text-rose-400 font-bold">${wrongHits}</span></div>
          </div>

          <div class="flex gap-2">
            <button onclick="startKilatGame()" class="flex-1 bg-pink-500 hover:bg-pink-600 text-white font-bold py-2.5 rounded-xl text-xs transition">Main Lagi</button>
            <button onclick="showScreen('menu-screen')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 rounded-xl text-xs transition">Menu</button>
          </div>
        </div>`;
    }
  }, 1000);
}

/* =========================================================
   GAME 4: BAYANGAN MISTERI (Blur Reveal Guess)
   ========================================================= */
function startBayanganGame() {
  const pemainList = getPemainSiap();
  if (pemainList.length < 4) {
    showToast("Minimal 4 pemain berpoto untuk mode ini!", "error");
    return;
  }

  const container = document.getElementById("main-view-container");
  let score = 0;
  let correctHits = 0;
  let wrongHits = 0;
  let roundCount = 0;
  const maxRounds = 5;
  let currentTarget = null;
  let blurVal = 20;
  let blurTimer = null;
  const startTime = new Date();

  function nextRound() {
    if (roundCount >= maxRounds) {
      endGame();
      return;
    }

    roundCount++;
    blurVal = 22;
    currentTarget = pemainList[Math.floor(Math.random() * pemainList.length)];

    // Option choices (1 correct, 3 wrong)
    const wrongChoices = pemainList.filter(p => p.id !== currentTarget.id);
    const shuffledWrong = wrongChoices.sort(() => 0.5 - Math.random()).slice(0, 3);
    const choices = [currentTarget, ...shuffledWrong].sort(() => 0.5 - Math.random());

    const imgEl = document.getElementById("shadow-img");
    const optionsGrid = document.getElementById("options-grid");
    const roundEl = document.getElementById("shadow-round");

    if (roundEl) roundEl.textContent = `${roundCount}/${maxRounds}`;
    if (imgEl) {
      imgEl.src = currentTarget.foto;
      imgEl.style.filter = `blur(${blurVal}px)`;
    }

    if (blurTimer) clearInterval(blurTimer);
    blurTimer = setInterval(() => {
      blurVal = Math.max(0, blurVal - 1.5);
      if (imgEl) imgEl.style.filter = `blur(${blurVal}px)`;
      if (blurVal <= 0) clearInterval(blurTimer);
    }, 400);

    if (optionsGrid) {
      optionsGrid.innerHTML = choices.map(c => `
        <button onclick="guessBayangan('${c.id}')" class="bg-slate-800 hover:bg-emerald-600 text-white font-bold py-3 px-2 rounded-xl border border-slate-700 text-xs transition active:scale-95 truncate">
          ${esc(c.nama)}
        </button>
      `).join("");
    }
  }

  container.innerHTML = `
    <div class="bg-slate-900/90 backdrop-blur-md rounded-3xl p-6 shadow-2xl border-2 border-emerald-500/50 max-w-md mx-auto fade-in text-white text-center">
      <div class="flex justify-between items-center bg-slate-800 px-4 py-2 rounded-xl border border-slate-700 mb-4 text-xs font-bold">
        <button onclick="showScreen('menu-screen')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i> Menu</button>
        <span class="text-emerald-400">Ronde: <span id="shadow-round">1/5</span></span>
        <span class="text-amber-400">Skor: <span id="shadow-score">0</span></span>
      </div>

      <div class="mb-4">
        <p class="text-xs text-slate-400 font-sans mb-2">Siapakah sosok dibalik foto ini?</p>
        <div class="w-40 h-40 mx-auto rounded-3xl overflow-hidden border-4 border-emerald-500 shadow-2xl mb-3 bg-slate-950 flex items-center justify-center">
          <img id="shadow-img" src="" class="w-full h-full object-cover transition-all duration-300" onerror="this.src='https://placehold.co/150?text=Err'">
        </div>
      </div>

      <div id="options-grid" class="grid grid-cols-2 gap-2 mt-4"></div>
    </div>`;

  window.guessBayangan = function(selectedId) {
    if (blurTimer) clearInterval(blurTimer);
    const imgEl = document.getElementById("shadow-img");
    if (imgEl) imgEl.style.filter = "blur(0px)";

    if (selectedId === currentTarget.id) {
      const bonus = Math.round(blurVal * 5); // Speed bonus if guessed early while blurry
      const roundScore = 100 + bonus;
      score += roundScore;
      correctHits++;
      playSound('correct');
      showToast(`Tebakan Tepat! +${roundScore}`, "success");
    } else {
      wrongHits++;
      playSound('wrong');
      showToast(`Salah! Itu adalah ${currentTarget.nama}`, "error");
    }

    document.getElementById("shadow-score").textContent = score;
    setTimeout(nextRound, 1200);
  };

  nextRound();

  function endGame() {
    if (blurTimer) clearInterval(blurTimer);
    const endTime = new Date();

    saveScoreToSupabase({
      gameId: "bayangan_misteri",
      skor: score,
      jumlahBenar: correctHits,
      jumlahSalah: wrongHits,
      waktuMulai: startTime,
      waktuSelesai: endTime,
      detail: { mode: "Bayangan Misteri" }
    });

    container.innerHTML = `
      <div class="bg-slate-900/90 backdrop-blur-md rounded-3xl p-6 shadow-2xl border-2 border-emerald-500 text-center max-w-md mx-auto fade-in text-white">
        <div class="text-4xl mb-2">🕵️</div>
        <h3 class="text-2xl font-black text-white mb-1">Ronde Selesai!</h3>
        <p class="text-xs text-slate-400 mb-4">Total Skor Kamu: <span class="text-amber-400 font-bold text-lg">${score}</span></p>

        <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 text-xs font-sans space-y-1 mb-5">
          <div class="flex justify-between text-slate-300"><span>Tebakan Tepat:</span><span class="text-emerald-400 font-bold">${correctHits} / ${maxRounds}</span></div>
          <div class="flex justify-between text-slate-300"><span>Misklik:</span><span class="text-rose-400 font-bold">${wrongHits}</span></div>
        </div>

        <div class="flex gap-2">
          <button onclick="startBayanganGame()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs transition">Main Lagi</button>
          <button onclick="showScreen('menu-screen')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 rounded-xl text-xs transition">Menu</button>
        </div>
      </div>`;
  }
}

    } else {
      badge.textContent = "Gagal mengambil data";
      renderSetupScreen(auto.error || "Gagal mengambil data dari JSONBin", auto.user);
    }
  }
});
</script>
</body>
</html>
